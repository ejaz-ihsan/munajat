hi": "Neend ko aaraam ka tohfa samjho"}, "d": {"en": "We made your sleep a means of rest.", "hi": "Humne tumhari neend ko aaraam ka zariya banaaya."}, "ref": "Surah An-Naba 78:9", "url": "https://quran.com/78/9"}, {"a": {"en": "Remember Allah holds your soul at night", "hi": "Yaad rakho raat ko rooh Allah ke paas hoti hai"}, "d": {"en": "Allah takes the souls at death, and those that do not die during their sleep.", "hi": "Allah maut ke waqt roohein qabz karta hai, aur jo nahi marti unhe neend mein."}, "ref": "Surah Az-Zumar 39:42", "url": "https://quran.com/39/42"}, {"a": {"en": "Let night be night", "hi": "Raat ko raat rehne do"}, "d": {"en": "He made the night for you to rest in.", "hi": "Usne raat banaayi taaki tum usmein aaraam karo."}, "ref": "Surah Yunus 10:67", "url": "https://quran.com/10/67"}, {"a": {"en": "Read Ayat al-Kursi in bed", "hi": "Bistar par Ayat-ul-Kursi padho"}, "d": {"en": "Allah: no god but Him, the Ever-Living. Neither drowsiness nor sleep overtakes Him.", "hi": "Allah, uske siwa koi ma‘bood nahi, hamesha zinda. Na use oongh aati hai na neend."}, "ref": "Surah Al-Baqarah 2:255", "url": "https://quran.com/2/255"}], "h": [{"a": {"en": "Make wudu and lie on your right side", "hi": "Wuzu karo aur daayein karwat leto"}, "d": {"en": "The Prophet ﷺ told al-Bara’ to make wudu before bed and lie on his right side.", "hi": "Nabi ﷺ ne Bara’ (RA) se farmaaya: sone se pehle wuzu karo aur daayein karwat leto."}, "ref": "Sahih al-Bukhari 247", "url": "https://sunnah.com/bukhari:247"}, {"a": {"en": "Recite the Quls and wipe over yourself", "hi": "Qul padh kar jism par haath phero"}, "d": {"en": "He would recite Al-Ikhlas, Al-Falaq and An-Nas into his hands and wipe over his body, three times.", "hi": "Aap ﷺ Al-Ikhlas, Al-Falaq aur An-Nas haathon mein padh kar jism par pherte, teen baar."}, "ref": "Sahih al-Bukhari 5017", "url": "https://sunnah.com/bukhari:5017"}, {"a": {"en": "Say SubhanAllah, Alhamdulillah, Allahu Akbar", "hi": "SubhanAllah, Alhamdulillah, Allahu Akbar kaho"}, "d": {"en": "He taught Fatimah and Ali to say them 33, 33 and 34 times at bedtime: better for you than a servant.", "hi": "Aap ﷺ ne Fatima aur Ali (RA) ko sote waqt 33, 33, 34 baar kehna sikhaaya: yeh khaadim se behtar hai."}, "ref": "Sahih al-Bukhari 3705", "url": "https://sunnah.com/bukhari:3705"}, {"a": {"en": "Recite the last two ayat of Al-Baqarah", "hi": "Al-Baqarah ki aakhri do aayatein padho"}, "d": {"en": "Whoever recites the last two verses of Al-Baqarah at night, they will suffice him.", "hi": "Jo raat ko Al-Baqarah ki aakhri do aayatein padhe, woh uske liye kaafi hain."}, "ref": "Sahih al-Bukhari 5009", "url": "https://sunnah.com/bukhari:5009"}]}, "courage": {"q": [{"a": {"en": "Don't lose heart", "hi": "Himmat mat haaro"}, "d": {"en": "Do not weaken and do not grieve; you will be uppermost if you are believers.", "hi": "Kamzor na pado aur gham na karo; tum hi ghaalib rahoge agar momin ho."}, "ref": "Surah Aal-Imran 3:139", "url": "https://quran.com/3/139"}, {"a": {"en": "Remember small groups have won", "hi": "Yaad rakho chhoti jamaatein bhi jeeti hain"}, "d": {"en": "How many a small company has overcome a large company by Allah's permission.", "hi": "Kitni hi chhoti jamaatein Allah ke hukm se badi jamaaton par ghaalib aayi hain."}, "ref": "Surah Al-Baqarah 2:249", "url": "https://quran.com/2/249"}, {"a": {"en": "Fear Allah, not people", "hi": "Logon se nahi, Allah se daro"}, "d": {"en": "Do not fear them; fear Me, if you are believers.", "hi": "Unse na daro, mujhse daro, agar tum momin ho."}, "ref": "Surah Aal-Imran 3:175", "url": "https://quran.com/3/175"}, {"a": {"en": "Say “my Lord is with me”", "hi": "Kaho “mera Rab mere saath hai”"}, "d": {"en": "With the sea ahead and Pharaoh behind, Musa (AS) said: No! My Lord is with me; He will guide me.", "hi": "Aage samundar, peeche Firaun, Musa (AS) ne kaha: hargiz nahi! Mera Rab mere saath hai, woh raah dikhaayega."}, "ref": "Surah Ash-Shu‘ara 26:62", "url": "https://quran.com/26/62"}], "h": [{"a": {"en": "Be strong and don't feel helpless", "hi": "Mazboot bano, be-bas mat bano"}, "d": {"en": "The strong believer is better and more beloved to Allah. Seek help from Allah and do not feel helpless.", "hi": "Taaqatwar momin Allah ko zyada pyaara hai. Allah se madad maango aur himmat na haaro."}, "ref": "Sahih Muslim 2664", "url": "https://sunnah.com/muslim:2664"}, {"a": {"en": "Speak the truth to power", "hi": "Taaqat ke saamne sach bolo"}, "d": {"en": "Among the greatest jihad is a word of truth before a tyrant ruler.", "hi": "Sabse bada jihaad zaalim haakim ke saamne haq baat kehna hai."}, "ref": "Sunan Abi Dawud 4344", "url": "https://sunnah.com/abudawud:4344"}, {"a": {"en": "Seek refuge from cowardice", "hi": "Buzdili se panaah maango"}, "d": {"en": "The Prophet ﷺ regularly sought Allah's refuge from cowardice.", "hi": "Nabi ﷺ baqaaidagi se buzdili se Allah ki panaah maangte the."}, "ref": "Sahih al-Bukhari 6369", "url": "https://sunnah.com/bukhari:6369"}, {"a": {"en": "Remember relief comes with difficulty", "hi": "Yaad rakho tangi ke saath kushaadgi hai"}, "d": {"en": "Know that victory comes with patience, relief with distress, and ease with hardship.", "hi": "Jaan lo, fatah sabr ke saath hai, kushaadgi tangi ke saath, aur aasaani mushkil ke saath."}, "ref": "Musnad Ahmad 2803", "url": ""}]}, "contentment": {"q": [{"a": {"en": "Stop wishing for others' blessings", "hi": "Doosron ki nematon ki tamanna chhodo"}, "d": {"en": "Do not wish for what Allah has given some of you over others; ask Allah of His bounty.", "hi": "Us cheez ki tamanna na karo jo Allah ne doosron ko di; Allah se uska fazl maango."}, "ref": "Surah An-Nisa 4:32", "url": "https://quran.com/4/32"}, {"a": {"en": "Be grateful to receive more", "hi": "Shukr karo, aur milega"}, "d": {"en": "If you are grateful, I will surely increase you.", "hi": "Agar shukr karoge toh main aur zyada doonga."}, "ref": "Surah Ibrahim 14:7", "url": "https://quran.com/14/7"}, {"a": {"en": "Don't stare at others' worldly shine", "hi": "Doosron ki duniyavi chamak ko mat taako"}, "d": {"en": "Do not extend your eyes toward the enjoyment We gave others; your Lord's provision is better and lasting.", "hi": "Apni nazrein us saamaan ki taraf na phailao jo humne doosron ko diya; tumhare Rab ka rizq behtar aur baaqi rehne wala hai."}, "ref": "Surah Ta-Ha 20:131", "url": "https://quran.com/20/131"}, {"a": {"en": "Hold the world lightly", "hi": "Duniya ko halka pakdo"}, "d": {"en": "So that you do not despair over what you missed, nor exult over what you were given.", "hi": "Taaki jo chhoot jaaye us par gham na karo, aur jo mile us par itraao nahi."}, "ref": "Surah Al-Hadid 57:23", "url": "https://quran.com/57/23"}], "h": [{"a": {"en": "Seek richness of the heart", "hi": "Dil ki ameeri chaaho"}, "d": {"en": "Richness is not having many possessions; true richness is richness of the soul.", "hi": "Ameeri maal ki kasrat ka naam nahi, asal ameeri dil ki ameeri hai."}, "ref": "Sahih al-Bukhari 6446", "url": "https://sunnah.com/bukhari:6446"}, {"a": {"en": "Be content with enough", "hi": "Kaafi par raazi raho"}, "d": {"en": "Successful is the one who accepts Islam, is given enough, and is made content by Allah.", "hi": "Kaamyaab hai woh jo Islam laaya, use kaafi rizq mila, aur Allah ne use qanaa‘at di."}, "ref": "Sahih Muslim 1054", "url": "https://sunnah.com/muslim:1054"}, {"a": {"en": "Look at those who have less", "hi": "Kam waalon ko dekho"}, "d": {"en": "Look at those below you, not above you, so you don't belittle Allah's blessings.", "hi": "Apne se neeche waalon ko dekho, upar waalon ko nahi."}, "ref": "Sahih Muslim 2963", "url": "https://sunnah.com/muslim:2963"}, {"a": {"en": "Count today's safety, health and food", "hi": "Aaj ki hifaazat, sehat aur khaana gino"}, "d": {"en": "Whoever wakes safe, healthy and with food for the day, it is as if the whole world was given to them.", "hi": "Jo subah mehfooz, tandurust aur din bhar ke khaane ke saath uthe, goya use poori duniya mil gayi."}, "ref": "Jami‘ at-Tirmidhi 2346", "url": "https://sunnah.com/tirmidhi:2346"}]}, "parents": {"q": [{"a": {"en": "Never say even “uff” to them", "hi": "Unhe “uff” tak na kaho"}, "d": {"en": "Do not say “uff” to them or repel them, but speak to them with noble words.", "hi": "Unhe “uff” tak na kaho, na jhidko, balki izzat se baat karo."}, "ref": "Surah Al-Isra 17:23", "url": "https://quran.com/17/23"}, {"a": {"en": "Lower your wing in humility and pray for them", "hi": "Aajizi se jhuko aur unke liye dua karo"}, "d": {"en": "Lower to them the wing of humility out of mercy and say: My Lord, have mercy on them.", "hi": "Reham se unke saamne aajizi ka baazu jhukao aur kaho: Rabbir-hamhuma."}, "ref": "Surah Al-Isra 17:24", "url": "https://quran.com/17/24"}, {"a": {"en": "Thank your parents, especially your mother", "hi": "Waalidain, khaas kar maa ka shukr karo"}, "d": {"en": "His mother carried him in weakness upon weakness. Be grateful to Me and to your parents.", "hi": "Maa ne use kamzori par kamzori uthaa kar pet mein rakha. Mera aur apne waalidain ka shukr karo."}, "ref": "Surah Luqman 31:14", "url": "https://quran.com/31/14"}, {"a": {"en": "Stay kind even when you disagree", "hi": "Ikhtilaaf mein bhi narmi rakho"}, "d": {"en": "Even if they push you toward wrong, do not obey that, but keep their company in this world with kindness.", "hi": "Agar woh galat baat par majboor karein toh na maano, par duniya mein unke saath bhalaai se raho."}, "ref": "Surah Luqman 31:15", "url": "https://quran.com/31/15"}], "h": [{"a": {"en": "Honour your mother first", "hi": "Pehle maa ki izzat"}, "d": {"en": "Who most deserves my good company? Your mother, your mother, your mother, then your father.", "hi": "Mere achhe sulook ka sabse zyada haqdaar kaun? Tumhari maa, tumhari maa, tumhari maa, phir tumhare baap."}, "ref": "Sahih al-Bukhari 5971", "url": "https://sunnah.com/bukhari:5971"}, {"a": {"en": "Serve your mother", "hi": "Maa ki khidmat karo"}, "d": {"en": "Stay with her, for Paradise is beneath her feet.", "hi": "Unke saath raho, kyunki jannat unke qadmon ke neeche hai."}, "ref": "Sunan an-Nasa’i 3104", "url": "https://sunnah.com/nasai:3104"}, {"a": {"en": "Seek Allah's pleasure through theirs", "hi": "Unki raza mein Allah ki raza dhoondo"}, "d": {"en": "The Lord's pleasure is in the parent's pleasure, and His anger in the parent's anger.", "hi": "Rab ki raza waalid ki raza mein hai, aur Rab ki naaraazgi waalid ki naaraazgi mein."}, "ref": "Jami‘ at-Tirmidhi 1899", "url": "https://sunnah.com/tirmidhi:1899"}, {"a": {"en": "Fear disobeying them", "hi": "Unki naafarmaani se daro"}, "d": {"en": "Among the greatest sins: associating partners with Allah and disobeying parents.", "hi": "Sabse bade gunaahon mein: Allah ke saath shirk aur waalidain ki naafarmaani."}, "ref": "Sahih al-Bukhari 5976", "url": "https://sunnah.com/bukhari:5976"}]}, "children": {"q": [{"a": {"en": "Protect your family from the Fire", "hi": "Apne ghar waalon ko aag se bachao"}, "d": {"en": "O you who believe, protect yourselves and your families from a Fire.", "hi": "Aye imaan walo, apne aap ko aur apne ghar waalon ko aag se bachao."}, "ref": "Surah At-Tahrim 66:6", "url": "https://quran.com/66/6"}, {"a": {"en": "Teach like Luqman taught his son", "hi": "Luqman ki tarah bete ko sikhaao"}, "d": {"en": "Luqman advised his son gently: worship Allah alone, pray, be patient, and walk humbly.", "hi": "Luqman ne bete ko pyaar se naseehat ki: sirf Allah ki ibaadat, namaaz, sabr, aur aajizi se chalna."}, "ref": "Surah Luqman 31:13-19", "url": "https://quran.com/31/13-19"}, {"a": {"en": "Invest in what lasts", "hi": "Jo baaqi rahe usmein lagaao"}, "d": {"en": "Wealth and children are the adornment of this life, but lasting good deeds are better with your Lord.", "hi": "Maal aur aulaad duniya ki zeenat hain, par baaqi rehne wali nekiyan Rab ke yahan behtar hain."}, "ref": "Surah Al-Kahf 18:46", "url": "https://quran.com/18/46"}, {"a": {"en": "Pray for them to be people of prayer", "hi": "Unke namaazi hone ki dua karo"}, "d": {"en": "My Lord, make me and my descendants keep up the prayer.", "hi": "Aye mere Rab, mujhe aur meri aulaad ko namaaz qaayam karne wala bana."}, "ref": "Surah Ibrahim 14:40", "url": "https://quran.com/14/40"}], "h": [{"a": {"en": "Remember you are their shepherd", "hi": "Yaad rakho tum unke nigehbaan ho"}, "d": {"en": "Each of you is a shepherd, and each of you is responsible for their flock.", "hi": "Tum mein se har ek nigehbaan hai aur har ek se uski ri‘aaya ke baare mein poochha jaayega."}, "ref": "Sahih al-Bukhari 893", "url": "https://sunnah.com/bukhari:893"}, {"a": {"en": "Start teaching prayer at seven", "hi": "Saat saal ki umr se namaaz sikhaao"}, "d": {"en": "Teach your children to pray when they are seven.", "hi": "Apne bachchon ko saat saal ki umr mein namaaz sikhaao."}, "ref": "Sunan Abi Dawud 495", "url": "https://sunnah.com/abudawud:495"}, {"a": {"en": "Be fair between your children", "hi": "Bachchon mein insaaf karo"}, "d": {"en": "Fear Allah and be just between your children.", "hi": "Allah se daro aur apni aulaad mein insaaf karo."}, "ref": "Sahih al-Bukhari 2587", "url": "https://sunnah.com/bukhari:2587"}, {"a": {"en": "Show them affection", "hi": "Unse pyaar jataao"}, "d": {"en": "The Prophet ﷺ kissed his grandson and said: whoever does not show mercy will not be shown mercy.", "hi": "Nabi ﷺ ne nawaase ko chooma aur farmaaya: jo reham nahi karta us par reham nahi kiya jaata."}, "ref": "Sahih al-Bukhari 5997", "url": "https://sunnah.com/bukhari:5997"}]}, "baby": {"q": [{"a": {"en": "Keep calling on Allah with hope", "hi": "Ummeed ke saath Allah ko pukaarte raho"}, "d": {"en": "Zakariyya called, “Do not leave me alone,” and Allah answered and gave him Yahya.", "hi": "Zakariyya (AS) ne pukaara, “Mujhe akela na chhod,” aur Allah ne qubool karke Yahya diye."}, "ref": "Surah Al-Anbiya 21:89-90", "url": "https://quran.com/21/89-90"}, {"a": {"en": "Accept that children are Allah's gift", "hi": "Maano aulaad Allah ka tohfa hai"}, "d": {"en": "He gives daughters to whom He wills, sons to whom He wills, or both, and leaves whom He wills childless.", "hi": "Woh jise chahe betiyan deta hai, jise chahe bete, ya dono, aur jise chahe be-aulaad rakhta hai."}, "ref": "Surah Ash-Shura 42:49-50", "url": "https://quran.com/42/49-50"}, {"a": {"en": "Remember Allah's decree can surprise", "hi": "Yaad rakho Allah ka faisla hairaan kar sakta hai"}, "d": {"en": "Sarah was given glad news in old age: “Do you wonder at Allah's decree?”", "hi": "Saara ko budhaape mein khushkhabri mili: “Kya tum Allah ke hukm par ta‘ajjub karti ho?”"}, "ref": "Surah Hud 11:72-73", "url": "https://quran.com/11/72-73"}, {"a": {"en": "Never despair of Allah's mercy", "hi": "Allah ki rehmat se kabhi naumeed na ho"}, "d": {"en": "Do not despair of relief from Allah.", "hi": "Allah ki rehmat se naumeed na ho."}, "ref": "Surah Yusuf 12:87", "url": "https://quran.com/12/87"}], "h": [{"a": {"en": "Trust that what's meant will come", "hi": "Bharosa rakho jo muqaddar hai woh aayega"}, "d": {"en": "No soul that Allah has decreed to exist except that it will come into existence.", "hi": "Jis jaan ka wujood Allah ne likh diya hai, woh zaroor wujood mein aayegi."}, "ref": "Sahih al-Bukhari 5210", "url": "https://sunnah.com/bukhari:5210"}, {"a": {"en": "Keep making dua without rushing", "hi": "Bina jaldi kiye dua karte raho"}, "d": {"en": "Your dua is answered as long as you are not hasty.", "hi": "Dua qubool hoti hai jab tak jaldi na ki jaaye."}, "ref": "Sahih al-Bukhari 6340", "url": "https://sunnah.com/bukhari:6340"}, {"a": {"en": "Welcome the newborn with tahnik", "hi": "Naye bachche ka tahneek karo"}, "d": {"en": "The Prophet ﷺ chewed a date, put it in a newborn's mouth, and made dua for him.", "hi": "Nabi ﷺ ne khajoor chaba kar naye bachche ke munh mein daali aur uske liye dua ki."}, "ref": "Sahih al-Bukhari 5467", "url": "https://sunnah.com/bukhari:5467"}, {"a": {"en": "Give thanks with an aqiqah", "hi": "Aqeeqa se shukr ada karo"}, "d": {"en": "Every child is held in pledge for its aqiqah, offered on the seventh day.", "hi": "Har bachcha apne aqeeqe ke saath girvi hai, jo saatve din kiya jaaye."}, "ref": "Sunan Abi Dawud 2838", "url": "https://sunnah.com/abudawud:2838"}]}, "forgiveness": {"q": [{"a": {"en": "Never despair of Allah's mercy", "hi": "Allah ki rehmat se naumeed na ho"}, "d": {"en": "My servants who have wronged themselves, do not despair of Allah's mercy; He forgives all sins.", "hi": "Aye mere bando jinhone apni jaan par zulm kiya, Allah ki rehmat se naumeed na ho; woh saare gunaah maaf karta hai."}, "ref": "Surah Az-Zumar 39:53", "url": "https://quran.com/39/53"}, {"a": {"en": "Turn back right away", "hi": "Foran laut aao"}, "d": {"en": "When they commit wrong, they remember Allah and ask forgiveness.", "hi": "Jab woh ghalti kar baithte hain toh Allah ko yaad karte hain aur maafi maangte hain."}, "ref": "Surah Aal-Imran 3:135", "url": "https://quran.com/3/135"}, {"a": {"en": "Follow sins with good deeds", "hi": "Gunaah ke baad neki karo"}, "d": {"en": "Good deeds wipe away bad deeds.", "hi": "Nekiyan buraaiyon ko mita deti hain."}, "ref": "Surah Hud 11:114", "url": "https://quran.com/11/114"}, {"a": {"en": "Forgive others as you want forgiveness", "hi": "Doosron ko maaf karo jaise khud maafi chahte ho"}, "d": {"en": "Let them pardon and overlook. Do you not love that Allah should forgive you?", "hi": "Unhe maaf aur darguzar karna chahiye. Kya tum nahi chahte ki Allah tumhe maaf kare?"}, "ref": "Surah An-Nur 24:22", "url": "https://quran.com/24/22"}], "h": [{"a": {"en": "Know everyone slips", "hi": "Jaano har koi ghalti karta hai"}, "d": {"en": "Every child of Adam makes mistakes, and the best of those who err are those who repent.", "hi": "Har insaan ghalti karta hai, aur behtareen ghalti karne wale woh hain jo tauba karein."}, "ref": "Jami‘ at-Tirmidhi 2499", "url": "https://sunnah.com/tirmidhi:2499"}, {"a": {"en": "Do a good deed after a bad one", "hi": "Buraai ke baad neki karo"}, "d": {"en": "Follow a bad deed with a good one and it will wipe it out.", "hi": "Buraai ke baad neki karo, woh use mita degi."}, "ref": "Jami‘ at-Tirmidhi 1987", "url": "https://sunnah.com/tirmidhi:1987"}, {"a": {"en": "Know His door is open day and night", "hi": "Jaano uska darwaaza din raat khula hai"}, "d": {"en": "Allah stretches out His hand at night for the one who sinned by day, and by day for the one who sinned at night.", "hi": "Allah raat ko haath phailaata hai din ke gunaahgaar ke liye, aur din ko raat ke gunaahgaar ke liye."}, "ref": "Sahih Muslim 2759", "url": "https://sunnah.com/muslim:2759"}, {"a": {"en": "Make istighfar a daily habit", "hi": "Istighfaar ko roz ki aadat banao"}, "d": {"en": "The Prophet ﷺ sought Allah's forgiveness more than seventy times a day.", "hi": "Nabi ﷺ din mein sattar se zyada baar istighfaar karte the."}, "ref": "Sahih al-Bukhari 6307", "url": "https://sunnah.com/bukhari:6307"}]}, "kindness": {"q": [{"a": {"en": "Speak good words to everyone", "hi": "Har kisi se achhi baat karo"}, "d": {"en": "Speak to people good words.", "hi": "Logon se achhi baat kaho."}, "ref": "Surah Al-Baqarah 2:83", "url": "https://quran.com/2/83"}, {"a": {"en": "Be gentle, not harsh", "hi": "Sakht nahi, narm bano"}, "d": {"en": "Had you been harsh and hard-hearted, they would have scattered from around you.", "hi": "Agar aap sakht aur sang-dil hote toh log aapke aas paas se chhat jaate."}, "ref": "Surah Aal-Imran 3:159", "url": "https://quran.com/3/159"}, {"a": {"en": "Repel bad with good", "hi": "Buraai ko bhalaai se door karo"}, "d": {"en": "Repel evil with what is better.", "hi": "Buraai ko behtar tareeqe se door karo."}, "ref": "Surah Fussilat 41:34", "url": "https://quran.com/41/34"}, {"a": {"en": "Be good to the people around you", "hi": "Aas paas ke logon se bhalaai karo"}, "d": {"en": "Be good to parents, relatives, orphans, the needy, near and far neighbours and companions.", "hi": "Waalidain, rishtedaar, yateem, miskeen, qareeb aur door ke padosi aur saathiyon se bhalaai karo."}, "ref": "Surah An-Nisa 4:36", "url": "https://quran.com/4/36"}], "h": [{"a": {"en": "Choose gentleness", "hi": "Narmi chuno"}, "d": {"en": "Allah is Gentle and loves gentleness in all matters.", "hi": "Allah narm hai aur har maamle mein narmi pasand karta hai."}, "ref": "Sahih Muslim 2593", "url": "https://sunnah.com/muslim:2593"}, {"a": {"en": "Let gentleness beautify you", "hi": "Narmi ko apni zeenat banao"}, "d": {"en": "Gentleness is not found in anything except that it beautifies it.", "hi": "Narmi jis cheez mein ho use khoobsoorat bana deti hai."}, "ref": "Sahih Muslim 2594", "url": "https://sunnah.com/muslim:2594"}, {"a": {"en": "Smile at people", "hi": "Logon se muskura kar milo"}, "d": {"en": "Your smile at your brother is charity.", "hi": "Apne bhai ke saamne muskurana sadqa hai."}, "ref": "Jami‘ at-Tirmidhi 1956", "url": "https://sunnah.com/tirmidhi:1956"}, {"a": {"en": "Want for others what you want for yourself", "hi": "Doosron ke liye wahi chaaho jo apne liye"}, "d": {"en": "None of you truly believes until he loves for his brother what he loves for himself.", "hi": "Tum mein koi momin nahi jab tak apne bhai ke liye wahi na chahe jo apne liye chahta hai."}, "ref": "Sahih al-Bukhari 13", "url": "https://sunnah.com/bukhari:13"}]}, "anger": {"q": [{"a": {"en": "Swallow your anger and pardon", "hi": "Gussa pee jaao aur maaf karo"}, "d": {"en": "Those who restrain anger and pardon people; Allah loves those who do good.", "hi": "Jo gussa pee jaate hain aur logon ko maaf karte hain; Allah nek logon ko pasand karta hai."}, "ref": "Surah Aal-Imran 3:134", "url": "https://quran.com/3/134"}, {"a": {"en": "Forgive while you are angry", "hi": "Gusse mein bhi maaf karo"}, "d": {"en": "When they are angry, they forgive.", "hi": "Jab unhe gussa aata hai toh maaf kar dete hain."}, "ref": "Surah Ash-Shura 42:37", "url": "https://quran.com/42/37"}, {"a": {"en": "Seek refuge when provoked", "hi": "Uksaaye jaao toh panaah maango"}, "d": {"en": "If a prompting from Satan stirs you, seek refuge in Allah.", "hi": "Agar shaitaan ki taraf se koi waswasa aaye toh Allah ki panaah maango."}, "ref": "Surah Al-A‘raf 7:200", "url": "https://quran.com/7/200"}, {"a": {"en": "Walk away from foolish arguments", "hi": "Bewakoofi ki behas se hat jaao"}, "d": {"en": "Hold to forgiveness, command what is right, and turn away from the ignorant.", "hi": "Maafi apnao, bhalaai ka hukm do, aur jaahilon se munh pher lo."}, "ref": "Surah Al-A‘raf 7:199", "url": "https://quran.com/7/199"}], "h": [{"a": {"en": "Don't get angry", "hi": "Gussa mat karo"}, "d": {"en": "A man asked for advice. The Prophet ﷺ said “Do not get angry,” and repeated it several times.", "hi": "Ek shakhs ne naseehat maangi. Nabi ﷺ ne farmaaya “Gussa na karo,” aur kai baar dohraaya."}, "ref": "Sahih al-Bukhari 6116", "url": "https://sunnah.com/bukhari:6116"}, {"a": {"en": "Real strength is self-control", "hi": "Asal taaqat khud par qaabu hai"}, "d": {"en": "The strong one controls himself when angry.", "hi": "Taaqatwar woh hai jo gusse mein khud ko qaabu rakhe."}, "ref": "Sahih al-Bukhari 6114", "url": "https://sunnah.com/bukhari:6114"}, {"a": {"en": "Say A‘udhu billah when angry", "hi": "Gusse mein A‘oozu billah kaho"}, "d": {"en": "Seeking refuge in Allah from Satan would take away the anger.", "hi": "Shaitaan se Allah ki panaah maangna gussa door kar deta hai."}, "ref": "Sahih al-Bukhari 3282", "url": "https://sunnah.com/bukhari:3282"}, {"a": {"en": "Change your position", "hi": "Apni haalat badlo"}, "d": {"en": "If you are angry while standing, sit down; if it does not leave, lie down.", "hi": "Khade ho kar gussa aaye toh baith jaao; phir bhi na jaaye toh let jaao."}, "ref": "Sunan Abi Dawud 4782", "url": "https://sunnah.com/abudawud:4782"}]}, "jealousy": {"q": [{"a": {"en": "Ask Allah instead of envying", "hi": "Hasad ki jagah Allah se maango"}, "d": {"en": "Do not wish for what Allah gave others over you; ask Allah of His bounty.", "hi": "Doosron ko jo diya gaya uski tamanna na karo; Allah se uska fazl maango."}, "ref": "Surah An-Nisa 4:32", "url": "https://quran.com/4/32"}, {"a": {"en": "Seek refuge from envy", "hi": "Hasad se panaah maango"}, "d": {"en": "And from the evil of an envier when he envies.", "hi": "Aur hasad karne wale ke shar se jab woh hasad kare."}, "ref": "Surah Al-Falaq 113:5", "url": "https://quran.com/113/5"}, {"a": {"en": "Remember who gives the blessing", "hi": "Yaad rakho nemat kaun deta hai"}, "d": {"en": "Do they envy people for what Allah has given them of His bounty?", "hi": "Kya woh logon se us par hasad karte hain jo Allah ne unhe apne fazl se diya?"}, "ref": "Surah An-Nisa 4:54", "url": "https://quran.com/4/54"}, {"a": {"en": "Pray for a heart free of resentment", "hi": "Keena se paak dil ki dua karo"}, "d": {"en": "Put no resentment in our hearts toward those who believe.", "hi": "Humare dilon mein imaan walon ke liye koi keena na rakh."}, "ref": "Surah Al-Hashr 59:10", "url": "https://quran.com/59/10"}], "h": [{"a": {"en": "Don't envy; be brothers", "hi": "Hasad na karo, bhai bano"}, "d": {"en": "Do not envy one another, do not hate one another, do not turn your backs; be servants of Allah as brothers.", "hi": "Ek doosre se hasad na karo, nafrat na karo, munh na phero; Allah ke bande bhai bhai ban jaao."}, "ref": "Sahih Muslim 2559", "url": "https://sunnah.com/muslim:2559"}, {"a": {"en": "Envy only good done for Allah", "hi": "Sirf nek kaamon par rashk karo"}, "d": {"en": "No envy except in two: someone spending wealth rightly, and someone given wisdom who acts on it and teaches it.", "hi": "Rashk sirf do par: jo maal sahi jagah kharch kare, aur jise hikmat mili ho aur woh us par amal kare aur sikhaaye."}, "ref": "Sahih al-Bukhari 73", "url": "https://sunnah.com/bukhari:73"}, {"a": {"en": "Love for others what you love for yourself", "hi": "Doosron ke liye wahi chaaho jo apne liye"}, "d": {"en": "None of you believes until he loves for his brother what he loves for himself.", "hi": "Koi momin nahi jab tak bhai ke liye wahi na chahe jo apne liye."}, "ref": "Sahih al-Bukhari 13", "url": "https://sunnah.com/bukhari:13"}, {"a": {"en": "Say “barakAllah” when you admire", "hi": "Pasand aaye toh “BarakAllah” kaho"}, "d": {"en": "If you see something you like in your brother, pray for blessing for him.", "hi": "Jab bhai mein koi cheez pasand aaye toh uske liye barkat ki dua karo."}, "ref": "Sunan Ibn Majah 3509", "url": "https://sunnah.com/ibnmajah:3509"}]}, "closer": {"q": [{"a": {"en": "Know He is near", "hi": "Jaano woh qareeb hai"}, "d": {"en": "When My servants ask about Me, I am near; I answer the call of the caller.", "hi": "Jab mere bande mere baare mein poochhein, main qareeb hoon, pukaarne wale ki pukaar ka jawaab deta hoon."}, "ref": "Surah Al-Baqarah 2:186", "url": "https://quran.com/2/186"}, {"a": {"en": "Prostrate and draw near", "hi": "Sajda karo aur qareeb ho jaao"}, "d": {"en": "Prostrate and draw near.", "hi": "Sajda karo aur qareeb ho jaao."}, "ref": "Surah Al-‘Alaq 96:19", "url": "https://quran.com/96/19"}, {"a": {"en": "Follow the Prophet ﷺ to be loved", "hi": "Nabi ﷺ ki pairvi karo, Allah mohabbat karega"}, "d": {"en": "Say: if you love Allah, follow me, and Allah will love you.", "hi": "Kaho: agar tum Allah se mohabbat karte ho toh meri pairvi karo, Allah tumse mohabbat karega."}, "ref": "Surah Aal-Imran 3:31", "url": "https://quran.com/3/31"}, {"a": {"en": "Remember He is closer than your jugular vein", "hi": "Yaad rakho woh shah-rag se bhi qareeb hai"}, "d": {"en": "We are closer to him than his jugular vein.", "hi": "Hum uski shah-rag se bhi zyada qareeb hain."}, "ref": "Surah Qaf 50:16", "url": "https://quran.com/50/16"}], "h": [{"a": {"en": "Make dua in sujood", "hi": "Sajde mein dua karo"}, "d": {"en": "The closest a servant is to his Lord is in prostration, so make much dua there.", "hi": "Banda apne Rab ke sabse qareeb sajde mein hota hai, toh wahan kasrat se dua karo."}, "ref": "Sahih Muslim 482", "url": "https://sunnah.com/muslim:482"}, {"a": {"en": "Add voluntary deeds", "hi": "Nafl amal badhao"}, "d": {"en": "My servant keeps drawing near to Me with voluntary deeds until I love him.", "hi": "Mera banda nafl amal se mere qareeb hota rehta hai yahan tak ki main usse mohabbat karne lagta hoon."}, "ref": "Sahih al-Bukhari 6502", "url": "https://sunnah.com/bukhari:6502"}, {"a": {"en": "Take one step; He comes running", "hi": "Ek qadam badhao, woh daud kar aata hai"}, "d": {"en": "If he comes to Me walking, I go to him running.", "hi": "Agar woh mere paas chal kar aaye, main uske paas daud kar jaata hoon."}, "ref": "Sahih al-Bukhari 7405", "url": "https://sunnah.com/bukhari:7405"}, {"a": {"en": "Wake in the last third of the night", "hi": "Raat ke aakhri hisse mein jaago"}, "d": {"en": "Our Lord descends in the last third of the night: who is calling Me, that I may answer?", "hi": "Humara Rab raat ke aakhri tihaai hisse mein farmaata hai: kaun mujhe pukaarta hai ki main jawaab doon?"}, "ref": "Sahih al-Bukhari 1145", "url": "https://sunnah.com/bukhari:1145"}]}, "faith": {"q": [{"a": {"en": "Let the Qur'an increase your faith", "hi": "Qur'an se imaan badhao"}, "d": {"en": "When His verses are recited to them, it increases them in faith.", "hi": "Jab unpar uski aayatein padhi jaati hain toh unka imaan badhta hai."}, "ref": "Surah Al-Anfal 8:2", "url": "https://quran.com/8/2"}, {"a": {"en": "Say “my Lord is Allah” and stay firm", "hi": "“Mera Rab Allah hai” kaho aur jame raho"}, "d": {"en": "Those who say “Our Lord is Allah” and then stand firm, the angels descend on them: do not fear.", "hi": "Jo kehte hain “humara Rab Allah hai” phir jame rehte hain, un par farishte utarte hain: daro mat."}, "ref": "Surah Fussilat 41:30", "url": "https://quran.com/41/30"}, {"a": {"en": "Expect tests and stay steady", "hi": "Imtihaan ki ummeed rakho aur saabit raho"}, "d": {"en": "Do people think they will be left to say “we believe” and not be tested?", "hi": "Kya log samajhte hain ki “hum imaan laaye” kehne par chhod diye jaayenge aur aazmaaye nahi jaayenge?"}, "ref": "Surah Al-‘Ankabut 29:2", "url": "https://quran.com/29/2"}, {"a": {"en": "Keep renewing your faith", "hi": "Apna imaan taaza karte raho"}, "d": {"en": "O you who believe, believe in Allah and His Messenger.", "hi": "Aye imaan walo, Allah aur uske Rasool par imaan laao."}, "ref": "Surah An-Nisa 4:136", "url": "https://quran.com/4/136"}], "h": [{"a": {"en": "Believe, then be steadfast", "hi": "Imaan laao, phir saabit-qadam raho"}, "d": {"en": "Say “I believe in Allah,” then be steadfast.", "hi": "Kaho “main Allah par imaan laaya,” phir us par jame raho."}, "ref": "Sahih Muslim 38", "url": "https://sunnah.com/muslim:38"}, {"a": {"en": "Ask Allah to renew your faith", "hi": "Allah se imaan taaza karne ki dua karo"}, "d": {"en": "Faith wears out in your heart like a garment wears out, so ask Allah to renew it.", "hi": "Imaan dil mein kapde ki tarah purana ho jaata hai, toh Allah se use naya karne ki dua karo."}, "ref": "Mustadrak al-Hakim 5", "url": ""}, {"a": {"en": "Taste the sweetness of faith", "hi": "Imaan ki mithaas chakho"}, "d": {"en": "Whoever loves Allah and His Messenger most, loves people for Allah, and hates returning to disbelief tastes faith's sweetness.", "hi": "Jo Allah aur Rasool se sabse zyada mohabbat kare, logon se Allah ke liye mohabbat kare, aur kufr ki taraf lautna na-pasand kare, woh imaan ki mithaas paata hai."}, "ref": "Sahih al-Bukhari 16", "url": "https://sunnah.com/bukhari:16"}, {"a": {"en": "Practise modesty", "hi": "Haya apnao"}, "d": {"en": "Faith has over seventy branches, and modesty is a branch of faith.", "hi": "Imaan ki sattar se zyada shaakhein hain, aur haya imaan ki ek shaakh hai."}, "ref": "Sahih Muslim 35", "url": "https://sunnah.com/muslim:35"}]}, "prayers": {"q": [{"a": {"en": "Guard your prayers", "hi": "Apni namaazon ki hifaazat karo"}, "d": {"en": "Guard the prayers, especially the middle prayer, and stand before Allah devoutly.", "hi": "Namaazon ki hifaazat karo, khaas kar beech wali namaaz ki, aur Allah ke saamne adab se khade ho."}, "ref": "Surah Al-Baqarah 2:238", "url": "https://quran.com/2/238"}, {"a": {"en": "Let prayer shape your day", "hi": "Namaaz ko din ka saancha banne do"}, "d": {"en": "Prayer keeps one away from indecency and wrongdoing.", "hi": "Namaaz behayaai aur buraai se rokti hai."}, "ref": "Surah Al-‘Ankabut 29:45", "url": "https://quran.com/29/45"}, {"a": {"en": "Pray with humility", "hi": "Aajizi se namaaz padho"}, "d": {"en": "Successful are the believers who are humble in their prayers.", "hi": "Kaamyaab hain woh momin jo apni namaaz mein aajizi karte hain."}, "ref": "Surah Al-Mu’minun 23:1-2", "url": "https://quran.com/23/1-2"}, {"a": {"en": "Lean on prayer when life is heavy", "hi": "Zindagi bhaari ho toh namaaz ka sahaara lo"}, "d": {"en": "Seek help through patience and prayer.", "hi": "Sabr aur namaaz se madad lo."}, "ref": "Surah Al-Baqarah 2:45", "url": "https://quran.com/2/45"}], "h": [{"a": {"en": "Pray on time", "hi": "Waqt par namaaz padho"}, "d": {"en": "The deed most loved by Allah is prayer at its proper time.", "hi": "Allah ko sabse pyaara amal waqt par namaaz hai."}, "ref": "Sahih al-Bukhari 527", "url": "https://sunnah.com/bukhari:527"}, {"a": {"en": "Remember prayer is judged first", "hi": "Yaad rakho pehla hisaab namaaz ka"}, "d": {"en": "The first deed a servant will be judged on is the prayer.", "hi": "Qayaamat mein sabse pehle namaaz ka hisaab hoga."}, "ref": "Jami‘ at-Tirmidhi 413", "url": "https://sunnah.com/tirmidhi:413"}, {"a": {"en": "Let five prayers wash you clean", "hi": "Paanch namaazein tumhe paak karein"}, "d": {"en": "Five prayers are like a river at your door you bathe in five times a day.", "hi": "Paanch namaazein darwaaze par behti nehar ki tarah hain jismein din mein paanch baar nahaao."}, "ref": "Sahih al-Bukhari 528", "url": "https://sunnah.com/bukhari:528"}, {"a": {"en": "Learn the way he prayed", "hi": "Aap ﷺ ka tareeqa seekho"}, "d": {"en": "Pray as you have seen me pray.", "hi": "Aise namaaz padho jaise mujhe padhte dekha."}, "ref": "Sahih al-Bukhari 631", "url": "https://sunnah.com/bukhari:631"}]}, "gratitude": {"q": [{"a": {"en": "Be grateful and receive more", "hi": "Shukr karo, aur paao"}, "d": {"en": "If you are grateful, I will surely increase you.", "hi": "Agar shukr karoge toh main zaroor zyada doonga."}, "ref": "Surah Ibrahim 14:7", "url": "https://quran.com/14/7"}, {"a": {"en": "Remember and thank Him", "hi": "Yaad karo aur shukr karo"}, "d": {"en": "Remember Me; be grateful to Me and do not deny Me.", "hi": "Mujhe yaad karo, mera shukr karo, aur naashukri na karo."}, "ref": "Surah Al-Baqarah 2:152", "url": "https://quran.com/2/152"}, {"a": {"en": "Try counting His blessings", "hi": "Uski nematein gin kar dekho"}, "d": {"en": "If you tried to count Allah's blessings, you could never number them.", "hi": "Agar tum Allah ki nematein ginna chaaho toh gin nahi sakoge."}, "ref": "Surah Ibrahim 14:34", "url": "https://quran.com/14/34"}, {"a": {"en": "Aim to be among the few", "hi": "Un thode logon mein shaamil hone ki koshish karo"}, "d": {"en": "Few of My servants are truly grateful.", "hi": "Mere bandon mein shukr guzaar thode hi hain."}, "ref": "Surah Saba 34:13", "url": "https://quran.com/34/13"}], "h": [{"a": {"en": "Thank the people who help you", "hi": "Madad karne walon ka shukriya ada karo"}, "d": {"en": "Whoever does not thank people does not thank Allah.", "hi": "Jo logon ka shukriya ada nahi karta, woh Allah ka shukr ada nahi karta."}, "ref": "Sunan Abi Dawud 4811", "url": "https://sunnah.com/abudawud:4811"}, {"a": {"en": "Thank Him through worship", "hi": "Ibaadat se shukr ada karo"}, "d": {"en": "Asked why he prayed until his feet swelled, he said: Should I not be a grateful servant?", "hi": "Poochha gaya ki itni namaaz kyun ki pair sooj gaye, farmaaya: kya main shukr guzaar banda na banoon?"}, "ref": "Sahih al-Bukhari 4837", "url": "https://sunnah.com/bukhari:4837"}, {"a": {"en": "Praise Allah after eating and drinking", "hi": "Khaane peene ke baad Alhamdulillah kaho"}, "d": {"en": "Allah is pleased with a servant who eats and praises Him, and drinks and praises Him.", "hi": "Allah us bande se raazi hota hai jo khaa kar uski taareef kare aur pee kar uski taareef kare."}, "ref": "Sahih Muslim 2734", "url": "https://sunnah.com/muslim:2734"}, {"a": {"en": "Find good in every state", "hi": "Har haal mein bhalaai dhoondo"}, "d": {"en": "When good comes to the believer, he is grateful, and that is good for him.", "hi": "Momin ko bhalaai mile toh shukr karta hai, aur yeh uske liye behtar hai."}, "ref": "Sahih Muslim 2999", "url": "https://sunnah.com/muslim:2999"}]}, "guidance": {"q": [{"a": {"en": "Ask for the straight path in every prayer", "hi": "Har namaaz mein seedha raasta maango"}, "d": {"en": "Guide us to the straight path.", "hi": "Humein seedhe raaste par chala."}, "ref": "Surah Al-Fatihah 1:6", "url": "https://quran.com/1/6"}, {"a": {"en": "Strive and expect guidance", "hi": "Koshish karo aur hidaayat ki ummeed rakho"}, "d": {"en": "Those who strive for Us, We will surely guide them to Our ways.", "hi": "Jo humari raah mein koshish karte hain, hum unhe zaroor apne raaste dikhaate hain."}, "ref": "Surah Al-‘Ankabut 29:69", "url": "https://quran.com/29/69"}, {"a": {"en": "Consult before deciding", "hi": "Faisle se pehle mashwara karo"}, "d": {"en": "Consult them in the matter; then when you decide, rely on Allah.", "hi": "Maamle mein unse mashwara karo; phir jab iraada kar lo toh Allah par bharosa karo."}, "ref": "Surah Aal-Imran 3:159", "url": "https://quran.com/3/159"}, {"a": {"en": "Seek guidance from Allah alone", "hi": "Hidaayat sirf Allah se maango"}, "d": {"en": "Whoever Allah guides is the rightly guided.", "hi": "Jise Allah hidaayat de wahi hidaayat yaafta hai."}, "ref": "Surah Al-Kahf 18:17", "url": "https://quran.com/18/17"}], "h": [{"a": {"en": "Pray istikhara before big decisions", "hi": "Bade faisle se pehle istikhaara karo"}, "d": {"en": "The Prophet ﷺ taught istikhara for all matters, as he taught a surah of the Qur'an.", "hi": "Nabi ﷺ har maamle ke liye istikhaara aise sikhaate jaise Qur'an ki surah."}, "ref": "Sahih al-Bukhari 1162", "url": "https://sunnah.com/bukhari:1162"}, {"a": {"en": "Leave what makes you doubt", "hi": "Shak wali cheez chhodo"}, "d": {"en": "Leave what makes you doubt for what does not make you doubt.", "hi": "Jo cheez shak mein daale use chhod kar woh lo jo shak mein na daale."}, "ref": "Jami‘ at-Tirmidhi 2518", "url": "https://sunnah.com/tirmidhi:2518"}, {"a": {"en": "Listen to your conscience", "hi": "Apne zameer ki suno"}, "d": {"en": "Righteousness is good character; sin is what unsettles your heart and you dislike people knowing.", "hi": "Neki achha akhlaaq hai; gunaah woh hai jo dil mein khatke aur tum na chaaho ki log jaanein."}, "ref": "Sahih Muslim 2553", "url": "https://sunnah.com/muslim:2553"}, {"a": {"en": "Consult people you trust", "hi": "Bharosemand logon se mashwara karo"}, "d": {"en": "The one who is consulted is in a position of trust.", "hi": "Jisse mashwara liya jaaye woh amaanatdaar hai."}, "ref": "Jami‘ at-Tirmidhi 2822", "url": "https://sunnah.com/tirmidhi:2822"}]}, "protection": {"q": [{"a": {"en": "Hand your safety to the best Guardian", "hi": "Apni hifaazat behtareen Muhaafiz ko saunpo"}, "d": {"en": "Allah is the best guardian, and He is the Most Merciful.", "hi": "Allah sabse behtar hifaazat karne wala hai, aur sabse zyada reham karne wala."}, "ref": "Surah Yusuf 12:64", "url": "https://quran.com/12/64"}, {"a": {"en": "Remember the angels guarding you", "hi": "Hifaazat karne wale farishton ko yaad rakho"}, "d": {"en": "Each person has angels before and behind them, guarding them by Allah's command.", "hi": "Har insaan ke aage peeche farishte hain jo Allah ke hukm se uski hifaazat karte hain."}, "ref": "Surah Ar-Ra‘d 13:11", "url": "https://quran.com/13/11"}, {"a": {"en": "Recite Ayat al-Kursi", "hi": "Ayat-ul-Kursi padho"}, "d": {"en": "Guarding the heavens and the earth does not tire Him.", "hi": "Aasmaan aur zameen ki hifaazat use nahi thakaati."}, "ref": "Surah Al-Baqarah 2:255", "url": "https://quran.com/2/255"}, {"a": {"en": "Call Him in distress", "hi": "Pareshaani mein usko pukaaro"}, "d": {"en": "Who answers the distressed when they call, and removes the harm?", "hi": "Kaun hai jo pareshaan ki pukaar sunta hai jab woh pukaare, aur takleef door karta hai?"}, "ref": "Surah An-Naml 27:62", "url": "https://quran.com/27/62"}], "h": [{"a": {"en": "Guard Allah's limits", "hi": "Allah ki hudood ki hifaazat karo"}, "d": {"en": "Be mindful of Allah, and He will protect you.", "hi": "Allah ka khayaal rakho, woh tumhari hifaazat karega."}, "ref": "Jami‘ at-Tirmidhi 2516", "url": "https://sunnah.com/tirmidhi:2516"}, {"a": {"en": "Say the morning and evening protection", "hi": "Subah shaam hifaazat ki dua padho"}, "d": {"en": "Bismillahil-ladhi la yadurru… three times: nothing will harm you.", "hi": "Bismillahil-lazi la yazurru… teen baar: koi cheez nuqsaan nahi pahunchaayegi."}, "ref": "Sunan Abi Dawud 5088", "url": "https://sunnah.com/abudawud:5088"}, {"a": {"en": "Say the leaving-home dua", "hi": "Ghar se nikalne ki dua padho"}, "d": {"en": "Whoever says it leaving home is told: you are guided, sufficed and protected.", "hi": "Jo ghar se nikalte waqt yeh padhe, use kaha jaata hai: hidaayat mili, kaafi hua, mehfooz hua."}, "ref": "Sunan Abi Dawud 5095", "url": "https://sunnah.com/abudawud:5095"}, {"a": {"en": "Pray Fajr", "hi": "Fajr padho"}, "d": {"en": "Whoever prays Fajr is under the protection of Allah.", "hi": "Jo Fajr padhta hai woh Allah ki hifaazat mein hai."}, "ref": "Sahih Muslim 657", "url": "https://sunnah.com/muslim:657"}]}, "jannah": {"q": [{"a": {"en": "Race toward forgiveness and Jannah", "hi": "Maghfirat aur jannat ki taraf daudo"}, "d": {"en": "Race to forgiveness from your Lord and a garden as wide as the heavens and earth.", "hi": "Apne Rab ki maghfirat aur us jannat ki taraf daudo jiski chaudaai aasmaan aur zameen jitni hai."}, "ref": "Surah Aal-Imran 3:133", "url": "https://quran.com/3/133"}, {"a": {"en": "Imagine what is hidden for you", "hi": "Socho tumhare liye kya chhupa hai"}, "d": {"en": "No soul knows what delight is kept hidden for them.", "hi": "Koi jaan nahi jaanti ki uske liye aankhon ki kya thandak chhupa kar rakhi gayi hai."}, "ref": "Surah As-Sajdah 32:17", "url": "https://quran.com/32/17"}, {"a": {"en": "Hold back your desires", "hi": "Apni khwaahishon ko roko"}, "d": {"en": "Whoever feared standing before his Lord and restrained the soul from desire, Paradise is the refuge.", "hi": "Jo apne Rab ke saamne khade hone se dara aur nafs ko khwaahish se roka, uska thikaana jannat hai."}, "ref": "Surah An-Nazi‘at 79:40-41", "url": "https://quran.com/79/40-41"}, {"a": {"en": "Long for the greeting of peace", "hi": "Salaamati ke istiqbaal ki tamanna rakho"}, "d": {"en": "Enter it in peace, secure.", "hi": "Isme salaamati aur aman ke saath daakhil ho jaao."}, "ref": "Surah Al-Hijr 15:46", "url": "https://quran.com/15/46"}], "h": [{"a": {"en": "Know it's beyond imagination", "hi": "Jaano woh tasavvur se pare hai"}, "d": {"en": "Allah says: I have prepared for My servants what no eye has seen, no ear has heard, and no heart has imagined.", "hi": "Allah farmaata hai: maine bandon ke liye woh tayyar kiya jo na aankh ne dekha, na kaan ne suna, na dil mein khayaal aaya."}, "ref": "Sahih al-Bukhari 3244", "url": "https://sunnah.com/bukhari:3244"}, {"a": {"en": "Accept that the path has hardships", "hi": "Maano raaste mein mushkilein hain"}, "d": {"en": "Paradise is surrounded by hardships, and the Fire by desires.", "hi": "Jannat mushkilon se ghiri hai aur jahannum khwaahishon se."}, "ref": "Sahih Muslim 2822", "url": "https://sunnah.com/muslim:2822"}, {"a": {"en": "Guard your tongue and chastity", "hi": "Zabaan aur sharmgaah ki hifaazat karo"}, "d": {"en": "Whoever guarantees me what is between his jaws and his legs, I guarantee him Paradise.", "hi": "Jo mujhe zabaan aur sharmgaah ki zamaanat de, main use jannat ki zamaanat deta hoon."}, "ref": "Sahih al-Bukhari 6474", "url": "https://sunnah.com/bukhari:6474"}, {"a": {"en": "Spread salam, feed people, pray at night", "hi": "Salaam phailao, khaana khilaao, raat ko namaaz padho"}, "d": {"en": "Spread salam, feed people, and pray at night while people sleep: you will enter Paradise in peace.", "hi": "Salaam phailao, khaana khilaao, aur raat ko namaaz padho jab log so rahe hon: salaamati se jannat mein jaaoge."}, "ref": "Jami‘ at-Tirmidhi 2485", "url": "https://sunnah.com/tirmidhi:2485"}]}, "discipline": {"q": [{"a": {"en": "Start the change in yourself", "hi": "Badlaav apne aap se shuru karo"}, "d": {"en": "Allah does not change a people's condition until they change what is in themselves.", "hi": "Allah kisi qaum ki haalat nahi badalta jab tak woh khud apne aap ko na badlein."}, "ref": "Surah Ar-Ra‘d 13:11", "url": "https://quran.com/13/11"}, {"a": {"en": "Value your time", "hi": "Apne waqt ki qadr karo"}, "d": {"en": "By time, mankind is in loss, except those who believe, do good, and urge truth and patience.", "hi": "Zamaane ki qasam, insaan ghaate mein hai, siwaye unke jo imaan laaye, nek amal kiye, aur haq aur sabr ki talqeen ki."}, "ref": "Surah Al-‘Asr 103", "url": "https://quran.com/103"}, {"a": {"en": "Work on your soul", "hi": "Apne nafs par kaam karo"}, "d": {"en": "Successful is the one who purifies the soul, and lost is the one who buries it.", "hi": "Kaamyaab hua jisne nafs ko paak kiya, aur naakaam hua jisne use dabaa diya."}, "ref": "Surah Ash-Shams 91:9-10", "url": "https://quran.com/91/9-10"}, {"a": {"en": "When one task ends, start the next", "hi": "Ek kaam khatam ho toh agla shuru karo"}, "d": {"en": "When you are free, then stand up in devotion.", "hi": "Jab faarigh ho toh ibaadat mein lag jaao."}, "ref": "Surah Ash-Sharh 94:7", "url": "https://quran.com/94/7"}], "h": [{"a": {"en": "Be consistent, even if small", "hi": "Lagaataar raho, chahe thoda"}, "d": {"en": "The most beloved deeds to Allah are those done consistently, even if small.", "hi": "Allah ko sabse pyaare amal woh hain jo lagaataar hon, chahe thode hon."}, "ref": "Sahih al-Bukhari 6464", "url": "https://sunnah.com/bukhari:6464"}, {"a": {"en": "Leave what doesn't concern you", "hi": "Bekaar baaton ko chhodo"}, "d": {"en": "Part of a person's good Islam is leaving what does not concern them.", "hi": "Aadmi ke achhe Islam ki nishaani hai ki woh bekaar baatein chhod de."}, "ref": "Jami‘ at-Tirmidhi 2317", "url": "https://sunnah.com/tirmidhi:2317"}, {"a": {"en": "Don't waste health and free time", "hi": "Sehat aur fursat zaaya na karo"}, "d": {"en": "Two blessings many people lose out on: health and free time.", "hi": "Do nematein jinmein bahut log ghaate mein hain: sehat aur fursat."}, "ref": "Sahih al-Bukhari 6412", "url": "https://sunnah.com/bukhari:6412"}, {"a": {"en": "Be moderate and keep going", "hi": "Miyaana-ravi apnao aur chalte raho"}, "d": {"en": "The religion is easy; aim for what is right, come close to it, and use the morning, evening and part of the night.", "hi": "Deen aasaan hai; durust raho, qareeb raho, aur subah, shaam aur raat ke kuch hisse se madad lo."}, "ref": "Sahih al-Bukhari 39", "url": "https://sunnah.com/bukhari:39"}]}, "debt": {"q": [{"a": {"en": "Write your debts down", "hi": "Apne qarz likh kar rakho"}, "d": {"en": "When you contract a debt for a fixed term, write it down.", "hi": "Jab muqarrar muddat ke liye qarz lo toh use likh lo."}, "ref": "Surah Al-Baqarah 2:282", "url": "https://quran.com/2/282"}, {"a": {"en": "Give time to those who owe you", "hi": "Jo tumhara qarzdaar hai use mohlat do"}, "d": {"en": "If the debtor is in hardship, give time until ease; forgiving it is better for you.", "hi": "Agar qarzdaar tangi mein ho toh aasaani tak mohlat do; maaf kar dena behtar hai."}, "ref": "Surah Al-Baqarah 2:280", "url": "https://quran.com/2/280"}, {"a": {"en": "Return trusts to their owners", "hi": "Amaanatein unke maalikon ko lautaao"}, "d": {"en": "Allah commands you to render trusts to whom they are due.", "hi": "Allah hukm deta hai ki amaanatein unke haqdaaron ko pahunchaao."}, "ref": "Surah An-Nisa 4:58", "url": "https://quran.com/4/58"}, {"a": {"en": "Hold on to taqwa for a way out", "hi": "Raasta nikalne ke liye taqwa thaamo"}, "d": {"en": "Whoever is mindful of Allah, He will make a way out for them.", "hi": "Jo Allah se dare, Allah uske liye raasta nikaal deta hai."}, "ref": "Surah At-Talaq 65:2", "url": "https://quran.com/65/2"}], "h": [{"a": {"en": "Take debt seriously", "hi": "Qarz ko sanjeedagi se lo"}, "d": {"en": "A martyr is forgiven everything except debt.", "hi": "Shaheed ka sab kuch maaf hai siwaye qarz ke."}, "ref": "Sahih Muslim 1886", "url": "https://sunnah.com/muslim:1886"}, {"a": {"en": "Borrow only with the intention to repay", "hi": "Sirf lautaane ki niyyat se qarz lo"}, "d": {"en": "Whoever takes people's money intending to repay it, Allah will repay it for him.", "hi": "Jo logon ka maal lautaane ki niyyat se le, Allah uski taraf se ada karwa deta hai."}, "ref": "Sahih al-Bukhari 2387", "url": "https://sunnah.com/bukhari:2387"}, {"a": {"en": "Don't delay when you can pay", "hi": "Ada kar sakte ho toh der na karo"}, "d": {"en": "Delay in paying by one who is able is injustice.", "hi": "Maaldaar ka qarz ada karne mein taal-matol zulm hai."}, "ref": "Sahih al-Bukhari 2287", "url": "https://sunnah.com/bukhari:2287"}, {"a": {"en": "Repay generously", "hi": "Achhe tareeqe se lautaao"}, "d": {"en": "The best of you are those who are best in repaying.", "hi": "Tum mein behtar woh hai jo qarz achhe tareeqe se ada kare."}, "ref": "Sahih al-Bukhari 2305", "url": "https://sunnah.com/bukhari:2305"}]}};

 oasis:{n:"Oasis",g:"linear-gradient(150deg,#0f4a3f 0%,#16685a 60%,#2b8a74 100%)"},
