let FEELINGS = [{"id": "anxious", "label": {"en": "anxious and restless", "hi": "pareshaan aur bechain"}, "phrases": ["anxi", "worr", "stress", "tense", "tension", "panic", "nervous", "restless", "overthink", "over think", "uneasy", "on edge", "can't breathe", "cant breathe", "heart racing", "heart is racing", "chest feels tight", "chest is tight", "mind won't stop", "mind wont stop", "pareshan", "pareshaan", "ghabra", "ghabrah", "bechain", "be chain", "dil baith", "dil ghabra", "sukoon nahi", "sukun nahi", "chain nahi", "fikr", "fikar", "dimag kharab", "dimaag kharab", "tension ho", "no peace", "can't relax", "cant relax"], "cats": ["anxiety", "trust"], "duas": ["hamm", "hayy", "karb", "sahl", "hasbi", "rahmataka"], "comfort": {"en": "What you're feeling is heavy, and it's okay to bring all of it to Allah. He knows every thought that keeps you awake, and He is closer to you than you think.", "hi": "Jo aap mehsoos kar rahe ho woh bhaari hai, aur yeh sab Allah ke saamne rakh dena bilkul theek hai. Woh aapki har soch jaanta hai, aur aapke bohot qareeb hai."}, "verse": {"en": "Verily, in the remembrance of Allah do hearts find rest.", "hi": "Suno, Allah ke zikr se hi dilon ko sukoon milta hai.", "ref": "Surah Ar-Ra'd 13:28"}}, {"id": "afraid", "label": {"en": "afraid of what might happen", "hi": "aage kya hoga, is baat se darr"}, "phrases": ["afraid", "scared", "fear", "frighten", "terrified", "dread", "what if", "worst will happen", "something bad", "darr", "dar lag", "darta", "darti", "khauf", "khof", "dara hua", "dari hui", "kya hoga"], "cats": ["anxiety", "courage", "trust"], "duas": ["hasbuna", "hasbi", "ufawwid", "tuakhidhna", "sahl"], "comfort": {"en": "Fear makes the future look darker than it is. The One who holds tomorrow is already there, and nothing reaches you except what He has written with wisdom and care.", "hi": "Darr aane waale kal ko asal se zyada andhera dikhata hai. Jo kal ka maalik hai woh pehle se wahan hai, aur aap tak wahi pahunchta hai jo usne hikmat aur pyaar se likha hai."}, "verse": {"en": "Say: Nothing will ever befall us except what Allah has written for us. He is our Protector.", "hi": "Keh do: humein sirf wahi pahunchega jo Allah ne hamare liye likh diya hai. Wahi hamara Maula hai.", "ref": "Surah At-Tawbah 9:51"}}, {"id": "sad", "label": {"en": "deeply sad", "hi": "bohot udaas"}, "phrases": ["sad", "unhappy", "depress", "miserable", "crying", "i cry", "tears", "heavy heart", "heart is heavy", "empty inside", "feel empty", "numb", "hopeless", "no hope", "udaas", "udas", "dukh", "dukhi", "rona", "ro rahi", "ro raha", "rota", "roti", "aansu", "dil bhari", "dil bhaari", "dil udaas", "mann nahi", "man nahi", "kuch accha nahi", "kuch achha nahi", "gham", "gam$", "feeling low", "feel low", "feeling down", "feel down", "cry$", "cries", "not happy", "unhappy", "khush nahi", "happy nahi"], "cats": ["grief", "anxiety", "closer"], "duas": ["hamm", "yunus", "karb", "rahmataka", "musiba"], "comfort": {"en": "Your tears are not weakness. Ya'qub (AS) cried until his eyes turned white, and he said, \"I only complain of my grief and sorrow to Allah.\" Tell Him everything; He is listening.", "hi": "Aapke aansu kamzori nahi hain. Yaqub (AS) itna roye ki aankhein safed ho gayin, aur unhone kaha: \"Main apna dukh aur gham sirf Allah se kehta hoon.\" Sab kuch usse keh do, woh sun raha hai."}, "verse": {"en": "He said: I only complain of my grief and sorrow to Allah.", "hi": "Unhone kaha: main apne dukh aur gham ki shikayat sirf Allah se karta hoon.", "ref": "Surah Yusuf 12:86"}}, {"id": "lonely", "label": {"en": "lonely and unseen", "hi": "akela aur anjaana"}, "phrases": ["lonely", "alone", "no one", "nobody", "no friends", "isolated", "left out", "no one understands", "nobody understands", "nobody cares", "no one cares", "ignored", "invisible", "unloved", "nobody loves", "no one loves", "akela", "akeli", "tanha", "tanhai", "koi nahi", "koi nahin", "kisi ko farq", "koi samajhta nahi", "koi samajhti nahi", "koi pyaar nahi", "koi pyar nahi", "sab chhod", "sab ne chhod"], "cats": ["closer", "anxiety"], "duas": ["rahmataka", "hubb", "yunus", "hayy", "raditu"], "comfort": {"en": "When it feels like no one sees you, Allah sees you completely, and He has not left you. Yunus (AS) was alone in the darkness of the sea, and Allah heard his whisper.", "hi": "Jab lage ki koi aapko nahi dekhta, Allah aapko poori tarah dekh raha hai, aur usne aapko chhoda nahi. Yunus (AS) samandar ke andhere mein akele the, aur Allah ne unki dheemi pukaar sun li."}, "verse": {"en": "Your Lord has not forsaken you, nor is He displeased.", "hi": "Tumhare Rab ne tumhe na chhoda hai, na woh tumse naraaz hai.", "ref": "Surah Ad-Duha 93:3"}}, {"id": "exhausted", "label": {"en": "exhausted and worn out", "hi": "thaka hua aur toota hua"}, "phrases": ["tired", "exhaust", "drained", "burn out", "burnt out", "burned out", "worn out", "no energy", "give up", "giving up", "can't do this", "cant do this", "can't take", "cant take", "too much", "enough of everything", "fed up", "thak gaya", "thak gayi", "thaka", "thaki", "himmat nahi", "himmat toot", "bas ho gaya", "bas kar", "haar gaya", "haar gayi", "aur nahi hota", "nahi ho raha", "nahi hota mujhse", "kuch nahi ho raha"], "cats": ["courage", "anxiety", "trust"], "duas": ["tuakhidhna", "sabr", "hayy", "rahmataka", "sahl"], "comfort": {"en": "You've been carrying a lot for a long time. Allah promised He never places on a soul more than it can bear, so even this, you can carry with His help. Rest your heart with Him.", "hi": "Aap bohot der se bohot kuch utha rahe ho. Allah ka waada hai ki woh kisi jaan par uski taaqat se zyada bojh nahi daalta, toh yeh bhi aap uski madad se utha loge. Apna dil usi ke paas rakh do."}, "verse": {"en": "Allah does not burden a soul beyond what it can bear.", "hi": "Allah kisi jaan par uski taaqat se zyada bojh nahi daalta.", "ref": "Surah Al-Baqarah 2:286"}}, {"id": "hardship", "label": {"en": "going through a hard time", "hi": "mushkil waqt se guzar rahe"}, "phrases": ["hard time", "difficult time", "struggl", "hardship", "suffer", "everything is going wrong", "nothing is working", "nothing works", "problem", "problems", "trouble", "crisis", "stuck", "trapped", "no way out", "mushkil", "musibat", "museebat", "pareshani", "pareshaani", "takleef", "kuch theek nahi", "sab ulta", "koi raasta nahi", "koi rasta nahi", "phans gaya", "phans gayi", "phasa hua"], "cats": ["anxiety", "trust", "courage"], "duas": ["karb", "yunus", "sahl", "hasbuna", "hayy"], "comfort": {"en": "This hardship is not the end of your story. Allah said it twice so your heart would believe it: with hardship comes ease. A way out is coming from where you don't expect.", "hi": "Yeh mushkil aapki kahaani ka ant nahi hai. Allah ne do baar kaha taaki dil yaqeen kare: mushkil ke saath aasaani hai. Raasta wahan se niklega jahan se aapne socha bhi nahi."}, "verse": {"en": "So surely with hardship comes ease. Surely with hardship comes ease.", "hi": "Beshak mushkil ke saath aasaani hai. Beshak mushkil ke saath aasaani hai.", "ref": "Surah Ash-Sharh 94:5-6"}}, {"id": "griefloss", "label": {"en": "grieving someone you lost", "hi": "kisi apne ko kho dene ka gham"}, "phrases": ["passed away", "passed on", "died", "death", "miss my", "funeral", "janaza", "grave", "widow", "miscarriage", "lost the baby", "lost a baby", "guzar gaye", "guzar gayi", "inteqal", "intiqal", "intkaal", "wafat", "maut", "mar gaye", "mar gayi", "chal base", "nahi rahe", "nahi rahi", "yaad aati", "yaad aa rahi", "bichhad", "gam$", "lost my mother", "lost my father", "lost my mom", "lost my mum", "lost my dad", "lost my husband", "lost my wife", "lost my son", "lost my daughter", "lost my brother", "lost my sister", "lost my friend", "lost my child", "lost my baby", "lost my grandmother", "lost my grandfather", "lost my nana", "lost my nani", "lost my dada", "lost my dadi"], "cats": ["grief", "parents"], "duas": ["musiba", "hamm", "karb", "rahmataka", "ibrahim41"], "comfort": {"en": "Missing someone is love that has nowhere to go. We belong to Allah and to Him we return, and those who are patient in loss are given good news. Your dua can still reach the one you miss.", "hi": "Kisi ko yaad karna woh pyaar hai jise ab jaane ki jagah nahi milti. Hum Allah ke hain aur usi ki taraf lautna hai, aur sabr karne waalon ko khushkhabri hai. Aapki dua ab bhi unhe pahunch sakti hai."}, "verse": {"en": "Those who, when disaster strikes them, say: Indeed we belong to Allah, and indeed to Him we will return.", "hi": "Jab un par musibat aati hai toh kehte hain: hum Allah ke hain aur usi ki taraf lautne waale hain.", "ref": "Surah Al-Baqarah 2:156"}, "w": 1.3}, {"id": "heartbreak", "label": {"en": "heartbroken or betrayed", "hi": "dil toota hua ya dhoka khaaya"}, "phrases": ["heartbr", "broken heart", "heart is broken", "betray", "cheated", "cheat on", "lied to me", "break up", "breakup", "broke up", "dumped", "left me", "rejected", "rejection", "used me", "hurt me", "hurt by", "dil toot", "dil tut", "dhoka", "dhokha", "bewafa", "chhod diya", "chod diya", "chhod ke", "jhooth bola", "dil dukha", "dil dukhaya", "toot gaya", "toot gayi", "tut gaya", "tut gayi"], "cats": ["grief", "contentment", "closer"], "duas": ["rahmataka", "hamm", "yunus", "ghill", "raditu"], "comfort": {"en": "Being hurt by someone you trusted leaves a deep wound. Allah saw every moment of it, and He is the One who mends broken hearts. What He takes away, He replaces with something better.", "hi": "Jis par bharosa kiya ho usse chot milna gehra zakhm deta hai. Allah ne har lamha dekha, aur wahi toote dil jodta hai. Jo woh le leta hai, uski jagah behtar deta hai."}, "verse": {"en": "Perhaps you dislike a thing and it is good for you. Allah knows, and you do not know.", "hi": "Ho sakta hai tum kisi cheez ko na pasand karo aur wahi tumhare liye behtar ho. Allah jaanta hai, tum nahi jaante.", "ref": "Surah Al-Baqarah 2:216"}, "w": 1.2}, {"id": "guilty", "label": {"en": "guilty about a sin or mistake", "hi": "kisi gunah ya galti par sharminda"}, "phrases": ["guilt", "ashamed", "shame", "regret", "sinned", "sinful", "mistake", "did wrong", "did something wrong", "bad person", "forgive me", "will allah forgive", "can allah forgive", "haram", "relapse", "again and again", "gunah", "gunaah", "galti", "ghalti", "sharminda", "sharmindagi", "pachtawa", "pachhtawa", "maafi", "maaf karega", "maaf karenge", "tauba", "tawba", "tobah", "bura kaam", "sin$", "sins$"], "cats": ["forgiveness", "closer"], "duas": ["istighfar", "zalamna", "afuww", "tubalayya", "yunus"], "comfort": {"en": "The pain you feel about your sin is itself a sign of iman. Allah loves to forgive, and He is happier with your return than you can imagine. No sin is bigger than His mercy.", "hi": "Gunah par jo dard aap mehsoos kar rahe ho, woh khud imaan ki nishani hai. Allah ko maaf karna pasand hai, aur aapke lautne par woh aapki soch se zyada khush hota hai. Koi gunah uski rehmat se bada nahi."}, "verse": {"en": "Do not despair of the mercy of Allah. Indeed, Allah forgives all sins.", "hi": "Allah ki rehmat se maayoos na ho. Beshak Allah saare gunah maaf kar deta hai.", "ref": "Surah Az-Zumar 39:53"}, "w": 1.2}, {"id": "distant", "label": {"en": "far from Allah", "hi": "Allah se door"}, "phrases": ["far from allah", "distant from allah", "disconnected", "feel distant", "lost connection", "no connection", "not close to allah", "dont feel allah", "don't feel allah", "not praying", "stopped praying", "no khushu", "heart is hard", "hard heart", "weak iman", "weak imaan", "low iman", "allah se door", "allah se doori", "namaz chhoot", "namaz nahi", "namaz chhod", "dil sakht", "imaan kamzor", "iman kamzor", "imaan kam", "dil nahi lagta", "ibadat mein dil"], "cats": ["closer", "faith", "prayers"], "duas": ["muqallib", "rahmataka", "hubb", "ainni", "habbib"], "comfort": {"en": "The fact that you miss closeness to Allah means your heart is still alive. Take one small step towards Him, and He comes to you faster. He never closed the door.", "hi": "Allah ki qurbat ki kami mehsoos hona batata hai ki aapka dil abhi zinda hai. Uski taraf ek chhota qadam uthao, woh aapki taraf usse tez aata hai. Usne darwaza kabhi band nahi kiya."}, "verse": {"en": "Remember Me; I will remember you.", "hi": "Tum mujhe yaad karo, main tumhe yaad karunga.", "ref": "Surah Al-Baqarah 2:152"}, "w": 1.1}, {"id": "unanswered", "label": {"en": "feeling your duas aren't answered", "hi": "lagta hai dua qubool nahi ho rahi"}, "phrases": ["dua not answered", "duas not answered", "dua isn't answered", "duas aren't answered", "prayers not answered", "allah isn't listening", "allah is not listening", "allah doesn't listen", "allah not listening", "why me", "why is allah", "allah hates", "allah is angry", "no answer", "waiting for so long", "waited so long", "dua qubool nahi", "dua kabool nahi", "dua qabool nahi", "allah sunta nahi", "allah nahi sunta", "allah naraz", "mere saath hi kyun", "kyun mere saath", "kab tak", "itne saal se"], "cats": ["trust", "faith", "closer"], "duas": ["hasbuna", "ufawwid", "raditu", "hayy", "yunus"], "comfort": {"en": "Allah has heard every single dua you made. He answers in one of three ways: He gives it, He keeps it for you in the akhirah, or He turns away a harm you never saw. Keep asking; your dua is never wasted.", "hi": "Allah ne aapki har ek dua suni hai. Woh teen tarah jawaab deta hai: ya woh de deta hai, ya aakhirat ke liye rakh leta hai, ya koi aisi musibat taal deta hai jo aapne dekhi bhi nahi. Maangte raho, dua kabhi zaaya nahi hoti."}, "verse": {"en": "I am near. I respond to the call of the caller when he calls upon Me.", "hi": "Main qareeb hoon. Jab pukaarne wala mujhe pukaarta hai toh main jawaab deta hoon.", "ref": "Surah Al-Baqarah 2:186"}, "w": 1.2}, {"id": "angry", "label": {"en": "angry or frustrated", "hi": "gussa ya jhunjhlahat"}, "phrases": ["angry", "anger", "furious", "frustrat", "irritat", "annoyed", "mad at", "temper", "shout", "yell", "snapped", "lose my temper", "lost my temper", "hate him", "hate her", "hate them", "gussa", "ghussa", "chidh", "chid$", "jhunjhla", "chillaya", "chillati", "chillata", "nafrat", "bardasht nahi", "rage$"], "cats": ["anger", "kindness"], "duas": ["taawwudh", "akhlaq", "haqq", "ahsin", "munkarat"], "comfort": {"en": "Anger is a fire, and it's human to feel it. The Prophet ﷺ said the truly strong one is the one who controls himself when angry. Pause, seek refuge in Allah, and let Him cool your heart.", "hi": "Gussa ek aag hai, aur insaan ko aata hai. Nabi ﷺ ne farmaaya asli taaqatwar woh hai jo gusse mein khud ko sambhaal le. Ruk jao, Allah ki panaah maango, aur use apne dil ko thanda karne do."}, "verse": {"en": "Those who restrain anger and pardon people. Allah loves those who do good.", "hi": "Jo gussa pee jaate hain aur logon ko maaf kar dete hain. Allah neki karne waalon se mohabbat karta hai.", "ref": "Surah Aal-Imran 3:134"}}, {"id": "jealous", "label": {"en": "comparing yourself or jealous", "hi": "doosron se muqabla ya jalan"}, "phrases": ["jealous", "envy", "envious", "compare", "comparing", "everyone else has", "others have", "why do they have", "their life is better", "better than me", "not fair", "unfair", "jalan", "jalta", "jalti", "hasad", "dusron ke paas", "doosron ke paas", "sab ke paas", "unke paas", "mere paas kuch nahi", "muqabla", "barabari"], "cats": ["jealousy", "contentment", "gratitude"], "duas": ["ghill", "ikfini", "raditu", "akhlaq", "maasbaha"], "comfort": {"en": "Comparing steals the joy of what Allah already gave you. Your rizq, your timing and your test are written just for you. Ask Him for good, and pray for them too; the angels say \"and for you the same\".", "hi": "Muqabla us khushi ko chura leta hai jo Allah ne pehle se di hai. Aapka rizq, aapka waqt aur aapka imtihaan sirf aapke liye likha hai. Usse bhalaai maango, aur unke liye bhi dua karo; farishte kehte hain \"aur tumhare liye bhi\"."}, "verse": {"en": "Do not wish for that by which Allah has favoured some of you over others. Ask Allah of His bounty.", "hi": "Us cheez ki tamanna na karo jisme Allah ne kuch ko kuch par fazilat di hai. Allah se uska fazl maango.", "ref": "Surah An-Nisa 4:32"}}, {"id": "confused", "label": {"en": "confused about a decision", "hi": "kisi faisle ko lekar uljhan"}, "phrases": ["confus", "don't know what to do", "dont know what to do", "which one", "should i", "decision", "decide", "choose", "choice", "torn between", "not sure", "unsure", "lost in life", "no direction", "what to do", "kya karun", "kya karu", "samajh nahi", "samajh mein nahi", "uljhan", "faisla", "faisala", "fesla", "kaunsa", "konsa", "haan ya na", "istikhara", "dont know whether", "don't know whether", "dont know if", "don't know if", "whether to", "should i accept", "accept this", "offer$", "two options"], "cats": ["guidance", "trust"], "duas": ["istikhara", "rushd", "sawaa", "huda", "ufawwid"], "comfort": {"en": "Not knowing which way to go is a heavy place to stand. Hand the choice to the One who knows the unseen: pray istikhara, then take the step, trusting that He will make good easy for you.", "hi": "Kaunsa raasta chunein, yeh na jaanna mushkil hai. Faisla us Zaat ko saunp do jo ghaib jaanta hai: istikhara padho, phir qadam uthao, is bharose ke saath ki woh bhalaai aasaan kar dega."}, "verse": {"en": "When you have decided, then put your trust in Allah. Allah loves those who trust Him.", "hi": "Jab tum iraada kar lo toh Allah par bharosa karo. Allah bharosa karne waalon se mohabbat karta hai.", "ref": "Surah Aal-Imran 3:159"}}, {"id": "money", "label": {"en": "worried about money", "hi": "paison ki fikr"}, "phrases": ["money", "broke", "no money", "bills", "rent", "afford", "salary", "income", "financ", "poor", "poverty", "loss in business", "business loss", "savings", "paisa", "paise", "paison", "kharcha", "kharch", "tankhwah", "tankha", "garibi", "gareebi", "nuksaan", "nuksan", "ghata", "dhanda", "kamai", "kamaai"], "cats": ["rizq", "debt"], "duas": ["razaqna", "ikfini", "faqir", "nafi", "fadl"], "comfort": {"en": "Money worries can take over every thought. Remember that your rizq was written before you were born, and no one can take what is yours. Do your part, and leave the outcome to the Best of Providers.", "hi": "Paison ki fikr har soch par chha jaati hai. Yaad rakho aapka rizq aapke paida hone se pehle likh diya gaya, aur jo aapka hai woh koi nahi le sakta. Apni koshish karo, nateeja sabse behtar Rozi dene waale par chhod do."}, "verse": {"en": "Whoever fears Allah, He will make a way out for him, and provide for him from where he does not expect.", "hi": "Jo Allah se darta hai, Allah uske liye raasta nikaal deta hai aur use wahan se rizq deta hai jahan se usne socha bhi na ho.", "ref": "Surah At-Talaq 65:2-3"}}, {"id": "debt", "label": {"en": "burdened by debt", "hi": "qarz ka bojh"}, "phrases": ["debt", "loan", "owe", "credit card", "borrow", "repay", "lender", "qarz", "karz", "karza", "qarza", "udhaar", "udhar", "kist", "kisht", "emi$", "emis$"], "cats": ["debt", "rizq"], "duas": ["ikfini", "hamm", "maghram", "faqir", "razaqna"], "comfort": {"en": "Debt can feel like a weight on your chest day and night. The Prophet ﷺ taught a dua for exactly this, and promised that Allah would settle a debt even as big as a mountain for the one who says it.", "hi": "Qarz din raat seene par bojh jaisa lagta hai. Nabi ﷺ ne isi ke liye dua sikhaayi, aur farmaaya ki jo yeh padhe Allah uska pahaad jitna qarz bhi ada karwa dega."}, "verse": {"en": "There is no creature on earth but that upon Allah is its provision.", "hi": "Zameen par koi chalne wala nahi jiska rizq Allah ke zimme na ho.", "ref": "Surah Hud 11:6"}, "w": 1.2}, {"id": "jobloss", "label": {"en": "worried about work or job", "hi": "kaam ya naukri ki fikr"}, "phrases": ["job", "jobless", "unemploy", "fired", "laid off", "layoff", "lost my job", "no job", "interview", "career", "boss", "office", "workplace", "promotion", "appraisal", "resign", "quit my job", "toxic work", "naukri", "nokri", "berozgar", "kaam nahi", "kaam chala", "nikal diya", "job chali", "job nahi", "job chhoot", "company ne"], "cats": ["career", "rizq"], "duas": ["sahl", "sadri", "faqir", "nafi", "fadl"], "comfort": {"en": "Your worth is not your job title, and your provision is not in any one door. Allah opens doors no one can close. Make the effort, and ask Him to make it easy and full of barakah.", "hi": "Aapki qeemat aapki naukri se nahi hai, aur aapka rizq kisi ek darwaze mein band nahi. Allah woh darwaze kholta hai jinhe koi band nahi kar sakta. Koshish karo, aur usse aasaani aur barakat maango."}, "verse": {"en": "Whatever mercy Allah opens to people, none can withhold it.", "hi": "Allah logon ke liye jo rehmat khol de, use koi rok nahi sakta.", "ref": "Surah Fatir 35:2"}}, {"id": "exam", "label": {"en": "stressed about studies or exams", "hi": "padhai ya imtihaan ka tension"}, "phrases": ["exam", "study", "studies", "result", "fail", "marks", "grades", "school", "college", "university", "assignment", "viva", "upsc", "memoris", "memoriz", "can't focus", "cant focus", "can't concentrate", "padhai", "padhaai", "imtihan", "imtihaan", "imtehan", "paper", "yaad nahi", "dhyaan nahi", "fail ho", "jee$", "neet$", "boards$", "board exam", "test$", "tests$"], "cats": ["exams", "knowledge"], "duas": ["sahl", "sadri", "zidni", "infani", "nafi"], "comfort": {"en": "You've done what you can; now let Allah carry the rest. Musa (AS) asked for an open chest, an easy task and clear words, and Allah gave him all three. Ask Him the same.", "hi": "Aapne jo ho saka kiya, ab baaqi Allah par chhod do. Musa (AS) ne khula seena, aasaan kaam aur saaf zabaan maangi, aur Allah ne teeno de diye. Aap bhi wahi maango."}, "verse": {"en": "My Lord, expand for me my chest, and ease for me my task.", "hi": "Aye mere Rab, mera seena khol de aur mera kaam aasaan kar de.", "ref": "Surah Ta-Ha 20:25-26"}}, {"id": "marriage", "label": {"en": "longing for marriage", "hi": "shaadi ka intezaar"}, "phrases": ["get married", "getting married", "marriage", "rishta", "proposal", "spouse", "not married", "still single", "single", "find someone", "right person", "soulmate", "life partner", "nikah", "waiting to marry", "shaadi", "shadi", "rishte", "rishtaa", "jodi", "jeevan saathi", "humsafar", "shaadi nahi", "shadi nahi", "umar ho gayi"], "cats": ["marriage", "guidance"], "duas": ["faqir", "istikhara", "qurra", "huda", "atina"], "comfort": {"en": "Waiting for the right person can feel lonely and long. Musa (AS) sat under a tree, tired and alone, and said \"My Lord, I am in need of whatever good You send me\", and Allah sent him a family.", "hi": "Sahi insaan ka intezaar lamba aur akela lag sakta hai. Musa (AS) ek ped ke neeche thake aur akele baithe the aur kaha \"Aye Rab, jo bhalaai tu bheje main uska mohtaaj hoon\", aur Allah ne unhe ghar aur parivaar diya."}, "verse": {"en": "And of His signs is that He created for you spouses that you may find tranquillity in them.", "hi": "Uski nishaniyon mein se hai ki usne tumhare liye jode banaye taaki tum unse sukoon pao.", "ref": "Surah Ar-Rum 30:21"}}, {"id": "marital", "label": {"en": "struggling in your marriage", "hi": "shaadi mein mushkilein"}, "phrases": ["my husband", "my wife", "husband", "wife", "in-laws", "in laws", "mother in law", "marriage problem", "fight with", "fights", "arguing", "argument", "divorce", "separation", "toxic marriage", "unhappy marriage", "no love between", "shauhar", "shohar", "biwi", "begum", "saas", "sasural", "nanad", "jhagda", "jhagde", "jhagra", "ladai", "larai", "talaq", "talak", "khula", "miyan biwi", "mian biwi"], "cats": ["marriage", "kindness", "anger"], "duas": ["qurra", "ghill", "akhlaq", "huda", "atina"], "comfort": {"en": "A home with conflict is exhausting, especially when you still care. Allah placed love and mercy between spouses, and He can soften hearts that seem hard. Ask Him to make your home a source of comfort again.", "hi": "Jhagdon waala ghar thaka deta hai, khaaskar jab aapko ab bhi parwah ho. Allah ne miyan biwi ke beech mohabbat aur rehmat rakhi hai, aur woh sakht dilon ko bhi narm kar sakta hai. Usse maango ki ghar phir se sukoon ki jagah ban jaaye."}, "verse": {"en": "And He placed between you affection and mercy.", "hi": "Aur usne tumhare beech mohabbat aur rehmat rakh di.", "ref": "Surah Ar-Rum 30:21"}, "w": 1.2}, {"id": "children", "label": {"en": "worried about your children", "hi": "bachchon ki fikr"}, "phrases": ["my child", "my children", "my kids", "my son", "my daughter", "kids", "children", "parenting", "teenager", "disobedient", "naughty", "not listening to me", "my baby", "bachche", "bachcha", "bachchi", "bacche", "beta", "beti", "aulad", "aulaad", "bachon", "bacchon", "baat nahi maante", "ziddi"], "cats": ["children", "home"], "duas": ["qurra", "salah", "ueedh", "dhurriyya", "ahqaf"], "comfort": {"en": "Worrying for your children is a form of love. You can guide them, but only Allah can place goodness in their hearts, so place them in His care, morning and evening.", "hi": "Bachchon ki fikr bhi mohabbat ka ek roop hai. Aap unhe raah dikha sakte ho, par unke dil mein bhalaai sirf Allah daal sakta hai, isliye subah shaam unhe uski hifaazat mein de do."}, "verse": {"en": "Our Lord, grant us from our spouses and offspring comfort to our eyes.", "hi": "Aye hamare Rab, hamein hamari biwiyon aur aulaad se aankhon ki thandak ata kar.", "ref": "Surah Al-Furqan 25:74"}}, {"id": "baby", "label": {"en": "longing for a baby", "hi": "aulad ki chaahat"}, "phrases": ["baby", "pregnan", "conceive", "infertil", "ivf", "trying for a child", "no children", "childless", "miscarr", "expecting", "aulad nahi", "aulaad nahi", "bachcha nahi", "bacha nahi", "umeed se", "pregnant nahi", "godh"], "cats": ["baby"], "duas": ["fardan", "salihin", "dhurriyya", "imran", "qurra"], "comfort": {"en": "Longing for a child is a quiet ache that few people see. Zakariyya (AS) was old and his wife was barren, yet he kept calling, \"Do not leave me alone\", and Allah gave him Yahya.", "hi": "Aulad ki chaahat ek khamosh dard hai jo kam log dekhte hain. Zakariyya (AS) boodhe the aur unki biwi baanjh thi, phir bhi woh pukaarte rahe \"mujhe akela na chhod\", aur Allah ne unhe Yahya diye."}, "verse": {"en": "My Lord, do not leave me alone, and You are the best of inheritors.", "hi": "Aye mere Rab, mujhe akela na chhod, aur tu sabse behtar waaris hai.", "ref": "Surah Al-Anbiya 21:89"}}, {"id": "parents", "label": {"en": "worried about your parents", "hi": "maa baap ki fikr"}, "phrases": ["my mother", "my father", "my mom", "my mum", "my dad", "my parents", "mother", "father", "parents", "old age", "ammi", "abbu", "abba", "ammi jaan", "papa", "walid", "waldain", "walidain", "maa baap", "maa-baap", "maa$", "mummy", "mumma"], "cats": ["parents"], "duas": ["walidayn", "ibrahim41", "nuh28", "shifa", "awzini"], "comfort": {"en": "Caring about your parents is among the most beloved deeds to Allah. Whatever is happening with them, your dua for them is a gift that never stops reaching them.", "hi": "Maa baap ki parwah Allah ke sabse pasandeeda aamaal mein se hai. Unke saath jo bhi ho raha ho, unke liye aapki dua aisa tohfa hai jo unhe hamesha pahunchta rehta hai."}, "verse": {"en": "My Lord, have mercy upon them as they brought me up when I was small.", "hi": "Aye mere Rab, un dono par reham farma jaise unhone mujhe bachpan mein paala.", "ref": "Surah Al-Isra 17:24"}}, {"id": "sick", "label": {"en": "unwell or in pain", "hi": "beemar ya dard mein"}, "phrases": ["sick", "illness", "disease", "pain", "hurts", "hospital", "surgery", "operation", "diagnos", "cancer", "fever", "doctor", "medicine", "treatment", "chronic", "migraine", "injur", "report came", "bimar", "beemar", "beemari", "bimari", "dard", "takleef", "bukhar", "bukhaar", "dawa", "dawai", "ilaj", "ilaaj", "hospital mein", "ill$", "not well", "unwell", "tabiyat", "tabiyat kharab", "tabeeyat"], "cats": ["healing"], "duas": ["shifa", "qudra", "ayyub", "afini", "afwafiya"], "comfort": {"en": "Being in pain is hard on the body and the heart. Ayyub (AS) suffered for years and only said \"harm has touched me, and You are the Most Merciful\". Every ache you bear patiently wipes away sins.", "hi": "Dard jism aur dil dono ko thaka deta hai. Ayyub (AS) saalon takleef mein rahe aur bas kaha \"mujhe takleef pahunchi hai aur tu sabse zyada reham karne wala hai\". Sabr se sahi har takleef gunah mita deti hai."}, "verse": {"en": "And when I am ill, it is He who cures me.", "hi": "Aur jab main beemar hota hoon toh wahi mujhe shifa deta hai.", "ref": "Surah Ash-Shu'ara 26:80"}, "w": 1.2}, {"id": "sleep", "label": {"en": "can't sleep", "hi": "neend nahi aati"}, "phrases": ["can't sleep", "cant sleep", "cannot sleep", "sleepless", "insomnia", "awake all night", "up all night", "nightmare", "bad dream", "night time", "at night", "neend nahi", "nind nahi", "neend nahin", "raat bhar", "raat ko", "bure khwab", "bura khwab", "bura sapna", "daraavne"], "cats": ["sleep", "anxiety"], "duas": ["nawm", "wadatu", "qini", "bara", "kursi"], "comfort": {"en": "When the night feels long, Allah is awake: He neither slumbers nor sleeps. Hand Him the thoughts that keep you up, recite Ayat al-Kursi, and let your heart lie down with His name.", "hi": "Jab raat lambi lage, Allah jaag raha hai: use na oongh aati hai na neend. Jo khayaal aapko jagaate hain woh use saunp do, Ayatul Kursi padho, aur uska naam lekar dil ko aaraam do."}, "verse": {"en": "Neither drowsiness overtakes Him nor sleep.", "hi": "Use na oongh aati hai na neend.", "ref": "Surah Al-Baqarah 2:255"}}, {"id": "evil", "label": {"en": "worried about evil eye or harm", "hi": "nazar, jaadu ya nuksaan ka darr"}, "phrases": ["evil eye", "nazar", "black magic", "magic", "sihr", "jinn", "jinns", "possess", "haunt", "bad energy", "someone did something", "cursed", "curse", "envy of people", "protection", "jaadu", "jadu", "jaadoo", "tona", "totka", "bandish", "aasaib", "asaib", "saya", "saaya", "buri nazar"], "cats": ["evil", "protection"], "duas": ["kursi", "kalimat", "bismillah", "taawwudh", "ueedh"], "comfort": {"en": "It's natural to worry about harm you can't see. But nothing and no one can harm you except by Allah's permission. Wrap yourself in His words every morning and evening, and trust His protection.", "hi": "Jo nuksaan dikhta nahi uski fikr hona fitri hai. Par Allah ki ijaazat ke bina koi cheez aur koi shakhs aapko nuksaan nahi pahuncha sakta. Subah shaam uske kalaam ki panaah lo, aur uski hifaazat par bharosa rakho."}, "verse": {"en": "Say: I seek refuge in the Lord of daybreak, from the evil of what He created.", "hi": "Kaho: main subah ke Rab ki panaah maangta hoon, uski banaayi hui har cheez ki buraai se.", "ref": "Surah Al-Falaq 113:1-2"}}, {"id": "travel", "label": {"en": "about to travel", "hi": "safar par jaane waale"}, "phrases": ["travel", "trip", "journey", "flight", "flying", "fly to", "road trip", "going abroad", "visa", "moving abroad", "umrah", "hajj", "safar", "safar par", "bahar ja", "videsh", "long drive"], "cats": ["travel", "protection"], "duas": ["safar", "majraha", "safar2", "kalimat", "tawakkaltu"], "comfort": {"en": "A journey is a time when duas are accepted. Put your trip, your family and everything you leave behind in Allah's care; nothing left with Him is ever lost.", "hi": "Safar mein duaein qubool hoti hain. Apna safar, apna parivaar aur jo kuch peeche chhod rahe ho sab Allah ke hawaale kar do; jo uske paas amaanat rakha jaaye woh kabhi zaaya nahi hota."}, "verse": {"en": "Glory be to the One who has placed this at our service, and we could not have done it ourselves.", "hi": "Paak hai woh jisne ise hamare liye taabe kar diya, warna hum ise kaabu na kar paate.", "ref": "Surah Az-Zukhruf 43:13"}}, {"id": "home", "label": {"en": "about home or moving", "hi": "ghar ya naye ghar ki baat"}, "phrases": ["new house", "new home", "moving house", "shifting", "rent a", "landlord", "buy a house", "own home", "no home", "homeless", "new city", "relocat", "naya ghar", "ghar badal", "ghar shift", "makaan", "kiraya", "kiraaye", "apna ghar", "ghar nahi"], "cats": ["home", "rizq"], "duas": ["manzil", "balad", "qurra", "kalimat", "nuh28"], "comfort": {"en": "A home is more than walls; it's where your heart rests. Ask Allah for a blessed place to settle, the way Nuh (AS) did, and fill it with His remembrance.", "hi": "Ghar sirf deewaron ka naam nahi, yeh dil ke aaraam ki jagah hai. Nuh (AS) ki tarah Allah se barakat waali jagah maango, aur use uske zikr se bhar do."}, "verse": {"en": "My Lord, let me land at a blessed landing place, and You are the best to accommodate us.", "hi": "Aye mere Rab, mujhe barakat waali jagah utaar, aur tu sabse behtar utaarne wala hai.", "ref": "Surah Al-Mu'minun 23:29"}}, {"id": "lazy", "label": {"en": "unmotivated or stuck in bad habits", "hi": "susti ya buri aadaton mein phansa"}, "phrases": ["lazy", "laziness", "procrastinat", "unmotivated", "no motivation", "demotivat", "waste time", "wasting time", "addicted to my phone", "phone addiction", "scrolling", "bad habit", "discipline", "consistent", "consistency", "susti", "aalas", "aalsi", "kaahil", "kahil", "mann nahi lagta", "man nahi lagta", "waqt barbad", "phone ki lat", "aadat", "aadaton", "can't stop scrolling", "cant stop scrolling"], "cats": ["discipline", "prayers"], "duas": ["hamm", "rushd", "sabr", "salah", "munkarat"], "comfort": {"en": "Feeling stuck doesn't mean you're a bad person; it means you need help, and the Prophet ﷺ himself asked Allah for refuge from laziness. Start with one small deed done consistently; that's what Allah loves most.", "hi": "Phansa hua mehsoos karna bura insaan hone ki nishani nahi; iska matlab hai aapko madad chahiye, aur Nabi ﷺ ne khud susti se Allah ki panaah maangi. Ek chhota amal roz karo; Allah ko wahi sabse pasand hai."}, "verse": {"en": "Those who strive for Us, We will surely guide them to Our ways.", "hi": "Jo hamare liye koshish karte hain, hum unhe zaroor apne raaste dikha dete hain.", "ref": "Surah Al-Ankabut 29:69"}}, {"id": "doubt", "label": {"en": "struggling with doubts in faith", "hi": "imaan mein shak ya kamzori"}, "phrases": ["doubt", "doubts", "not sure allah", "does allah exist", "is islam true", "questioning", "losing faith", "lost faith", "faith is weak", "waswas", "whispers", "shaytan", "shaitan", "shak", "shaq", "waswase", "wasvase", "imaan dagmaga", "yaqeen nahi", "yakeen nahi"], "cats": ["faith", "guidance", "closer"], "duas": ["muqallib", "tuzigh", "habbib", "raditu", "huda"], "comfort": {"en": "Even the Companions felt whispers that troubled them, and the Prophet ﷺ said that hating such thoughts is clear faith. Keep asking Allah to make your heart firm; He is the Turner of hearts.", "hi": "Sahaba ko bhi aise waswase aate the jo unhe pareshaan karte, aur Nabi ﷺ ne farmaaya ki unhe bura samajhna khud saaf imaan hai. Allah se dil ki mazbooti maangte raho; wahi dilon ko pherne wala hai."}, "verse": {"en": "Whoever believes in Allah, He will guide his heart.", "hi": "Jo Allah par imaan laaye, Allah uske dil ko hidaayat deta hai.", "ref": "Surah At-Taghabun 64:11"}}, {"id": "grateful", "label": {"en": "grateful and happy", "hi": "shukr guzaar aur khush"}, "phrases": ["grateful", "thankful", "alhamdulillah", "blessed", "happy", "good news", "so happy", "excited", "finally", "it happened", "got the job", "passed", "got married", "dream came true", "khush", "khushi", "shukr", "shukar", "shukriya", "mubarak", "kaamyab", "kamyab", "ho gaya alhamdulillah"], "cats": ["gratitude", "contentment"], "duas": ["maasbaha", "awzini", "ainni", "raditu", "atina"], "comfort": {"en": "Alhamdulillah! Remember this moment, because Allah promised more to those who thank Him. Turn your happiness into shukr so the blessing stays and grows.", "hi": "Alhamdulillah! Is lamhe ko yaad rakhna, kyunki Allah ne shukr karne waalon ko aur dene ka waada kiya hai. Apni khushi ko shukr mein badlo taaki naimat bani rahe aur badhe."}, "verse": {"en": "If you are grateful, I will surely increase you.", "hi": "Agar tum shukr karoge toh main tumhe aur zyada dunga.", "ref": "Surah Ibrahim 14:7"}}, {"id": "peace", "label": {"en": "wanting inner peace and contentment", "hi": "andar ka sukoon chahiye"}, "phrases": ["peace", "calm", "content", "inner peace", "peace of mind", "satisf", "enough", "restless soul", "want to be happy", "be happy again", "meaning", "purpose", "sukoon", "sukun", "itminan", "itminaan", "chain chahiye", "qanaat", "qana'at", "khush rehna"], "cats": ["contentment", "closer"], "duas": ["raditu", "huda", "ikfini", "hubb", "atina"], "comfort": {"en": "Real peace doesn't come from having everything; it comes from being pleased with the One who gives everything. Remember Him often, and your heart will find the rest it's searching for.", "hi": "Asal sukoon sab kuch hone se nahi aata; woh us Zaat se raazi hone se aata hai jo sab kuch deta hai. Use kasrat se yaad karo, aapka dil woh aaraam paa lega jise woh dhoondh raha hai."}, "verse": {"en": "Verily, in the remembrance of Allah do hearts find rest.", "hi": "Suno, Allah ke zikr se hi dilon ko sukoon milta hai.", "ref": "Surah Ar-Ra'd 13:28"}}, {"id": "death_akhirah", "label": {"en": "thinking about death and the hereafter", "hi": "maut aur aakhirat ki soch"}, "phrases": ["afraid of death", "fear of death", "scared of dying", "hereafter", "akhirah", "akhirat", "aakhirat", "jannah", "jannat", "paradise", "jahannam", "day of judgement", "qiyamah", "qayamat", "grave punishment", "azab", "hell$", "hellfire"], "cats": ["jannah", "forgiveness"], "duas": ["janna", "abrar", "warathah", "istighfar", "asiyah"], "comfort": {"en": "Thinking about the akhirah is a sign of a living heart. Allah's mercy outweighs His anger, and He wants Jannah for you more than you want it for yourself. Ask Him for it often.", "hi": "Aakhirat ki soch zinda dil ki nishani hai. Allah ki rehmat uske gusse par ghaalib hai, aur woh aapke liye Jannat aapse zyada chahta hai. Usse baar baar Jannat maango."}, /* ---------- Describe it: understanding the heart ---------- */
function heartNorm(t){return " "+String(t||"").toLowerCase().replace(/[’`]/g,"'").replace(/\bi'll\b/g,"i will").replace(/\bwon't\b/g,"will not").replace(/'/g,"").replace(/[^a-z0-9ऀ-ॿ؀-ۿ]+/g," ").replace(/([a-z])\1{2,}/g,"$1$1").replace(/\s+/g," ").trim()+" "}
const HEART_NEG_BEFORE=["not","never","dont","didnt","isnt","arent","wasnt","no"], HEART_NEG_AFTER=["nahi","nahin","nhi","na"];
function heartHit(T,p){const whole=p.endsWith("$"),q=heartNorm(whole?p.slice(0,-1):p).trim();if(!q)return 0;const needle=" "+q+(whole?" ":"");
 let at=T.indexOf(needle),hit=0;const neg=/\b(not|never|no|nahi|nahin|nhi|na)\b/.test(q);
 while(at>=0){const before=T.slice(0,at).trim().split(" ").slice(-2),after=T.slice(at+needle.length).trim().split(" ")[0];
  if(neg||!(before.some(w=>HEART_NEG_BEFORE.includes(w))||HEART_NEG_AFTER.includes(after))){hit=1;break}
  at=T.indexOf(needle,at+1)}
 return hit?q.split(" ").length+(q.length>8?.5:0):0}
function readHeart(text){const T=heartNorm(text);
 const crisis=CRISIS.some(p=>heartHit(T,p));
 const scored=FEELINGS.map(f=>{const seen={},hits=[];f.phrases.forEach(p=>{const k=heartNorm(p.replace(/\$$/,"")).trim()+(p.endsWith("$")?"$":"");if(seen[k])return;seen[k]=1;const h=heartHit(T,p);if(h)hits.push(h)});const mx=hits.length?Math.max(...hits):0,sum=hits.reduce((a,b)=>a+b,0);return {f,s:(mx+.5*(sum-mx))*(f.w||1)}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
 const top=scored.length?[scored[0].f].concat(scored[1]&&scored[1].s>=scored[0].s*.5?[scored[1].f]:[]):[];
 const main=top.length?top:[FEEL_DEFAULT];
 const duas=[];main.forEach(f=>f.duas.forEach(id=>{if(DUA[id]&&!duas.includes(id))duas.push(id)}));
 const cats=[];main.forEach(f=>f.cats.forEach(id=>{if(CAT[id]&&!cats.includes(id))cats.push(id)}));
 CATS.forEach(c=>{if(cats.length<6&&!cats.includes(c.id)&&((KEYWORDS[c.id]||[]).some(k=>T.includes(" "+k))))cats.push(c.id)});
 return {crisis,matched:top.length>0,feel:main,duas:duas.slice(0,6),cats:cats.slice(0,6)}}
function heartLang(){return S.lang==="hi"?"hi":"en"}
let GROUPS = [], ALIASES = {}, ORDER = {};
let CONTENT_VERSION = 5;
function useContent(c){
 if(!c||!Array.isArray(c.duas)||!Array.isArray(c.categories)||!c.duas.length) return false;
 DUAS=c.duas.map(d=>({id:d.id,t:d.title,cats:d.categories||[],ref:d.reference||"",ar:d.arabic,tl:d.transliteration||"",en:d.english||""}));
 HI=Object.fromEntries(c.duas.filter(d=>d.hinglish).map(d=>[d.id,d.hinglish]));
 BG=Object.fromEntries(c.duas.filter(d=>d.story&&(d.story.en||d.story.hi)).map(d=>[d.id,{en:d.story.en||d.story.hi,hi:d.story.hi||d.story.en}]));
 CATS=c.categories.map(x=>({id:x.id,name:x.name,icon:x.icon||"star",color:x.color||"#e3b768",names:x.names||[],sal:x.salawat||""}));
 WORDS=Object.fromEntries(c.duas.map(d=>[d.id,(d.words||[]).map(w=>({ar:w.ar,tl:w.tl||"",root:w.root||"",en:w.en||"",hi:w.hi||w.en||"",nen:(w.note||{}).en||"",nhi:(w.note||{}).hi||""}))]));
 GUIDE=Object.fromEntries(c.categories.map(x=>{const m=o=>({a:o.action,d:o.detail,ref:o.ref||"",url:o.url||""});return [x.id,{q:(x.quran||[]).map(m),h:(x.hadith||[]).map(m)}]}));
 if(c.names) NAMES=c.names; if(c.salawat) SALAWAT=c.salawat; if(c.opening) OPENING=c.opening;
 KEYWORDS=Object.fromEntries(c.categories.map(x=>[x.id,x.keywords||[]]));
 ALIASES=c.aliases||{}; ORDER=Object.fromEntries(c.categories.filter(x=>Array.isArray(x.order)).map(x=>[x.id,x.order])); GROUPS=(c.groups||[]).map(g=>({id:g.id,name:g.name,icon:g.icon||"folder",color:g.color||"#e3b768",children:(g.children||[]).filter(id=>c.categories.some(x=>x.id===id))})).filter(g=>g.children.length);
 CAT=Object.fromEntries(CATS.map(x=>[x.id,x]));
 CAT._saved={id:"_saved",name:"Saved Duas",icon:"bookmark",color:"#a78bfa"};
 CAT._heart={id:"_heart",name:"For your heart",icon:"heart",color:"#e3b768"};
 if(Array.isArray(c.feelings)&&c.feelings.length)FEELINGS=c.feelings; if(c.feelingDefault)FEEL_DEFAULT=c.feelingDefault; if(Array.isArray(c.crisis))CRISIS=c.crisis;
 DUA=Object.fromEntries(DUAS.map(d=>[d.id,d]));
 DAILY=(c.daily||[]).filter(id=>DUA[id]);
 if(Array.isArray(c.verses)&&c.verses.length) VERSES=c.verses.map(v=>[v.text,v.ref]);
 CONTENT_VERSION=c.version||0;
 return true;
}
function cleanState(){S.goals=[...new Set(S.goals.map(g=>ALIASES[g]||g))].filter(g=>CAT[g]);S.saved=S.saved.filter(id=>DUA[id])}
function loadCachedContent(){try{const c=JSON.parse(localStorage.getItem("munajat-content")||"null");if(c)useContent(c)}catch(e){}}
async function refreshContent(){
 if(CONTENT_URL.includes("YOUR-GITHUB-USERNAME")) return;
 try{
  const r=await fetch(CONTENT_URL+"?t="+Date.now(),{cache:"no-store"});
  if(!r.ok) return;
  const c=await r.json();
  if((c.version||0)<=CONTENT_VERSION) return;
  const before=DUAS.length;
  if(!useContent(c)) return;
  try{localStorage.setItem("munajat-content",JSON.stringify(c))}catch(e){}
  cleanState(); save();
  if(view.name!=="reader") render();
  if(DUAS.length>before) toast(`${DUAS.length-before} new dua${DUAS.length-before>1?"s":""} added`);
 }catch(e){ console.warn("Content refresh failed",e) }
}

/* ---------- Native reminders (Capacitor) ---------- */
const LN = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() ? window.Capacitor.Plugins.LocalNotifications : null;
const NUDGES = [
 ["Time for a dua","Take one quiet minute with Allah."],
 ["He is near","“When My servants ask about Me, I am near.” Open your duas."],
 ["Your intentions are waiting","A few duas today, a lighter heart tonight."],
 ["Pause and ask","Whatever is on your heart, tell Allah."],
 ["End the day with dua","Read before you sleep: Bismika Allahumma amutu wa ahya."]];
async function syncReminders(){
 if(!LN) return;
 try{
  await LN.cancel({notifications:[1,2,3,4,5].map(id=>({id}))});
  if(!S.reminders) return;
  let perm = await LN.checkPermissions();
  if(perm.display!=="granted") perm = await LN.requestPermissions();
  if(perm.display!=="granted"){ S.reminders=false; save(); render(); toast("Allow notifications in Settings to get reminders"); return; }
  const toMin=t=>{const [h,m]=t.split(":").map(Number);return h*60+m};
  let a=toMin(S.morning), b=toMin(S.night); if(b<=a) b=a+60;
  const n=S.perDay, list=[];
  for(let k=0;k<n;k++){const t=Math.round(n===1?(a+b)/2:a+(b-a)*k/(n-1));
   const [title,body]=NUDGES[k%NUDGES.length];
   list.push({id:k+1,title,body,schedule:{on:{hour:Math.floor(t/60)%24,minute:t%60},repeats:true,allowWhileIdle:true}})}
  await LN.schedule({notifications:list});
 }catch(e){ console.warn("Reminder scheduling failed",e) }
}

};
document.addEventListener("click", async e => { const b = e.target.closest("[data-rmbuyer]"); if (!b) return; const em = b.dataset.rmbuyer;
  confirmSheet(`Remove ${em}? They'll be locked out the next time they open Munajat.`, "Remove", async () => { try { await db.collection("buyers").doc(em).delete(); toast("Removed"); loadBuyers(); } catch (err) { toast("Couldn't remove. Try again."); } }); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && USER) refreshContent(); });

/* ---------- Support tickets: a bridge between buyers and the admin ---------- */
const TK = { type: "feedback", filter: "open", last: 0, unseen: [], toasted: false, mine: null };
const TK_TYPES = { feedback: "Feedback", problem: "Problem", dua: "Dua correction", idea: "Suggest a dua or topic" };
const TK_ST = { open: "Received", working: "Working on it", added: "Added to the app", resolved: "Answered" };
const TK_ST_ADMIN = { open: "New", working: "Working on it", added: "Added to app", resolved: "Answered" };
const tkDate = t => { try { const d = t && t.toDate ? t.toDate() : null; return d ? d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) + ", " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }) : "Just now"; } catch (_) { return ""; } };
const tkName = () => (S.name || (USER && USER.displayName) || lc(USER && USER.email).split("@")[0] || "Buyer").slice(0, 40);

window.helpExtra = function(){ if (!USER) return "";
  return `<h2 class="sec" style="margin:8px 0 0;font-size:20px">Send us a message</h2>
  <div class="fb"><div class="fbtypes">${Object.entries(TK_TYPES).map(([k, v]) => `<button data-fbtype="${k}" class="${TK.type === k ? "on" : ""}">${v}</button>`).join("")}</div>
   <textarea id="fbmsg" maxlength="2000" placeholder="Write your message. Want a dua or topic added? Tell us what you're going through and we'll try to add it." style="min-height:120px"></textarea>
   <button class="primary" id="fbsend" style="display:flex;gap:8px;align-items:center;justify-content:center">${ic("send")} Send message</button>
   <p id="fbinfo" class="muted" style="margin:0;font-size:13px;min-height:18px;font-weight:600">Sent as ${esc(tkName())} (${esc(USER.email)}). You'll get a notification here when we reply or add it to the app.</p></div>
  <h2 class="sec" id="mymsgs" style="margin:8px 0 0;font-size:20px">My messages</h2>
  <div id="mytk" class="stack" style="gap:10px"><p class="muted" style="margin:0">Loading…</p></div>`; };

function tkCard(t, admin){ const x = t.data(), st = TK_ST[x.status] ? x.status : "open", fresh = !admin && x.seen === false;
  const tid = ALIASES[x.topic] || x.topic, topic = tid && CAT[tid] ? CAT[tid] : null;
  return `<div class="tk ${fresh ? "unseen" : ""}"><div class="top">${fresh ? `<span class="new">New update</span>` : ""}<span class="tag">${esc(TK_TYPES[x.type] || "Feedback")}</span><span class="st ${st}">${(admin ? TK_ST_ADMIN : TK_ST)[st]}</span><span>${esc(tkDate(x.created))}</span></div>
  ${admin ? `<div class="who"><div class="av">${esc((x.name || x.email || "?")[0].toUpperCase())}</div><div style="min-width:0"><div style="font-weight:800">${esc(x.name || "Buyer")}</div><a href="mailto:${esc(x.email || "")}">${esc(x.email || "")}</a></div></div>` : ""}
  <p class="msg">${esc(x.message || "")}</p>
  ${x.reply ? `<div><div class="muted" style="font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px">${admin ? "Your reply" : "Reply from Munajat"}${x.updated ? " · " + esc(tkDate(x.updated)) : ""}</div><p class="rep">${esc(x.reply)}</p></div>` : (admin ? "" : `<p class="muted" style="margin:0;font-size:13px">Thank you. We'll reply here soon, in sha Allah.</p>`)}
  ${topic ? `<button class="pill" data-cat="${topic.id}" style="align-self:flex-start;display:flex;gap:6px;align-items:center">${ic(topic.icon)} ${admin ? "Linked topic" : "Open"}: ${esc(topic.name)}</button>` : ""}
  ${admin ? `<div class="acts"><button class="pill" data-tkreply="${t.id}">${x.reply ? "Update" : "Reply / update"}</button>
   <a class="pill" href="mailto:${encodeURIComponent(x.email || "")}?subject=${encodeURIComponent("Munajat support: " + (TK_TYPES[x.type] || "Feedback"))}">Email</a>
   <button class="pill" data-tkdel="${t.id}" style="color:var(--danger)">Delete</button></div>` : ""}</div>`; }

/* --- buyer side --- */
async function fetchMine(){ if (!USER) return [];
  const q = await db.collection("tickets").where("uid", "==", USER.uid).get();
  TK.mine = q.docs.sort((a, b) => ((b.data().updated || b.data().created || {}).seconds || 9e9) - ((a.data().updated || a.data().created || {}).seconds || 9e9));
  TK.unseen = TK.mine.filter(d => d.data().seen === false); return TK.mine; }
async function loadMyTickets(){ const box = document.getElementById("mytk"); if (!box || !USER) return;
  try { const docs = await fetchMine();
    box.innerHTML = docs.length ? docs.map(d => tkCard(d, false)).join("") : `<p class="muted" style="margin:0">No messages yet.</p>`; icons();
    const fresh = docs.filter(d => d.data().seen === false);
    if (fresh.length) { if (view.scrollMine) { const h = document.getElementById("mymsgs"); if (h) h.scrollIntoView({ behavior: "smooth", block: "start" }); view.scrollMine = false; }
      await Promise.all(fresh.map(d => db.collection("tickets").doc(d.id).update({ seen: true }).catch(() => {})));
      TK.unseen = []; paintNotes(); }
  } catch (e) { console.warn("Load tickets failed", e); box.innerHTML = `<p class="muted" style="margin:0">${e && e.code === "permission-denied" ? "Messages aren't available yet. Please try again later." : "Couldn't load your messages. Check your internet."}</p>`; } }
async function checkNotes(){ if (!USER) return; try { await fetchMine(); } catch (_) { return; }
  paintNotes();
  if (TK.unseen.length && !TK.toasted) { TK.toasted = true; toast(TK.unseen.length === 1 ? "You have a new reply from Munajat" : `You have ${TK.unseen.length} new replies from Munajat`); } }
function noteText(d){ const x = d.data(); return x.status === "added" ? (x.topic && CAT[x.topic] ? `Your suggestion was added to the app in “${CAT[x.topic].name}”.` : "Your suggestion was added to the app.") : (x.reply || "There's an update on your message."); }
function paintNotes(){ const n = TK.unseen.length;
  const me = document.querySelector('.tab[data-tab="account"]');
  if (me) { let dot = me.querySelector(".tabdot"); if (n && !dot) { dot = document.createElement("span"); dot.className = "tabdot"; me.appendChild(dot); } if (!n && dot) dot.remove(); }
  const help = document.querySelector('[data-page="help"]');
  if (help) { let b = help.querySelector(".tbadge"); if (n && !b) { b = document.createElement("span"); b.className = "tbadge on"; help.insertBefore(b, help.lastElementChild); } if (b) { if (n) b.textContent = n; else b.remove(); } }
  const old = document.getElementById("tknote"); if (old) old.remove();
  if (n && view.name === "home") { const first = app.querySelector(".stack > .row"); if (!first) return;
    const d = TK.unseen[0], x = d.data();
    first.insertAdjacentHTML("afterend", `<button class="notecard" id="tknote">${ic(x.status === "added" ? "sparkles" : "message-circle")}<div style="flex:1;min-width:0"><b style="display:block;margin-bottom:2px">${x.status === "added" ? "Your suggestion is in the app" : "Munajat replied to you"}${n > 1 ? ` <span class="muted" style="font-weight:600">+${n - 1} more</span>` : ""}</b><span class="muted" style="font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(noteText(d))}</span></div>${ic("chevron-right", "class='chev'")}</button>`);
    icons(); document.getElementById("tknote").onclick = () => go("page", { p: "help", scrollMine: true }); } }

/* --- admin side --- */
V.tickets = function(){ return `<div class="stack" style="gap:18px"><button class="iconbtn" data-act="back" aria-label="Back" style="color:var(--fg)">${ic("chevron-left")}</button>
 <div><h1 class="big">Support tickets</h1><p class="muted" style="margin:6px 0 0;line-height:1.5">Messages buyers send from Help &amp; Support. When you reply or mark something as added, the buyer gets a notification in their app.</p></div>
 <div class="segs">${[["open", "To do"], ["done", "Done"], ["ideas", "Ideas"], ["all", "All"]].map(([k, v]) => `<button data-tkfilter="${k}" class="${TK.filter === k ? "on" : ""}">${v}</button>`).join("")}</div>
 <button class="ghost" id="tkcopy" style="display:flex;gap:8px;align-items:center;justify-content:center">${ic("clipboard-copy")}Copy open dua &amp; topic ideas</button>
 <div id="tklist" class="stack" style="gap:12px"><p class="muted" style="margin:0">Loading…</p></div></div>`; };
const tkMatch = (x, f) => { const st = x.status || "open"; return f === "all" || (f === "open" && (st === "open" || st === "working")) || (f === "done" && (st === "added" || st === "resolved")) || (f === "ideas" && (x.type === "idea" || x.type === "dua")); };
let TK_ALL = [];
async function loadTickets(){ const box = document.getElementById("tklist"); if (!box) return;
  try { const q = await db.collection("tickets").orderBy("created", "desc").limit(300).get(); TK_ALL = q.docs;
    const docs = q.docs.filter(d => tkMatch(d.data(), TK.filter));
    box.innerHTML = docs.length ? docs.map(d => tkCard(d, true)).join("") : `<div class="empty card">${TK.filter === "open" ? "Nothing to do. Alhamdulillah!" : "Nothing here yet."}</div>`; icons();
  } catch (e) { box.innerHTML = `<p style="margin:0;color:var(--danger)">Couldn't load tickets. Check the Firestore rules and your internet.</p>`; } }
async function loadTicketBadge(){ const el = document.getElementById("tbadge"); if (!el || !IS_ADMIN) return;
  try { const q = await db.collection("tickets").where("status", "==", "open").get(); el.textContent = q.size; el.classList.toggle("on", q.size > 0); } catch (_) {} }
function tkSheet(id){ const t = TK_ALL.find(d => d.id === id); if (!t) return; const x = t.data(); let st = x.status && x.status !== "open" ? x.status : "resolved";
  const opts = CATS.map(c => `<option value="${c.id}" ${x.topic === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("");
  sheet(`<h2 style="font-size:22px;margin-bottom:4px">Update for ${esc(x.name || "Buyer")}</h2><p class="muted" style="margin:0 0 12px;font-size:13.5px;word-break:break-all">${esc(x.email || "")}</p>
   <p class="msg" style="margin:0 0 12px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--fg) 5%,transparent);white-space:pre-wrap;font-size:14px;max-height:120px;overflow:auto">${esc(x.message || "")}</p>
   <textarea id="tkrep" maxlength="2000" style="min-height:120px" placeholder="Your reply. For example: JazakAllah khair! We've added 3 new duas for students in the Exams topic.">${esc(x.reply || "")}</textarea>
   <div class="stopts">${["working", "added", "resolved", "open"].map(k => `<button data-st="${k}" class="${st === k ? "on" : ""}">${TK_ST_ADMIN[k]}</button>`).join("")}</div>
   <label style="display:block;font-weight:800;font-size:13px;margin-bottom:6px">Link a topic (optional)</label>
   <select id="tktopic"><option value="">No topic</option>${opts}</select>
   <label class="row" style="gap:10px;margin:14px 0;font-weight:700"><input type="checkbox" id="tkmail" style="width:18px;height:18px"> Also email this reply from my Gmail</label>
   <button class="primary" id="tksave">Save &amp; notify buyer</button>`, L => {
    L.querySelectorAll("[data-st]").forEach(b => b.onclick = () => { st = b.dataset.st; L.querySelectorAll("[data-st]").forEach(y => y.classList.toggle("on", y === b)); });
    L.querySelector("#tksave").onclick = async () => { const v = L.querySelector("#tkrep").value.trim(), topic = L.querySelector("#tktopic").value;
      if (!v && st !== "added") { L.querySelector("#tkrep").focus(); return toast("Write a reply first"); }
      try { await db.collection("tickets").doc(id).update({ reply: v.slice(0, 2000), status: st, topic: topic || "", seen: false, updated: firebase.firestore.FieldValue.serverTimestamp() });
        const mail = L.querySelector("#tkmail").checked; close(); toast("Saved. The buyer will see it in their app."); loadTickets();
        if (mail && x.email) { const body = `Assalamu alaikum ${x.name || ""},\n\n${v}${topic && CAT[topic] ? `\n\nYou can find it in Munajat under “${CAT[topic].name}”.` : ""}\n\nYour message: "${(x.message || "").slice(0, 500)}"\n\nJazakAllahu khayran,\nMunajat`; location.href = `mailto:${encodeURIComponent(x.email)}?subject=${encodeURIComponent("Munajat: an update on your message")}&body=${encodeURIComponent(body)}`; }
      } catch (_) { toast("Couldn't save. Try again."); } }; }); }

const _render2 = render; render = function(){ _render2();
  if (view.name === "page" && view.p === "help" && USER) {
    document.querySelectorAll("[data-fbtype]").forEach(b => b.onclick = () => { TK.type = b.dataset.fbtype; document.querySelectorAll("[data-fbtype]").forEach(x => x.classList.toggle("on", x === b)); });
    const send = document.getElementById("fbsend"), info = document.getElementById("fbinfo");
    if (send) send.onclick = async () => { const m = (document.getElementById("fbmsg").value || "").trim();
      if (m.length < 3) { info.style.color = "var(--danger)"; info.textContent = "Please write your message first."; return; }
      if (Date.now() - TK.last < 60000) { info.style.color = "var(--danger)"; info.textContent = "Please wait a minute before sending another message."; return; }
      send.disabled = true; info.style.color = ""; info.textContent = "Sending…";
      try { await db.collection("tickets").add({ uid: USER.uid, email: lc(USER.email), name: tkName(), type: TK.type, message: m.slice(0, 2000), status: "open", reply: "", seen: true, created: firebase.firestore.FieldValue.serverTimestamp(), app: "web-" + CONTENT_VERSION });
        TK.last = Date.now(); document.getElementById("fbmsg").value = ""; info.style.color = "var(--teal)"; info.textContent = "Sent. JazakAllahu khayran! You'll get a notification here when we reply."; loadMyTickets();
      } catch (e) { console.warn("Ticket send failed", e); info.style.color = "var(--danger)"; info.textContent = e && e.code === "permission-denied" ? "Couldn't send: the app isn't allowed to save messages yet. Please tell the Munajat team (error: permission)." : (navigator.onLine === false || (e && e.code === "unavailable")) ? "You seem to be offline. Check your internet and try again." : "Couldn't send right now (" + ((e && e.code) || "error") + "). Please try again."; }
      send.disabled = false; };
    if (view.scrollMine === undefined && TK.unseen.length) view.scrollMine = true;
    loadMyTickets();
  }
  if (view.name === "tickets") { loadTickets(); const c = document.getElementById("tkcopy"); if (c) c.onclick = async () => {
      if (!TK_ALL.length) await loadTickets();
      const ideas = TK_ALL.map(d => d.data()).filter(x => (x.type === "idea" || x.type === "dua") && (x.status || "open") !== "added" && x.status !== "resolved");
      if (!ideas.length) return toast("No open ideas right now");
      const txt = "Munajat buyer requests to review:\n\n" + ideas.map((x, i) => `${i + 1}. [${TK_TYPES[x.type]}] ${x.message}`).join("\n\n");
      try { await navigator.clipboard.writeText(txt); toast(`Copied ${ideas.length} idea${ideas.length > 1 ? "s" : ""}. Paste them to Claude to add content.`); } catch (_) { sheet(`<h2 style="font-size:20px;margin-bottom:10px">Copy these</h2><textarea style="min-height:240px">${esc(txt)}</textarea>`); } }; }
  if (view.name === "account") loadTicketBadge();
  paintNotes();
};
document.addEventListener("click", async e => {
  const f = e.target.closest("[data-tkfilter]"); if (f) { TK.filter = f.dataset.tkfilter; return render(); }
  const r = e.target.closest("[data-tkreply]"); if (r) return tkSheet(r.dataset.tkreply);
  const d = e.target.closest("[data-tkdel]"); if (d) { confirmSheet("Delete this ticket? This can't be undone.", "Delete", async () => { try { await db.collection("tickets").doc(d.dataset.tkdel).delete(); toast("Deleted"); loadTickets(); } catch (_) { toast("Couldn't delete. Try again."); } }); return; }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && USER) checkNotes(); });
setInterval(() => { if (!document.hidden && USER) checkNotes(); }, 120000);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
