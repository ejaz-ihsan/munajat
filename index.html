<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b1714">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,600&family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:ital,wght@0,500;0,700;1,500&family=Shantell+Sans:wght@400;500;600&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Munajat">
<title>Munajat</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: "lantern & oasis" — single column, ring-progress hero, vertical topic tiles, floating pill tab bar; max 480px */
:root{
  --bg:#0b1714; --surface:#12221e; --surface2:#1a2e29; --line:rgba(227,183,104,.12);
  --fg:#eef2ea; --muted:#9fb3aa; --faint:#5f7a71; --accent:#e3b768; --accent-ink:#1a1408;
  --teal:#4fb39a; --danger:#ef6a5b; --tabbar:rgba(18,34,30,.92);
  --display:"Fraunces",Georgia,serif; --ui:"Manrope",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eaf0ed; --surface:#ffffff; --surface2:#dde7e2; --line:rgba(20,60,50,.12);
  --fg:#10231e; --muted:#4d6660; --faint:#8aa29a; --accent:#a8741c; --accent-ink:#ffffff;
  --teal:#1f7f68; --danger:#c8392b; --tabbar:rgba(255,255,255,.94); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eaf0ed; --surface:#ffffff; --surface2:#dde7e2; --line:rgba(20,60,50,.12);
  --fg:#10231e; --muted:#4d6660; --faint:#8aa29a; --accent:#a8741c; --accent-ink:#ffffff;
  --teal:#1f7f68; --danger:#c8392b; --tabbar:rgba(255,255,255,.94); color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-block:14px 130px;min-height:100%}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
.big{font-size:34px}
.sec{font-size:26px}
.stack{display:flex;flex-direction:column;gap:14px}
.pill{border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--accent)}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--accent);border:1px solid var(--line)}
.iconbtn svg{width:22px;height:22px}

.avatar{width:54px;height:54px;border-radius:16px;background:var(--surface2);display:grid;place-items:center;flex:none;
  font:600 24px var(--display);color:var(--accent);border:1px solid var(--line);transform:rotate(45deg)}
.avatar > *{transform:rotate(-45deg)}
.greet small{display:block;font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.greet b{font-size:26px;font-weight:600;font-family:var(--display)}

.hero{border-radius:18px;padding:22px;color:#fff;background:var(--hero);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:28px solid rgba(255,255,255,.06)}
.hero-top{display:flex;gap:18px;align-items:center;position:relative;z-index:1}
.ring{--p:0;width:92px;height:92px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(#f3d08f calc(var(--p)*1%),rgba(255,255,255,.16) 0)}
.ring span{width:74px;height:74px;border-radius:50%;background:rgba(0,0,0,.35);display:grid;place-items:center;font-weight:800;font-size:20px}
.hero h2{font-size:20px;line-height:1.35;color:#fff}
.hero .ref{opacity:.75;font-weight:600;margin-top:8px;font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:800;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.hero .eyebrow{color:rgba(255,255,255,.7)}
.bar{height:6px;border-radius:3px;background:rgba(0,0,0,.25);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:currentColor;transition:width .4s}
.cta{position:relative;z-index:1;width:100%;margin-top:20px;padding:15px;border-radius:12px;background:#f3d08f;color:#2a1d05;font-weight:800;font-size:16px}

.goal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.tile{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none}
.tile .dot{width:30px;height:30px;display:grid;place-items:center;background:none!important}
.tile svg{width:24px;height:24px}
.goal .info{flex:1;min-width:0}
.goal h3{margin:0 0 6px;font-size:17px;font-weight:800}
.goal .meta{display:flex;justify-content:space-between;font-weight:600;font-size:14px;color:var(--muted);margin-bottom:8px}

.seg{display:flex;gap:22px;border-bottom:1px solid var(--line)}
.seg button{padding:10px 0;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center;border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button svg{width:17px;height:17px}
.seg button.on{color:var(--accent);border-color:var(--accent)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 14px}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:600 16px var(--ui);padding:11px 0;outline:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.cat .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.cat .ic svg{width:22px;height:22px}
.cat span{font-weight:700;font-size:13px;line-height:1.25}
.cat .chev{display:none}
.find{width:100%;padding:15px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;display:flex;gap:10px;align-items:center;justify-content:center}
.find svg{width:20px;height:20px}
textarea{width:100%;min-height:130px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--fg);font:500 16px/1.5 var(--ui);padding:14px;resize:vertical}

.intent{border-left:3px solid var(--c);background:var(--surface);border-radius:4px 14px 14px 4px;padding:12px 14px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.intent .tile{width:44px;height:44px}
.duacard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px 26px;position:relative}
.duacard::before{content:"";display:block;width:40px;height:2px;background:var(--accent);margin:0 auto 18px}
.duacard .bm{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.duacard .bm svg{width:20px;height:20px}
.duacard .bm.on svg{fill:var(--accent);color:var(--accent)}
.duatitle{font-weight:800;font-size:14px;color:var(--muted);text-align:center;padding:0 40px;margin-bottom:14px}
.ar{direction:rtl;text-align:center;line-height:2.1;margin:8px 0 20px}
.tl{font-style:italic;color:var(--muted);line-height:1.6;margin:0 0 14px}
.en{line-height:1.6;margin:0 0 14px}
.story{background:color-mix(in srgb,var(--accent) 9%,var(--surface2));border-radius:12px;padding:14px 16px;margin:0 0 18px;line-height:1.65;font-size:15px}
.story p{margin:0}
.story p+p{margin-top:10px;color:var(--muted)}
.story .label{color:var(--accent);display:flex;align-items:center;gap:6px}
.story .label svg{width:14px;height:14px}
.step{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;margin:24px 0 12px}
.step.first{margin-top:0}
.step span{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;flex:none}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.nm{background:var(--surface2);border-radius:12px;padding:12px 10px;text-align:center;min-width:0}
.nar{direction:rtl;line-height:1.7;color:var(--accent)}
.ntl{font-weight:800;font-size:14px;margin-top:2px}
.nen{font-size:13px;color:var(--muted);line-height:1.4;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--accent)}
.words{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.words .label{display:flex;align-items:center;gap:6px;color:var(--accent)}
.words .label svg{width:14px;height:14px}
.wrow{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line)}
.wrow:last-child{border-bottom:0}
.winfo{flex:1;min-width:0}
.war{direction:rtl;color:var(--accent);line-height:1.5;flex:none;max-width:48%;text-align:right}
.wtl{font-weight:800;font-size:15px}
.wen{font-size:15px;line-height:1.45;margin-top:2px}
.wroot{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;font-weight:700;color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,transparent);border-radius:6px;padding:2px 8px}
.wroot span{font-family:'Amiri',serif;font-size:16px;line-height:1.2}
.wnote{font-size:13px;color:var(--muted);line-height:1.5;margin-top:6px}
.wfrom{font-size:12px;color:var(--faint);margin-top:4px;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font:600 30px var(--display);color:var(--accent)}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.flash{width:100%;min-height:340px;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.flash .war{max-width:100%;text-align:center}
.chk{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.chk.on{border-color:color-mix(in srgb,var(--teal) 55%,transparent)}
.box{width:30px;height:30px;border-radius:8px;border:2px solid var(--faint);display:grid;place-items:center;flex:none;margin-top:1px;color:#fff}
.chk.on .box{background:var(--teal);border-color:var(--teal)}
.box svg{width:18px;height:18px}
.cbody{flex:1;min-width:0}
.ctitle{font-weight:800;font-size:16px;line-height:1.35}
.ctitle .alt{display:block;font-weight:600;font-size:14px;color:var(--muted);margin-top:3px}
.cdet{font-size:14px;line-height:1.55;color:var(--muted);margin:6px 0 8px}
.cdet .alt{display:block;margin-top:4px}
a.src{text-decoration:none;display:inline-flex;align-items:center;gap:4px}
a.src svg{width:13px;height:13px}
.label{font-size:11px;letter-spacing:.16em;font-weight:800;color:var(--faint);text-transform:uppercase;margin-bottom:6px}
.src{font-size:13px;font-weight:700;color:var(--teal)}
.readerbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(transparent,var(--bg) 30%);
  padding:30px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.readerbar .inner{max-width:480px;margin:0 auto;display:flex;gap:10px;align-items:center}
.round{width:56px;height:56px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);flex:none}
.round:disabled{color:var(--faint);opacity:.5}
.done{flex:1;height:56px;border-radius:14px;font-weight:800;font-size:17px;background:var(--accent);color:var(--accent-ink)}
.done.ok{background:var(--teal);color:#fff}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar .inner{pointer-events:auto;max-width:448px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  background:var(--tabbar);border:1px solid var(--line);border-radius:20px;padding:6px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:11px;color:var(--faint);padding:8px 4px;border-radius:14px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent);background:var(--surface2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.item{display:flex;align-items:center;gap:14px;padding:15px 16px;width:100%;text-align:left;min-height:58px}
.item + .item, .item + div, div + .item{border-top:1px solid var(--line)}
.item > svg:first-child{width:22px;height:22px;color:var(--teal);flex:none}
.item .t{flex:1;min-width:0;font-weight:600;font-size:16px}
.item .t small{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:3px;line-height:1.4}
.item .v{color:var(--muted);font-weight:600;font-size:14px}
.item .chev{width:18px;height:18px;color:var(--faint);flex:none}
.item.danger .t,.item.danger > svg:first-child{color:var(--danger)}
.switch{width:50px;height:30px;border-radius:8px;background:var(--surface2);position:relative;flex:none;transition:background .2s;border:1px solid var(--line)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:6px;background:var(--faint);transition:transform .2s,background .2s}
.switch.on{background:color-mix(in srgb,var(--teal) 30%,var(--surface2))}
.switch.on::after{transform:translateX(20px);background:var(--teal)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=time]{background:var(--surface2);border:0;border-radius:8px;color:var(--fg);font:600 15px var(--ui);padding:6px 8px}
.sub{padding:12px 16px}
.dim{opacity:.45;pointer-events:none}
.note{font-size:13px;color:var(--muted);line-height:1.45;padding:0 16px 14px;margin:0}

.scrim{position:fixed;inset:0;background:rgba(3,10,8,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;max-height:85%;overflow:auto;border-top:2px solid var(--accent);
  padding:18px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.grab{display:none}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;border-radius:12px;background:var(--surface2);font-weight:700;margin-bottom:8px;text-align:left}
.opt.on{box-shadow:inset 0 0 0 2px var(--accent)}
.opt svg{width:20px;height:20px;color:var(--accent)}
.field{width:100%;background:var(--surface2);border:0;border-radius:12px;padding:14px 16px;color:var(--fg);font:600 17px var(--ui)}
.primary{width:100%;padding:15px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px}
.ghost{width:100%;padding:15px;border-radius:12px;border:1px solid var(--line);font-weight:800;font-size:15px}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw{aspect-ratio:1;max-width:100%;border-radius:14px;font-weight:800;font-size:12px;color:#fff;display:flex;align-items:flex-end;justify-content:center;padding:8px}
.sw.on{box-shadow:0 0 0 3px var(--accent)}
.prose{line-height:1.6;color:var(--muted)}
.prose h3{color:var(--fg);margin:18px 0 4px;font-size:17px}
.list .goal{align-items:flex-start}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:700;z-index:60;font-size:14px}
.heart{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 14%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:18px;padding:18px 18px 16px;scroll-margin-top:16px}
.heart.crisis{background:color-mix(in srgb,var(--danger) 10%,var(--surface));border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.heart.crisis p{margin:0 0 12px;line-height:1.6}
.heart .verse{font-family:'Fraunces',serif;font-size:16px;line-height:1.5;padding:12px 14px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:0 10px 10px 0}
.heart .verse small{display:block;margin-top:6px;font-family:'Manrope',sans-serif;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.callbtn{display:flex;gap:10px;align-items:center;justify-content:center;width:100%;padding:14px;border-radius:12px;background:var(--danger);color:#fff;font-weight:800;font-size:16px;text-decoration:none}
.callbtn svg{width:20px;height:20px}
.heartdua{border-top:1px solid var(--line)}.heartdua:first-child{border-top:0}
.tbadge{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--danger);color:#fff;font-size:12.5px;font-weight:800;display:none;place-items:center}
.tbadge.on{display:grid}
.fb{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-top:4px}
.fbtypes{display:flex;flex-wrap:wrap;gap:8px}
.fbtypes button{border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-weight:700;font-size:13.5px;color:var(--muted)}
.fbtypes button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.tk .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:700}
.tk .tag{border-radius:8px;padding:2px 8px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-weight:800}
.tk .st{border-radius:8px;padding:2px 8px;font-weight:800}
.tk .st.open{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.tk .st.resolved,.tk .st.added{background:color-mix(in srgb,#2d8a6a 16%,transparent);color:#2d8a6a}
.tk .st.working{background:color-mix(in srgb,#3b82f6 15%,transparent);color:#3b82f6}
.tk .new{border-radius:8px;padding:2px 8px;background:var(--danger);color:#fff;font-weight:800}
.tk.unseen{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.tk .who{display:flex;gap:10px;align-items:center}
.tk .who .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 20%,var(--surface));color:var(--accent);font-weight:800;flex:none}
.tk .who a{color:var(--muted);font-size:13px;font-weight:600;word-break:break-all;text-decoration:none}
.tab{position:relative}
.tabdot{position:absolute;top:6px;right:calc(50% - 20px);width:10px;height:10px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}
.notecard{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;border-radius:16px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line))}
.notecard svg{color:var(--accent);flex:none;margin-top:2px}
.sheet select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-weight:600}
.stopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stopts button{border:1px solid var(--line);border-radius:10px;padding:10px 6px;font-weight:800;font-size:13.5px;color:var(--muted)}
.stopts button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tk .msg{white-space:pre-wrap;line-height:1.55;margin:0;word-break:break-word}
.tk .rep{white-space:pre-wrap;line-height:1.55;margin:0;padding:10px 12px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:0 10px 10px 0;font-size:14.5px}
.tk .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.tk .acts .pill{padding:6px 12px;font-size:13px;text-decoration:none}
.segs{display:flex;gap:8px}
.segs button{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 6px;font-weight:800;font-size:13.5px;color:var(--muted)}
.segs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.empty{padding:28px 20px;text-align:center;color:var(--muted);line-height:1.5}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<script>
/* ---------- Content ---------- */
let DUAS = [
 {"id": "istighfar", "t": "Sayyid al-Istighfar", "cats": ["daily", "forgiveness"], "ref": "Sahih al-Bukhari 6306", "ar": "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ ۝ خَلَقْتَنِي وَأَنَا عَبْدُكَ ۝ وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ ۝ أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ ۝ أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ ۝ وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي ۝ فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", "tl": "Allahumma anta Rabbi, la ilaha illa ant. Khalaqtani wa ana ‘abduk, wa ana ‘ala ‘ahdika wa wa‘dika mastata‘t. A‘udhu bika min sharri ma sana‘t. Abu’u laka bi ni‘matika ‘alayya, wa abu’u laka bi dhanbi faghfir li, fa innahu la yaghfirudh-dhunuba illa ant.", "en": "O Allah, You are my Lord, there is no god but You. You created me and I am Your servant. I keep Your covenant and promise as best I can. I seek refuge in You from the evil of what I have done. I acknowledge Your blessings upon me and I acknowledge my sin, so forgive me, for none forgives sins except You."},
 {"id": "atina", "t": "Good in this world and the next", "cats": ["daily", "jannah", "contentment", "marriage"], "ref": "Surah Al-Baqarah 2:201", "ar": "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ", "tl": "Rabbana atina fid-dunya hasanatan wa fil-akhirati hasanatan wa qina ‘adhaban-nar.", "en": "Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire."},
 {"id": "zidni", "t": "Increase me in knowledge", "cats": ["knowledge", "exams"], "ref": "Surah Ta-Ha 20:114", "ar": "رَبِّ زِدْنِي عِلْمًا", "tl": "Rabbi zidni ‘ilma.", "en": "My Lord, increase me in knowledge."},
 {"id": "sadri", "t": "Ease my task", "cats": ["exams", "career", "courage", "knowledge"], "ref": "Surah Ta-Ha 20:25–28", "ar": "رَبِّ اشْرَحْ لِي صَدْرِي ۝ وَيَسِّرْ لِي أَمْرِي ۝ وَاحْلُلْ عُقْدَةً مِّن لِّسَانِي ۝ يَفْقَهُوا قَوْلِي", "tl": "Rabbish-rah li sadri, wa yassir li amri, wahlul ‘uqdatan min lisani, yafqahu qawli.", "en": "My Lord, expand my chest for me, ease my task for me, and untie the knot from my tongue so they may understand my speech."},
 {"id": "sahl", "t": "Make the difficult easy", "cats": ["exams", "career", "anxiety"], "ref": "Sahih Ibn Hibban 974", "ar": "اللَّهُمَّ لَا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا ۝ وَأَنْتَ تَجْعَلُ الْحَزْنَ إِذَا شِئْتَ سَهْلًا", "tl": "Allahumma la sahla illa ma ja‘altahu sahla, wa anta taj‘alul-hazna idha shi’ta sahla.", "en": "O Allah, nothing is easy except what You make easy, and You make the difficult easy when You will."},
 {"id": "nafi", "t": "Beneficial knowledge and pure provision", "cats": ["daily", "rizq", "knowledge", "career"], "ref": "Sunan Ibn Majah 925", "ar": "اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا ۝ وَرِزْقًا طَيِّبًا ۝ وَعَمَلًا مُتَقَبَّلًا", "tl": "Allahumma inni as’aluka ‘ilman nafi‘a, wa rizqan tayyiba, wa ‘amalan mutaqabbala.", "en": "O Allah, I ask You for beneficial knowledge, good and pure provision, and deeds that are accepted."},
 {"id": "faqir", "t": "In need of any good You send", "cats": ["rizq", "career", "marriage", "debt"], "ref": "Surah Al-Qasas 28:24", "ar": "رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ", "tl": "Rabbi inni lima anzalta ilayya min khayrin faqir.", "en": "My Lord, I am truly in need of whatever good You send down to me."},
 {"id": "ikfini", "t": "Suffice me with the halal", "cats": ["debt", "rizq", "contentment", "jealousy"], "ref": "Jami‘ at-Tirmidhi 3563", "ar": "اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ ۝ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ", "tl": "Allahummakfini bi halalika ‘an haramik, wa aghnini bi fadlika ‘amman siwak.", "en": "O Allah, suffice me with what You have made lawful instead of what You have forbidden, and by Your grace make me independent of all besides You."},
 {"id": "hamm", "t": "Refuge from worry and grief", "cats": ["daily", "anxiety", "debt", "discipline", "grief", "exams"], "ref": "Sahih al-Bukhari 6369", "ar": "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ ۝ وَالْعَجْزِ وَالْكَسَلِ ۝ وَالْبُخْلِ وَالْجُبْنِ ۝ وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ", "tl": "Allahumma inni a‘udhu bika minal-hammi wal-hazan, wal-‘ajzi wal-kasal, wal-bukhli wal-jubn, wa dala‘id-dayni wa ghalabatir-rijal.", "en": "O Allah, I seek refuge in You from worry and grief, from helplessness and laziness, from miserliness and cowardice, and from the burden of debt and being overpowered by others."},
 {"id": "yunus", "t": "The dua of Yunus", "cats": ["anxiety", "forgiveness", "grief"], "ref": "Surah Al-Anbiya 21:87", "ar": "لَا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ", "tl": "La ilaha illa anta subhanaka inni kuntu minaz-zalimin.", "en": "There is no god but You, glory be to You. Indeed, I have been among the wrongdoers."},
 {"id": "hasbuna", "t": "Allah is sufficient for us", "cats": ["daily", "trust", "anxiety", "courage"], "ref": "Surah Aal-Imran 3:173", "ar": "حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ", "tl": "Hasbunallahu wa ni‘mal-wakil.", "en": "Allah is sufficient for us, and He is the best Disposer of affairs."},
 {"id": "bismillah", "t": "Morning and evening protection", "cats": ["daily", "protection", "evil"], "ref": "Sunan Abi Dawud 5088 · Tirmidhi 3388", "ar": "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ ۝ وَهُوَ السَّمِيعُ الْعَلِيمُ", "tl": "Bismillahil-ladhi la yadurru ma‘a ismihi shay’un fil-ardi wa la fis-sama’, wa huwas-Sami‘ul-‘Alim.", "en": "In the name of Allah, with whose name nothing on earth or in the heavens can cause harm, and He is the All-Hearing, the All-Knowing. (Say three times.)"},
 {"id": "kalimat", "t": "Perfect words of Allah", "cats": ["protection", "evil", "travel", "home"], "ref": "Sahih Muslim 2708", "ar": "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ", "tl": "A‘udhu bi kalimatillahit-tammati min sharri ma khalaq.", "en": "I seek refuge in the perfect words of Allah from the evil of what He has created."},
 {"id": "safar", "t": "Dua for travel", "cats": ["travel"], "ref": "Surah Az-Zukhruf 43:13–14", "ar": "سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ ۝ وَإِنَّا إِلَىٰ رَبِّنَا لَمُنقَلِبُونَ", "tl": "Subhanal-ladhi sakhkhara lana hadha wa ma kunna lahu muqrinin, wa inna ila Rabbina lamunqalibun.", "en": "Glory be to the One who has placed this at our service, for we could never have done it ourselves, and to our Lord we will surely return."},
 {"id": "shifa", "t": "Dua for healing", "cats": ["healing"], "ref": "Sahih al-Bukhari 5743", "ar": "اللَّهُمَّ رَبَّ النَّاسِ أَذْهِبِ الْبَأْسَ ۝ اشْفِ أَنْتَ الشَّافِي ۝ لَا شِفَاءَ إِلَّا شِفَاؤُكَ ۝ شِفَاءً لَا يُغَادِرُ سَقَمًا", "tl": "Allahumma Rabban-nas, adhhibil-ba’s, ishfi antash-Shafi, la shifa’a illa shifa’uk, shifa’an la yughadiru saqama.", "en": "O Allah, Lord of mankind, remove the harm and heal, for You are the Healer. There is no healing but Your healing, a healing that leaves no illness behind."},
 {"id": "walidayn", "t": "Mercy for my parents", "cats": ["parents"], "ref": "Surah Al-Isra 17:24", "ar": "رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا", "tl": "Rabbir-hamhuma kama rabbayani saghira.", "en": "My Lord, have mercy on them both as they raised me when I was small."},
 {"id": "qurra", "t": "Comfort of our eyes", "cats": ["marriage", "children", "home", "baby"], "ref": "Surah Al-Furqan 25:74", "ar": "رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا", "tl": "Rabbana hab lana min azwajina wa dhurriyyatina qurrata a‘yunin waj‘alna lil-muttaqina imama.", "en": "Our Lord, grant us from our spouses and children the comfort of our eyes, and make us leaders of the righteous."},
 {"id": "dhurriyya", "t": "Righteous offspring", "cats": ["baby", "children"], "ref": "Surah Aal-Imran 3:38", "ar": "رَبِّ هَبْ لِي مِن لَّدُنكَ ذُرِّيَّةً طَيِّبَةً ۖ إِنَّكَ سَمِيعُ الدُّعَاءِ", "tl": "Rabbi hab li min ladunka dhurriyyatan tayyibah, innaka Sami‘ud-du‘a’.", "en": "My Lord, grant me from Yourself good offspring. Indeed, You hear every prayer."},
 {"id": "zalamna", "t": "The dua of Adam", "cats": ["forgiveness"], "ref": "Surah Al-A‘raf 7:23", "ar": "رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ", "tl": "Rabbana zalamna anfusana wa in lam taghfir lana wa tarhamna lanakunanna minal-khasirin.", "en": "Our Lord, we have wronged ourselves. If You do not forgive us and have mercy on us, we will surely be among the losers."},
 {"id": "muqallib", "t": "Keep my heart firm", "cats": ["daily", "faith", "guidance"], "ref": "Jami‘ at-Tirmidhi 2140", "ar": "يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ", "tl": "Ya Muqallibal-qulub, thabbit qalbi ‘ala dinik.", "en": "O Turner of hearts, keep my heart firm upon Your religion."},
 {"id": "tuzigh", "t": "Do not let our hearts deviate", "cats": ["faith", "guidance"], "ref": "Surah Aal-Imran 3:8", "ar": "رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ الْوَهَّابُ", "tl": "Rabbana la tuzigh qulubana ba‘da idh hadaytana wa hab lana min ladunka rahmah, innaka antal-Wahhab.", "en": "Our Lord, do not let our hearts deviate after You have guided us, and grant us mercy from Yourself. You are the Bestower."},
 {"id": "ainni", "t": "Help me remember and thank You", "cats": ["daily", "gratitude", "closer", "prayers"], "ref": "Sunan Abi Dawud 1522", "ar": "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ", "tl": "Allahumma a‘inni ‘ala dhikrika wa shukrika wa husni ‘ibadatik.", "en": "O Allah, help me to remember You, to thank You, and to worship You in the best way."},
 {"id": "awzini", "t": "Inspire me to be grateful", "cats": ["gratitude", "parents", "kindness"], "ref": "Surah An-Naml 27:19", "ar": "رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ", "tl": "Rabbi awzi‘ni an ashkura ni‘matakal-lati an‘amta ‘alayya wa ‘ala walidayya wa an a‘mala salihan tardah.", "en": "My Lord, inspire me to be grateful for the favour You have given me and my parents, and to do righteous deeds that please You."},
 {"id": "janna", "t": "Asking for Jannah", "cats": ["daily", "jannah"], "ref": "Sunan Abi Dawud 792", "ar": "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَأَعُوذُ بِكَ مِنَ النَّارِ", "tl": "Allahumma inni as’alukal-jannata wa a‘udhu bika minan-nar.", "en": "O Allah, I ask You for Paradise and I seek refuge in You from the Fire."},
 {"id": "huda", "t": "Guidance, piety, chastity, sufficiency", "cats": ["daily", "guidance", "contentment", "closer", "marriage"], "ref": "Sahih Muslim 2721", "ar": "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى", "tl": "Allahumma inni as’alukal-huda wat-tuqa wal-‘afafa wal-ghina.", "en": "O Allah, I ask You for guidance, piety, chastity and self-sufficiency."},
 {"id": "akhlaq", "t": "Guide me to the best character", "cats": ["kindness", "anger", "jealousy"], "ref": "Sahih Muslim 771", "ar": "اللَّهُمَّ اهْدِنِي لِأَحْسَنِ الْأَخْلَاقِ لَا يَهْدِي لِأَحْسَنِهَا إِلَّا أَنْتَ", "tl": "Allahummah-dini li ahsanil-akhlaq, la yahdi li ahsaniha illa ant.", "en": "O Allah, guide me to the best of character; none guides to the best of it except You."},
 {"id": "ghill", "t": "Remove resentment from our hearts", "cats": ["jealousy", "kindness"], "ref": "Surah Al-Hashr 59:10", "ar": "رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالْإِيمَانِ وَلَا تَجْعَلْ فِي قُلُوبِنَا غِلًّا لِّلَّذِينَ آمَنُوا رَبَّنَا إِنَّكَ رَءُوفٌ رَّحِيمٌ", "tl": "Rabbanagh-fir lana wa li ikhwaninal-ladhina sabaquna bil-iman, wa la taj‘al fi qulubina ghillan lil-ladhina amanu, Rabbana innaka Ra’ufur-Rahim.", "en": "Our Lord, forgive us and our brothers who preceded us in faith, and put no resentment in our hearts toward those who believe. Our Lord, You are Kind and Merciful."},
 {"id": "taawwudh", "t": "When angry", "cats": ["anger", "evil"], "ref": "Sahih al-Bukhari 3282", "ar": "أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ", "tl": "A‘udhu billahi minash-shaytanir-rajim.", "en": "I seek refuge in Allah from Satan, the accursed."},
 {"id": "sabr", "t": "Pour patience upon us", "cats": ["courage", "discipline"], "ref": "Surah Al-Baqarah 2:250", "ar": "رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ", "tl": "Rabbana afrigh ‘alayna sabran wa thabbit aqdamana wansurna ‘alal-qawmil-kafirin.", "en": "Our Lord, pour patience upon us, make our feet firm, and help us against the disbelieving people."},
 {"id": "musiba", "t": "In times of loss", "cats": ["grief"], "ref": "Sahih Muslim 918", "ar": "إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ ۝ اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي وَأَخْلِفْ لِي خَيْرًا مِنْهَا", "tl": "Inna lillahi wa inna ilayhi raji‘un. Allahumma’jurni fi musibati wa akhlif li khayran minha.", "en": "To Allah we belong and to Him we return. O Allah, reward me in my affliction and replace it for me with something better."},
 {"id": "nawm", "t": "Before sleeping", "cats": ["sleep"], "ref": "Sahih al-Bukhari 6324", "ar": "بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا", "tl": "Bismika Allahumma amutu wa ahya.", "en": "In Your name, O Allah, I die and I live."},
 {"id": "manzil", "t": "A blessed place to settle", "cats": ["home"], "ref": "Surah Al-Mu’minun 23:29", "ar": "رَّبِّ أَنزِلْنِي مُنزَلًا مُّبَارَكًا وَأَنتَ خَيْرُ الْمُنزِلِينَ", "tl": "Rabbi anzilni munzalan mubarakan wa anta khayrul-munzilin.", "en": "My Lord, let me settle in a blessed place, for You are the best to accommodate."},
 {"id": "salah", "t": "Make me steadfast in prayer", "cats": ["prayers", "children", "discipline"], "ref": "Surah Ibrahim 14:40", "ar": "رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِن ذُرِّيَّتِي ۚ رَبَّنَا وَتَقَبَّلْ دُعَاءِ", "tl": "Rabbij-‘alni muqimas-salati wa min dhurriyyati, Rabbana wa taqabbal du‘a’.", "en": "My Lord, make me one who establishes prayer, and my descendants too. Our Lord, accept my prayer."},
 {"id": "tawakkaltu", "t": "Leaving the house", "cats": ["trust", "protection", "travel", "evil"], "ref": "Sunan Abi Dawud 5095", "ar": "بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ ۝ لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ", "tl": "Bismillah, tawakkaltu ‘alallah, la hawla wa la quwwata illa billah.", "en": "In the name of Allah, I place my trust in Allah. There is no might and no power except with Allah."},
 {"id": "tuakhidhna", "t": "Do not burden us beyond our strength", "cats": ["forgiveness", "anxiety", "courage"], "ref": "Surah Al-Baqarah 2:286", "ar": "رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ", "tl": "Rabbana la tu’akhidhna in nasina aw akhta’na. Rabbana wa la tahmil ‘alayna isran kama hamaltahu ‘alal-ladhina min qablina. Rabbana wa la tuhammilna ma la taqata lana bih. Wa‘fu ‘anna, waghfir lana, warhamna. Anta mawlana fansurna ‘alal-qawmil-kafirin.", "en": "Our Lord, do not take us to account if we forget or make a mistake. Our Lord, do not place on us a burden like the one You placed on those before us. Our Lord, do not burden us with more than we can bear. Pardon us, forgive us and have mercy on us. You are our Protector, so help us against the disbelieving people."},
 {"id": "hayy", "t": "O Ever-Living, by Your mercy", "cats": ["anxiety", "trust"], "ref": "Jami‘ at-Tirmidhi 3524", "ar": "يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ", "tl": "Ya Hayyu ya Qayyum, bi rahmatika astaghith.", "en": "O Ever-Living, O Sustainer of all, by Your mercy I call for help."},
 {"id": "karb", "t": "In times of great distress", "cats": ["anxiety", "grief"], "ref": "Sahih al-Bukhari 6346", "ar": "لَا إِلَهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ ۝ لَا إِلَهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ ۝ لَا إِلَهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ", "tl": "La ilaha illallahul-‘Azimul-Halim. La ilaha illallahu Rabbul-‘arshil-‘azim. La ilaha illallahu Rabbus-samawati wa Rabbul-ardi wa Rabbul-‘arshil-karim.", "en": "There is no god but Allah, the Mighty, the Forbearing. There is no god but Allah, Lord of the mighty Throne. There is no god but Allah, Lord of the heavens, Lord of the earth, and Lord of the noble Throne."},
 {"id": "rahmataka", "t": "Do not leave me to myself", "cats": ["anxiety", "grief", "closer", "trust"], "ref": "Sunan Abi Dawud 5090", "ar": "اللَّهُمَّ رَحْمَتَكَ أَرْجُو فَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ ۝ وَأَصْلِحْ لِي شَأْنِي كُلَّهُ ۝ لَا إِلَهَ إِلَّا أَنْتَ", "tl": "Allahumma rahmataka arju, fala takilni ila nafsi tarfata ‘ayn, wa aslih li sha’ni kullah, la ilaha illa ant.", "en": "O Allah, it is Your mercy I hope for, so do not leave me to myself even for the blink of an eye. Set all my affairs right. There is no god but You."},
 {"id": "hasbi", "t": "Allah is enough for me", "cats": ["trust", "anxiety", "courage"], "ref": "Surah At-Tawbah 9:129", "ar": "حَسْبِيَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ ۖ عَلَيْهِ تَوَكَّلْتُ ۖ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ", "tl": "Hasbiyallahu la ilaha illa huw, ‘alayhi tawakkaltu, wa huwa Rabbul-‘arshil-‘azim.", "en": "Allah is enough for me. There is no god but Him. In Him I put my trust, and He is Lord of the mighty Throne."},
 {"id": "ufawwid", "t": "I leave my affair to Allah", "cats": ["trust", "courage"], "ref": "Surah Ghafir 40:44", "ar": "وَأُفَوِّضُ أَمْرِي إِلَى اللَّهِ ۚ إِنَّ اللَّهَ بَصِيرٌ بِالْعِبَادِ", "tl": "Wa ufawwidu amri ilallah, innallaha basirun bil-‘ibad.", "en": "I entrust my affair to Allah. Indeed, Allah sees His servants."},
 {"id": "ayyub", "t": "The dua of Ayyub", "cats": ["healing", "grief"], "ref": "Surah Al-Anbiya 21:83", "ar": "أَنِّي مَسَّنِيَ الضُّرُّ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ", "tl": "Anni massaniyad-durru wa anta arhamur-rahimin.", "en": "Harm has touched me, and You are the Most Merciful of the merciful."},
 {"id": "asalullah", "t": "When visiting the sick", "cats": ["healing"], "ref": "Sunan Abi Dawud 3106 · Tirmidhi 2083", "ar": "أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَكَ", "tl": "As’alullahal-‘Azim, Rabbal-‘arshil-‘azim, an yashfiyak.", "en": "I ask Allah the Mighty, Lord of the mighty Throne, to heal you. (Say seven times.)"},
 {"id": "qudra", "t": "For pain in the body", "cats": ["healing"], "ref": "Sahih Muslim 2202", "ar": "بِسْمِ اللَّهِ ۝ أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ", "tl": "Bismillah (three times). A‘udhu billahi wa qudratihi min sharri ma ajidu wa uhadhir (seven times).", "en": "In the name of Allah (three times). I seek refuge in Allah and His power from the evil of what I feel and what I fear (seven times)."},
 {"id": "afini", "t": "Health in body, hearing and sight", "cats": ["healing", "daily"], "ref": "Sunan Abi Dawud 5090", "ar": "اللَّهُمَّ عَافِنِي فِي بَدَنِي ۝ اللَّهُمَّ عَافِنِي فِي سَمْعِي ۝ اللَّهُمَّ عَافِنِي فِي بَصَرِي ۝ لَا إِلَهَ إِلَّا أَنْتَ", "tl": "Allahumma ‘afini fi badani, Allahumma ‘afini fi sam‘i, Allahumma ‘afini fi basari, la ilaha illa ant.", "en": "O Allah, grant me well-being in my body. O Allah, grant me well-being in my hearing. O Allah, grant me well-being in my sight. There is no god but You. (Three times, morning and evening.)"},
 {"id": "afwafiya", "t": "Pardon and well-being", "cats": ["protection", "healing", "daily"], "ref": "Sunan Abi Dawud 5074 · Ibn Majah 3871", "ar": "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ", "tl": "Allahumma inni as’alukal-‘afwa wal-‘afiyata fid-dunya wal-akhirah.", "en": "O Allah, I ask You for pardon and well-being in this world and the Hereafter."},
 {"id": "afuww", "t": "You love to pardon", "cats": ["forgiveness", "closer"], "ref": "Jami‘ at-Tirmidhi 3513", "ar": "اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي", "tl": "Allahumma innaka ‘Afuwwun tuhibbul-‘afwa fa‘fu ‘anni.", "en": "O Allah, You are the One who pardons, and You love to pardon, so pardon me."},
 {"id": "tubalayya", "t": "Accept my repentance", "cats": ["forgiveness"], "ref": "Sunan Abi Dawud 1516", "ar": "رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ ۝ إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ", "tl": "Rabbighfir li wa tub ‘alayya, innaka antat-Tawwabur-Rahim.", "en": "My Lord, forgive me and accept my repentance. You are the One who accepts repentance, the Most Merciful."},
 {"id": "qini", "t": "Lying down to sleep", "cats": ["sleep"], "ref": "Sunan Abi Dawud 5045", "ar": "اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ", "tl": "Allahumma qini ‘adhabaka yawma tab‘athu ‘ibadak.", "en": "O Allah, protect me from Your punishment on the Day You raise up Your servants. (Three times.)"},
 {"id": "wadatu", "t": "In Your name I lie down", "cats": ["sleep", "protection"], "ref": "Sahih al-Bukhari 6320", "ar": "بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي وَبِكَ أَرْفَعُهُ ۝ إِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا ۝ وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ", "tl": "Bismika Rabbi wada‘tu janbi wa bika arfa‘uh. In amsakta nafsi farhamha, wa in arsaltaha fahfazha bima tahfazu bihi ‘ibadakas-salihin.", "en": "In Your name, my Lord, I lie down, and with Your help I rise. If You take my soul, have mercy on it. If You return it, protect it as You protect Your righteous servants."},
 {"id": "bara", "t": "Last words before sleep", "cats": ["sleep", "trust"], "ref": "Sahih al-Bukhari 247", "ar": "اللَّهُمَّ أَسْلَمْتُ نَفْسِي إِلَيْكَ ۝ وَوَجَّهْتُ وَجْهِي إِلَيْكَ ۝ وَفَوَّضْتُ أَمْرِي إِلَيْكَ ۝ وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ ۝ رَغْبَةً وَرَهْبَةً إِلَيْكَ ۝ لَا مَلْجَأَ وَلَا مَنْجَا مِنْكَ إِلَّا إِلَيْكَ ۝ آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ ۝ وَبِنَبِيِّكَ الَّذِي أَرْسَلْتَ", "tl": "Allahumma aslamtu nafsi ilayk, wa wajjahtu wajhi ilayk, wa fawwadtu amri ilayk, wa alja’tu zahri ilayk, raghbatan wa rahbatan ilayk. La malja’a wa la manja minka illa ilayk. Amantu bi kitabikal-ladhi anzalt, wa bi nabiyyikal-ladhi arsalt.", "en": "O Allah, I submit myself to You, turn my face to You, entrust my affairs to You and rest my back on You, in hope and in awe of You. There is no refuge and no escape from You except to You. I believe in Your Book which You revealed and Your Prophet whom You sent."},
 {"id": "ahyana", "t": "On waking up", "cats": ["sleep", "gratitude", "daily"], "ref": "Sahih al-Bukhari 6312", "ar": "الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ", "tl": "Alhamdu lillahil-ladhi ahyana ba‘da ma amatana wa ilayhin-nushur.", "en": "All praise is for Allah, who gave us life after causing us to die, and to Him is the return."},
 {"id": "ibrahim41", "t": "Forgive me and my parents", "cats": ["parents", "forgiveness"], "ref": "Surah Ibrahim 14:41", "ar": "رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ", "tl": "Rabbanagh-fir li wa li walidayya wa lil-mu’minina yawma yaqumul-hisab.", "en": "Our Lord, forgive me, my parents and the believers on the Day the reckoning takes place."},
 {"id": "nuh28", "t": "The dua of Nuh for family", "cats": ["parents", "home"], "ref": "Surah Nuh 71:28", "ar": "رَّبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَلِمَن دَخَلَ بَيْتِيَ مُؤْمِنًا وَلِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ", "tl": "Rabbigh-fir li wa li walidayya wa liman dakhala baytiya mu’minan wa lil-mu’minina wal-mu’minat.", "en": "My Lord, forgive me, my parents, whoever enters my home as a believer, and all believing men and women."},
 {"id": "ahqaf", "t": "At the age of forty", "cats": ["parents", "children", "gratitude"], "ref": "Surah Al-Ahqaf 46:15", "ar": "رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَصْلِحْ لِي فِي ذُرِّيَّتِي ۖ إِنِّي تُبْتُ إِلَيْكَ وَإِنِّي مِنَ الْمُسْلِمِينَ", "tl": "Rabbi awzi‘ni an ashkura ni‘matakal-lati an‘amta ‘alayya wa ‘ala walidayya wa an a‘mala salihan tardahu wa aslih li fi dhurriyyati, inni tubtu ilayka wa inni minal-muslimin.", "en": "My Lord, inspire me to thank You for the blessings You gave me and my parents, to do good that pleases You, and make my children righteous. I turn to You in repentance, and I am one of those who submit."},
 {"id": "fardan", "t": "Do not leave me alone", "cats": ["baby"], "ref": "Surah Al-Anbiya 21:89", "ar": "رَبِّ لَا تَذَرْنِي فَرْدًا وَأَنتَ خَيْرُ الْوَارِثِينَ", "tl": "Rabbi la tadharni fardan wa anta khayrul-warithin.", "en": "My Lord, do not leave me alone without an heir, and You are the best of inheritors."},
 {"id": "salihin", "t": "Grant me a righteous child", "cats": ["baby", "children"], "ref": "Surah As-Saffat 37:100", "ar": "رَبِّ هَبْ لِي مِنَ الصَّالِحِينَ", "tl": "Rabbi hab li minas-salihin.", "en": "My Lord, grant me a child from among the righteous."},
 {"id": "imran", "t": "The dua of a mother-to-be", "cats": ["baby"], "ref": "Surah Aal-Imran 3:35", "ar": "رَبِّ إِنِّي نَذَرْتُ لَكَ مَا فِي بَطْنِي مُحَرَّرًا فَتَقَبَّلْ مِنِّي ۖ إِنَّكَ أَنتَ السَّمِيعُ الْعَلِيمُ", "tl": "Rabbi inni nadhartu laka ma fi batni muharraran fataqabbal minni, innaka antas-Sami‘ul-‘Alim.", "en": "My Lord, I have dedicated what is in my womb to You, devoted to Your service, so accept it from me. You are the All-Hearing, the All-Knowing."},
 {"id": "ueedh", "t": "Protection for children", "cats": ["children", "evil", "baby"], "ref": "Sahih al-Bukhari 3371", "ar": "أُعِيذُكُمَا بِكَلِمَاتِ اللَّهِ التَّامَّةِ ۝ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ ۝ وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ", "tl": "U‘idhukuma bi kalimatillahit-tammah, min kulli shaytanin wa hammah, wa min kulli ‘aynin lammah.", "en": "I place you both under the protection of Allah's perfect words, from every devil and every harmful creature, and from every evil eye. (For one child: U‘idhuka.)"},
 {"id": "barakallah", "t": "For a newly married couple", "cats": ["marriage"], "ref": "Sunan Abi Dawud 2130 · Tirmidhi 1091", "ar": "بَارَكَ اللَّهُ لَكَ وَبَارَكَ عَلَيْكَ وَجَمَعَ بَيْنَكُمَا فِي خَيْرٍ", "tl": "Barakallahu laka wa baraka ‘alayka wa jama‘a baynakuma fi khayr.", "en": "May Allah bless you, send blessings upon you, and bring you both together in goodness."},
 {"id": "razaqna", "t": "Provide for us", "cats": ["rizq"], "ref": "Surah Al-Ma’idah 5:114", "ar": "وَارْزُقْنَا وَأَنتَ خَيْرُ الرَّازِقِينَ", "tl": "Warzuqna wa anta khayrur-raziqin.", "en": "Provide for us, for You are the best of providers."},
 {"id": "fadl", "t": "Leaving the masjid", "cats": ["rizq", "career", "debt"], "ref": "Sahih Muslim 713", "ar": "اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ", "tl": "Allahumma inni as’aluka min fadlik.", "en": "O Allah, I ask You from Your bounty."},
 {"id": "infani", "t": "Benefit me with what I learn", "cats": ["knowledge", "exams"], "ref": "Jami‘ at-Tirmidhi 3599", "ar": "اللَّهُمَّ انْفَعْنِي بِمَا عَلَّمْتَنِي ۝ وَعَلِّمْنِي مَا يَنْفَعُنِي ۝ وَزِدْنِي عِلْمًا", "tl": "Allahummanfa‘ni bima ‘allamtani, wa ‘allimni ma yanfa‘uni, wa zidni ‘ilma.", "en": "O Allah, benefit me with what You have taught me, teach me what will benefit me, and increase me in knowledge."},
 {"id": "ilmla", "t": "Refuge from useless knowledge", "cats": ["knowledge", "contentment", "closer", "jealousy"], "ref": "Sahih Muslim 2722", "ar": "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عِلْمٍ لَا يَنْفَعُ ۝ وَمِنْ قَلْبٍ لَا يَخْشَعُ ۝ وَمِنْ نَفْسٍ لَا تَشْبَعُ ۝ وَمِنْ دَعْوَةٍ لَا يُسْتَجَابُ لَهَا", "tl": "Allahumma inni a‘udhu bika min ‘ilmin la yanfa‘, wa min qalbin la yakhsha‘, wa min nafsin la tashba‘, wa min da‘watin la yustajabu laha.", "en": "O Allah, I seek refuge in You from knowledge that does not benefit, from a heart that is not humble, from a soul that is never satisfied, and from a prayer that is not answered."},
 {"id": "kursi", "t": "Ayat al-Kursi", "cats": ["evil", "protection", "sleep"], "ref": "Surah Al-Baqarah 2:255 · Sahih al-Bukhari 2311", "ar": "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ", "tl": "Allahu la ilaha illa huwal-Hayyul-Qayyum. La ta’khudhuhu sinatun wa la nawm. Lahu ma fis-samawati wa ma fil-ard. Man dhal-ladhi yashfa‘u ‘indahu illa bi idhnih. Ya‘lamu ma bayna aydihim wa ma khalfahum, wa la yuhituna bi shay’in min ‘ilmihi illa bima sha’. Wasi‘a kursiyyuhus-samawati wal-ard, wa la ya’uduhu hifzuhuma, wa huwal-‘Aliyyul-‘Azim.", "en": "Allah: there is no god but Him, the Ever-Living, the Sustainer of all. Neither drowsiness nor sleep overtakes Him. To Him belongs whatever is in the heavens and the earth. Who could intercede with Him except by His permission? He knows what is before them and what is behind them, and they grasp nothing of His knowledge except what He wills. His Throne extends over the heavens and the earth, and guarding them does not tire Him. He is the Most High, the Most Great."},
 {"id": "balad", "t": "Make this a city of peace", "cats": ["home", "rizq"], "ref": "Surah Al-Baqarah 2:126", "ar": "رَبِّ اجْعَلْ هَٰذَا بَلَدًا آمِنًا وَارْزُقْ أَهْلَهُ مِنَ الثَّمَرَاتِ", "tl": "Rabbij-‘al hadha baladan aminan warzuq ahlahu minath-thamarat.", "en": "My Lord, make this a city of safety, and provide its people with fruits."},
 {"id": "safar2", "t": "The traveller's dua", "cats": ["travel"], "ref": "Sahih Muslim 1342", "ar": "اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا الْبِرَّ وَالتَّقْوَى ۝ وَمِنَ الْعَمَلِ مَا تَرْضَى ۝ اللَّهُمَّ هَوِّنْ عَلَيْنَا سَفَرَنَا هَذَا وَاطْوِ عَنَّا بُعْدَهُ ۝ اللَّهُمَّ أَنْتَ الصَّاحِبُ فِي السَّفَرِ ۝ وَالْخَلِيفَةُ فِي الْأَهْلِ", "tl": "Allahumma inna nas’aluka fi safarina hadhal-birra wat-taqwa, wa minal-‘amali ma tarda. Allahumma hawwin ‘alayna safarana hadha watwi ‘anna bu‘dah. Allahumma antas-sahibu fis-safar, wal-khalifatu fil-ahl.", "en": "O Allah, we ask You on this journey for goodness and piety, and for deeds that please You. O Allah, make this journey easy for us and shorten its distance. O Allah, You are our Companion on the journey and the Guardian of the family we leave behind."},
 {"id": "majraha", "t": "Boarding a ship or vehicle", "cats": ["travel"], "ref": "Surah Hud 11:41", "ar": "بِسْمِ اللَّهِ مَجْرَاهَا وَمُرْسَاهَا ۚ إِنَّ رَبِّي لَغَفُورٌ رَّحِيمٌ", "tl": "Bismillahi majraha wa mursaha, inna Rabbi laghafurur-Rahim.", "en": "In the name of Allah it sails and in His name it anchors. Indeed, my Lord is Forgiving, Merciful."},
 {"id": "astawdi", "t": "Saying goodbye to a traveller", "cats": ["travel", "protection"], "ref": "Jami‘ at-Tirmidhi 3443 · Abu Dawud 2600", "ar": "أَسْتَوْدِعُ اللَّهَ دِينَكَ وَأَمَانَتَكَ وَخَوَاتِيمَ عَمَلِكَ", "tl": "Astawdi‘ullaha dinaka wa amanataka wa khawatima ‘amalik.", "en": "I entrust to Allah your faith, your trust, and the final outcome of your deeds."},
 {"id": "raditu", "t": "Pleased with Allah as my Lord", "cats": ["contentment", "faith", "daily"], "ref": "Sunan Abi Dawud 5072", "ar": "رَضِيتُ بِاللَّهِ رَبًّا ۝ وَبِالْإِسْلَامِ دِينًا ۝ وَبِمُحَمَّدٍ ﷺ نَبِيًّا", "tl": "Raditu billahi Rabba, wa bil-Islami dina, wa bi Muhammadin ﷺ nabiyya.", "en": "I am pleased with Allah as my Lord, with Islam as my religion, and with Muhammad ﷺ as my Prophet. (Three times, morning and evening.)"},
 {"id": "ahsin", "t": "Make my character beautiful", "cats": ["kindness", "anger"], "ref": "Musnad Ahmad 3823", "ar": "اللَّهُمَّ أَحْسَنْتَ خَلْقِي فَأَحْسِنْ خُلُقِي", "tl": "Allahumma ahsanta khalqi fa ahsin khuluqi.", "en": "O Allah, You made my outward form beautiful, so make my character beautiful too."},
 {"id": "munkarat", "t": "Refuge from bad character", "cats": ["kindness", "anger", "jealousy", "discipline"], "ref": "Jami‘ at-Tirmidhi 3591", "ar": "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ مُنْكَرَاتِ الْأَخْلَاقِ وَالْأَعْمَالِ وَالْأَهْوَاءِ", "tl": "Allahumma inni a‘udhu bika min munkaratil-akhlaqi wal-a‘mali wal-ahwa’.", "en": "O Allah, I seek refuge in You from bad character, bad deeds and bad desires."},
 {"id": "haqq", "t": "Truthful in anger and in calm", "cats": ["anger", "contentment"], "ref": "Sunan an-Nasa’i 1305", "ar": "اللَّهُمَّ إِنِّي أَسْأَلُكَ خَشْيَتَكَ فِي الْغَيْبِ وَالشَّهَادَةِ ۝ وَأَسْأَلُكَ كَلِمَةَ الْحَقِّ فِي الرِّضَا وَالْغَضَبِ ۝ وَأَسْأَلُكَ الْقَصْدَ فِي الْفَقْرِ وَالْغِنَى", "tl": "Allahumma inni as’aluka khashyataka fil-ghaybi wash-shahadah, wa as’aluka kalimatal-haqqi fir-rida wal-ghadab, wa as’alukal-qasda fil-faqri wal-ghina.", "en": "O Allah, I ask You to fear You in private and in public. I ask You for words of truth whether I am pleased or angry. And I ask You for moderation in poverty and in wealth."},
 {"id": "hubb", "t": "The dua of Dawud for Allah's love", "cats": ["closer"], "ref": "Jami‘ at-Tirmidhi 3490", "ar": "اللَّهُمَّ إِنِّي أَسْأَلُكَ حُبَّكَ ۝ وَحُبَّ مَنْ يُحِبُّكَ ۝ وَالْعَمَلَ الَّذِي يُبَلِّغُنِي حُبَّكَ", "tl": "Allahumma inni as’aluka hubbak, wa hubba man yuhibbuk, wal-‘amalal-ladhi yuballighuni hubbak.", "en": "O Allah, I ask You for Your love, the love of those who love You, and the deeds that will bring me to Your love."},
 {"id": "habbib", "t": "Make faith beloved to us", "cats": ["faith"], "ref": "Musnad Ahmad 15492", "ar": "اللَّهُمَّ حَبِّبْ إِلَيْنَا الْإِيمَانَ وَزَيِّنْهُ فِي قُلُوبِنَا ۝ وَكَرِّهْ إِلَيْنَا الْكُفْرَ وَالْفُسُوقَ وَالْعِصْيَانَ ۝ وَاجْعَلْنَا مِنَ الرَّاشِدِينَ", "tl": "Allahumma habbib ilaynal-imana wa zayyinhu fi qulubina, wa karrih ilaynal-kufra wal-fusuqa wal-‘isyan, waj‘alna minar-rashidin.", "en": "O Allah, make faith beloved to us and beautify it in our hearts. Make disbelief, sin and disobedience hateful to us, and make us among the rightly guided."},
 {"id": "abrar", "t": "Die among the righteous", "cats": ["faith", "jannah"], "ref": "Surah Aal-Imran 3:193 · Sahih al-Bukhari 4569", "ar": "رَّبَّنَا إِنَّنَا سَمِعْنَا مُنَادِيًا يُنَادِي لِلْإِيمَانِ أَنْ آمِنُوا بِرَبِّكُمْ فَآمَنَّا ۚ رَبَّنَا فَاغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّئَاتِنَا وَتَوَفَّنَا مَعَ الْأَبْرَارِ", "tl": "Rabbana innana sami‘na munadiyan yunadi lil-imani an aminu bi Rabbikum fa’amanna. Rabbana faghfir lana dhunubana wa kaffir ‘anna sayyi’atina wa tawaffana ma‘al-abrar.", "en": "Our Lord, we heard a caller calling to faith: “Believe in your Lord,” and we believed. Our Lord, forgive our sins, wipe away our misdeeds, and let us die among the righteous."},
 {"id": "baid", "t": "Opening the prayer", "cats": ["prayers", "forgiveness"], "ref": "Sahih al-Bukhari 744", "ar": "اللَّهُمَّ بَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ ۝ اللَّهُمَّ نَقِّنِي مِنَ الْخَطَايَا كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ ۝ اللَّهُمَّ اغْسِلْ خَطَايَايَ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ", "tl": "Allahumma ba‘id bayni wa bayna khatayaya kama ba‘adta baynal-mashriqi wal-maghrib. Allahumma naqqini minal-khataya kama yunaqqath-thawbul-abyadu minad-danas. Allahummaghsil khatayaya bil-ma’i wath-thalji wal-barad.", "en": "O Allah, put distance between me and my sins as You have put distance between the east and the west. O Allah, cleanse me of sins as a white garment is cleansed of dirt. O Allah, wash away my sins with water, snow and hail."},
 {"id": "abubakr", "t": "The dua taught to Abu Bakr", "cats": ["prayers", "forgiveness"], "ref": "Sahih al-Bukhari 834", "ar": "اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا ۝ وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ ۝ فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ وَارْحَمْنِي ۝ إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ", "tl": "Allahumma inni zalamtu nafsi zulman kathira, wa la yaghfirudh-dhunuba illa ant, faghfir li maghfiratan min ‘indik, warhamni, innaka antal-Ghafurur-Rahim.", "en": "O Allah, I have wronged myself greatly, and none forgives sins but You. So forgive me with forgiveness from Yourself and have mercy on me. You are the Forgiving, the Merciful."},
 {"id": "adhan", "t": "After the call to prayer", "cats": ["prayers"], "ref": "Sahih al-Bukhari 614", "ar": "اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ وَالصَّلَاةِ الْقَائِمَةِ ۝ آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ ۝ وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ", "tl": "Allahumma Rabba hadhihid-da‘watit-tammah, was-salatil-qa’imah, ati Muhammadanil-wasilata wal-fadilah, wab‘athhu maqaman mahmudanil-ladhi wa‘adtah.", "en": "O Allah, Lord of this perfect call and the prayer about to be established, grant Muhammad the highest station and excellence, and raise him to the praised position You promised him."},
 {"id": "maasbaha", "t": "Thanks for every blessing", "cats": ["gratitude", "daily"], "ref": "Sunan Abi Dawud 5073", "ar": "اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ ۝ فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ", "tl": "Allahumma ma asbaha bi min ni‘matin aw bi ahadin min khalqika faminka wahdaka la sharika lak, falakal-hamdu wa lakash-shukr.", "en": "O Allah, whatever blessing I or any of Your creation have this morning is from You alone, You have no partner. So all praise and thanks are Yours. (In the evening, say “amsa” instead of “asbaha.”)"},
 {"id": "istikhara", "t": "Istikhara: asking Allah to choose", "cats": ["guidance", "career", "marriage"], "ref": "Sahih al-Bukhari 1162", "ar": "اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ ۝ وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ ۝ وَأَسْأَلُكَ مِنْ فَضْلِكَ الْعَظِيمِ ۝ فَإِنَّكَ تَقْدِرُ وَلَا أَقْدِرُ ۝ وَتَعْلَمُ وَلَا أَعْلَمُ ۝ وَأَنْتَ عَلَّامُ الْغُيُوبِ ۝ اللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ خَيْرٌ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي فَاقْدُرْهُ لِي وَيَسِّرْهُ لِي ثُمَّ بَارِكْ لِي فِيهِ ۝ وَإِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ شَرٌّ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي فَاصْرِفْهُ عَنِّي وَاصْرِفْنِي عَنْهُ ۝ وَاقْدُرْ لِيَ الْخَيْرَ حَيْثُ كَانَ ثُمَّ أَرْضِنِي بِهِ", "tl": "Allahumma inni astakhiruka bi ‘ilmik, wa astaqdiruka bi qudratik, wa as’aluka min fadlikal-‘azim. Fa innaka taqdiru wa la aqdir, wa ta‘lamu wa la a‘lam, wa anta ‘allamul-ghuyub. Allahumma in kunta ta‘lamu anna hadhal-amra khayrun li fi dini wa ma‘ashi wa ‘aqibati amri faqdurhu li wa yassirhu li thumma barik li fih. Wa in kunta ta‘lamu anna hadhal-amra sharrun li fi dini wa ma‘ashi wa ‘aqibati amri fasrifhu ‘anni wasrifni ‘anh, waqdur liyal-khayra haythu kana thumma ardini bih.", "en": "O Allah, I ask You to guide my choice through Your knowledge, and to give me ability through Your power, and I ask You from Your great bounty. You are able and I am not; You know and I do not; You know all that is hidden. O Allah, if You know this matter is good for me in my religion, my life and my future, decree it for me, make it easy and bless it for me. And if You know it is bad for me in my religion, my life and my future, turn it away from me and turn me away from it, decree for me what is good wherever it is, and make me content with it."},
 {"id": "sawaa", "t": "Guide me to the right path", "cats": ["guidance", "travel"], "ref": "Surah Al-Qasas 28:22", "ar": "عَسَىٰ رَبِّي أَن يَهْدِيَنِي سَوَاءَ السَّبِيلِ", "tl": "‘Asa Rabbi an yahdiyani sawa’as-sabil.", "en": "Perhaps my Lord will guide me to the right way."},
 {"id": "rushd", "t": "Inspire me to what is right", "cats": ["discipline", "guidance"], "ref": "Jami‘ at-Tirmidhi 3483", "ar": "اللَّهُمَّ أَلْهِمْنِي رُشْدِي ۝ وَأَعِذْنِي مِنْ شَرِّ نَفْسِي", "tl": "Allahumma alhimni rushdi, wa a‘idhni min sharri nafsi.", "en": "O Allah, inspire me with sound judgement, and protect me from the evil of my own self."},
 {"id": "asiyah", "t": "The dua of Asiyah", "cats": ["jannah", "courage"], "ref": "Surah At-Tahrim 66:11", "ar": "رَبِّ ابْنِ لِي عِندَكَ بَيْتًا فِي الْجَنَّةِ وَنَجِّنِي مِن فِرْعَوْنَ وَعَمَلِهِ وَنَجِّنِي مِنَ الْقَوْمِ الظَّالِمِينَ", "tl": "Rabbibni li ‘indaka baytan fil-jannah, wa najjini min Fir‘awna wa ‘amalih, wa najjini minal-qawmiz-zalimin.", "en": "My Lord, build for me a house near You in Paradise, and save me from Pharaoh and his deeds, and save me from the wrongdoing people."},
 {"id": "warathah", "t": "Make me an heir of Paradise", "cats": ["jannah"], "ref": "Surah Ash-Shu‘ara 26:85", "ar": "وَاجْعَلْنِي مِن وَرَثَةِ جَنَّةِ النَّعِيمِ", "tl": "Waj‘alni min warathati jannatin-na‘im.", "en": "And make me one of the heirs of the Garden of Bliss."},
 {"id": "maghram", "t": "Refuge from sin and debt", "cats": ["debt"], "ref": "Sahih al-Bukhari 832", "ar": "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْمَأْثَمِ وَالْمَغْرَمِ", "tl": "Allahumma inni a‘udhu bika minal-ma’thami wal-maghram.", "en": "O Allah, I seek refuge in You from sin and from debt."}
];
let HI = {"istighfar": "Aye Allah, Tu mera Rab hai, Tere siwa koi ibaadat ke laayak nahi. Tune mujhe paida kiya aur main Tera banda hoon. Main apni taaqat bhar Tere ahad aur waade par qaayam hoon. Maine jo bura kiya uske shar se Teri panaah maangta hoon. Main apne upar Teri nematon ka iqraar karta hoon aur apne gunaah ka bhi iqraar karta hoon, toh mujhe maaf farma de, kyunki Tere siwa koi gunaahon ko maaf nahi karta.", "atina": "Aye humare Rab, humein duniya mein bhi bhalaai de aur aakhirat mein bhi bhalaai de, aur humein jahannum ke azaab se bacha.", "zidni": "Aye mere Rab, mere ilm mein izaafa farma.", "sadri": "Aye mere Rab, mera seena khol de, mera kaam mere liye aasaan kar de, aur meri zabaan ki girah khol de taaki log meri baat samajh sakein.", "sahl": "Aye Allah, koi kaam aasaan nahi siwaye uske jise Tu aasaan bana de, aur Tu jab chahe mushkil ko bhi aasaan bana deta hai.", "nafi": "Aye Allah, main Tujhse faayda dene wala ilm, paak aur halaal rizq, aur qubool hone wale amal maangta hoon.", "faqir": "Aye mere Rab, jo bhi bhalaai Tu mujh par utaare, main uska mohtaaj hoon.", "ikfini": "Aye Allah, apne halaal ke zariye mujhe haraam se bacha le, aur apne fazl se mujhe apne siwa sab se be-niyaaz kar de.", "hamm": "Aye Allah, main fikr aur gham se, majboori aur susti se, kanjoosi aur buzdili se, qarz ke bojh aur logon ke dabaav se Teri panaah maangta hoon.", "yunus": "Tere siwa koi ma'bood nahi, Tu paak hai. Beshak main hi zulm karne walon mein se tha.", "hasbuna": "Allah humare liye kaafi hai, aur woh behtareen kaam banane wala hai.", "bismillah": "Allah ke naam se, jiske naam ke saath zameen aur aasmaan mein koi cheez nuqsaan nahi pahuncha sakti, aur woh sab sunne wala, sab jaanne wala hai. (Teen baar padhein.)", "kalimat": "Main Allah ke mukammal kalimaat ki panaah maangta hoon har us cheez ke shar se jo usne paida ki.", "safar": "Paak hai woh zaat jisne is sawaari ko humare bas mein kar diya, warna hum ise qaabu mein nahi kar sakte the, aur beshak hum apne Rab ki taraf lautne wale hain.", "shifa": "Aye Allah, logon ke Rab, takleef door kar de aur shifa de, Tu hi shifa dene wala hai. Teri shifa ke siwa koi shifa nahi, aisi shifa de jo koi beemaari na chhode.", "walidayn": "Aye mere Rab, in dono par reham farma jaise inhone bachpan mein meri parwarish ki.", "qurra": "Aye humare Rab, humein humare jeevan-saathiyon aur aulaad se aankhon ki thandak ata farma, aur humein parhezgaaron ka imaam bana.", "dhurriyya": "Aye mere Rab, mujhe apni taraf se nek aulaad ata farma. Beshak Tu dua sunne wala hai.", "zalamna": "Aye humare Rab, humne apni jaanon par zulm kiya. Agar Tu humein maaf na kare aur hum par reham na kare toh hum zaroor nuqsaan uthaane walon mein se ho jayenge.", "muqallib": "Aye dilon ko pherne wale, mere dil ko apne deen par mazboot rakh.", "tuzigh": "Aye humare Rab, hidaayat dene ke baad humare dilon ko tedha na kar, aur humein apni taraf se rehmat ata farma. Beshak Tu bahut dene wala hai.", "ainni": "Aye Allah, apne zikr, apne shukr aur apni achhi ibaadat karne mein meri madad farma.", "awzini": "Aye mere Rab, mujhe taufeeq de ki main Teri us nemat ka shukr ada karoon jo Tune mujh par aur mere waalidain par ki, aur aise nek amal karoon jinse Tu raazi ho.", "janna": "Aye Allah, main Tujhse jannat maangta hoon aur jahannum se Teri panaah maangta hoon.", "huda": "Aye Allah, main Tujhse hidaayat, taqwa, paakdaamni aur be-niyaazi maangta hoon.", "akhlaq": "Aye Allah, mujhe behtareen akhlaaq ki taraf rehnumaai farma. Behtareen akhlaaq ki taraf Tere siwa koi rehnumaai nahi karta.", "ghill": "Aye humare Rab, humein aur humare un bhaiyon ko maaf farma jo imaan mein humse pehle guzar gaye, aur humare dilon mein imaan walon ke liye koi keena na rakh. Aye humare Rab, beshak Tu bahut meharbaan, reham karne wala hai.", "taawwudh": "Main shaitaan mardood se Allah ki panaah maangta hoon.", "sabr": "Aye humare Rab, hum par sabr undel de, humare qadam jama de, aur kaafir qaum ke muqaable mein humari madad farma.", "musiba": "Beshak hum Allah ke hain aur usi ki taraf lautne wale hain. Aye Allah, mujhe meri museebat mein ajr de aur iske badle mujhe isse behtar ata farma.", "nawm": "Aye Allah, Tere naam se main marta hoon aur jeeta hoon.", "manzil": "Aye mere Rab, mujhe barkat wali jagah utaar, aur Tu sabse behtar utaarne wala hai.", "salah": "Aye mere Rab, mujhe aur meri aulaad ko namaaz qaayam karne wala bana. Aye humare Rab, meri dua qubool farma.", "tawakkaltu": "Allah ke naam se, maine Allah par bharosa kiya. Allah ke siwa na koi taaqat hai na koi quwwat.", "tuakhidhna": "Aye humare Rab, agar hum bhool jaayein ya ghalti kar baithein toh humari pakad na farma. Aye humare Rab, hum par aisa bojh na daal jaisa humse pehle walon par daala. Aye humare Rab, hum par woh bojh na daal jise uthaane ki humein taaqat nahi. Humein maaf farma, humein bakhsh de, hum par reham farma. Tu hi humara maalik hai, toh kaafir qaum ke muqaable mein humari madad farma.", "hayy": "Aye hamesha zinda rehne wale, aye sab ko qaayam rakhne wale, Teri rehmat ke sahaare main madad maangta hoon.", "karb": "Allah ke siwa koi ma‘bood nahi, jo azeem aur burdbaar hai. Allah ke siwa koi ma‘bood nahi, jo azeem arsh ka Rab hai. Allah ke siwa koi ma‘bood nahi, jo aasmaanon ka Rab, zameen ka Rab aur izzat wale arsh ka Rab hai.", "rahmataka": "Aye Allah, main Teri rehmat ka ummeedwaar hoon, toh mujhe palak jhapakne ke barabar bhi mere apne hawaale na kar. Mere saare kaam durust farma de. Tere siwa koi ma‘bood nahi.", "hasbi": "Allah mere liye kaafi hai. Uske siwa koi ma‘bood nahi. Maine usi par bharosa kiya, aur woh azeem arsh ka Rab hai.", "ufawwid": "Main apna maamla Allah ke supurd karta hoon. Beshak Allah apne bandon ko dekh raha hai.", "ayyub": "Mujhe takleef pahunchi hai, aur Tu sab reham karne walon se zyada reham karne wala hai.", "asalullah": "Main azeem Allah se, jo azeem arsh ka Rab hai, sawaal karta hoon ki tumhe shifa de. (Saat baar kahein.)", "qudra": "Allah ke naam se (teen baar). Main Allah aur uski qudrat ki panaah maangta hoon us takleef ke shar se jo main mehsoos karta hoon aur jiska mujhe dar hai (saat baar).", "afini": "Aye Allah, mere jism ko aafiyat de. Aye Allah, meri sunne ki taaqat ko aafiyat de. Aye Allah, meri nazar ko aafiyat de. Tere siwa koi ma‘bood nahi. (Subah aur shaam teen baar.)", "afwafiya": "Aye Allah, main Tujhse duniya aur aakhirat mein maafi aur aafiyat maangta hoon.", "afuww": "Aye Allah, Tu bahut maaf karne wala hai aur maaf karna pasand karta hai, toh mujhe maaf farma de.", "tubalayya": "Aye mere Rab, mujhe bakhsh de aur meri tauba qubool farma. Beshak Tu tauba qubool karne wala, reham karne wala hai.", "qini": "Aye Allah, mujhe us din apne azaab se bacha lena jis din Tu apne bandon ko dobaara uthaayega. (Teen baar.)", "wadatu": "Aye mere Rab, Tere naam se main apna pehlu rakhta hoon aur Teri madad se hi uthaaunga. Agar Tu meri rooh rok le toh us par reham farma, aur agar lauta de toh uski hifaazat farma jaise Tu apne nek bandon ki hifaazat karta hai.", "bara": "Aye Allah, maine apne aap ko Tere supurd kiya, apna chehra Teri taraf kiya, apna maamla Tujhe saunpa aur apni peeth Tera sahaara le kar tikaayi, Teri ummeed aur Tere dar ke saath. Tujhse bach kar Tere siwa koi panaahgaah nahi. Main Teri utaari hui kitaab aur Tere bheje hue Nabi par imaan laaya.", "ahyana": "Saari taareef Allah ke liye hai jisne humein maut dene ke baad zindagi di, aur usi ki taraf laut kar jaana hai.", "ibrahim41": "Aye humare Rab, mujhe, mere waalidain ko aur sab imaan walon ko us din bakhsh dena jis din hisaab qaayam hoga.", "nuh28": "Aye mere Rab, mujhe, mere waalidain ko, jo bhi imaan ke saath mere ghar mein aaye usko, aur sab imaan wale mardon aur auraton ko bakhsh de.", "ahqaf": "Aye mere Rab, mujhe taufeeq de ki main Teri un nematon ka shukr karoon jo Tune mujh par aur mere waalidain par ki, aur aise nek kaam karoon jinse Tu raazi ho, aur meri aulaad ko nek bana de. Main Teri taraf tauba karta hoon aur main farmaabardaaron mein se hoon.", "fardan": "Aye mere Rab, mujhe akela, be-aulaad na chhod, aur Tu sabse behtar waaris hai.", "salihin": "Aye mere Rab, mujhe nek aulaad ata farma.", "imran": "Aye mere Rab, jo mere pet mein hai use maine Tere liye waqf kar diya, toh mujhse qubool farma. Beshak Tu sab sunne wala, sab jaanne wala hai.", "ueedh": "Main tum dono ko Allah ke mukammal kalimaat ki panaah mein deta hoon, har shaitaan aur har nuqsaan dene wale jaanwar se, aur har buri nazar se. (Ek bachche ke liye: U‘idhuka.)", "barakallah": "Allah tumhe barkat de, tum par barkat naazil kare, aur tum dono ko bhalaai mein jod kar rakhe.", "razaqna": "Humein rizq de, aur Tu sabse behtar rizq dene wala hai.", "fadl": "Aye Allah, main Tujhse Tera fazl maangta hoon.", "infani": "Aye Allah, jo Tune mujhe sikhaaya usse mujhe faayda pahuncha, mujhe woh sikha jo mere liye faaydemand ho, aur mere ilm mein izaafa farma.", "ilmla": "Aye Allah, main Teri panaah maangta hoon aise ilm se jo faayda na de, aise dil se jo na dare, aise nafs se jo kabhi na bhare, aur aisi dua se jo qubool na ho.", "kursi": "Allah, uske siwa koi ma‘bood nahi, woh hamesha zinda hai, sab ko qaayam rakhne wala hai. Na use oongh aati hai na neend. Aasmaanon aur zameen mein jo kuch hai usi ka hai. Kaun hai jo uski ijaazat ke baghair uske paas sifaarish kare? Woh jaanta hai jo logon ke aage hai aur jo peeche hai, aur log uske ilm mein se kuch bhi nahi ghair sakte siwaye uske jo woh chahe. Uski kursi aasmaanon aur zameen par phaili hui hai, aur unki hifaazat use thakaati nahi. Woh sabse buland, sabse azeem hai.", "balad": "Aye mere Rab, is shehar ko aman wala bana de, aur iske rehne walon ko phalon se rizq de.", "safar2": "Aye Allah, hum is safar mein Tujhse neki aur taqwa maangte hain, aur aise amal jinse Tu raazi ho. Aye Allah, humare is safar ko aasaan kar de aur iski doori ko samet de. Aye Allah, safar mein Tu humara saathi hai aur peeche ghar waalon ka nigehbaan.", "majraha": "Allah ke naam se iska chalna hai aur usi ke naam se iska thehrna. Beshak mera Rab bakhshne wala, reham karne wala hai.", "astawdi": "Main tumhara deen, tumhari amaanat aur tumhare amal ka anjaam Allah ke supurd karta hoon.", "raditu": "Main Allah ko apna Rab maan kar, Islam ko apna deen maan kar, aur Muhammad ﷺ ko apna Nabi maan kar raazi hoon. (Subah aur shaam teen baar.)", "ahsin": "Aye Allah, Tune meri soorat achhi banaayi, toh meri seerat bhi achhi bana de.", "munkarat": "Aye Allah, main bure akhlaaq, bure kaamon aur buri khwaahishon se Teri panaah maangta hoon.", "haqq": "Aye Allah, main Tujhse akele mein aur sab ke saamne Tera dar maangta hoon. Khushi aur gusse dono haalat mein sach baat kehne ki taufeeq maangta hoon. Aur ghareebi aur ameeri dono mein miyaana-ravi maangta hoon.", "hubb": "Aye Allah, main Tujhse Teri mohabbat maangta hoon, un logon ki mohabbat jo Tujhse mohabbat karte hain, aur aise amal jo mujhe Teri mohabbat tak pahuncha dein.", "habbib": "Aye Allah, imaan ko humare liye mehboob bana de aur use humare dilon mein sajaa de. Kufr, gunaah aur naafarmaani ko humare liye napasand bana de, aur humein seedhe raaste walon mein se bana de.", "abrar": "Aye humare Rab, humne ek pukaarne wale ko imaan ki taraf pukaarte suna ki apne Rab par imaan laao, toh hum imaan le aaye. Aye humare Rab, humare gunaah bakhsh de, humari buraaiyan mita de, aur humein nek logon ke saath maut de.", "baid": "Aye Allah, mere aur mere gunaahon ke beech itni doori kar de jitni Tune mashriq aur maghrib ke beech rakhi hai. Aye Allah, mujhe gunaahon se aise saaf kar de jaise safed kapda mail se saaf kiya jaata hai. Aye Allah, mere gunaahon ko paani, barf aur olon se dho de.", "abubakr": "Aye Allah, maine apni jaan par bahut zulm kiya, aur Tere siwa koi gunaah maaf nahi karta. Toh apni taraf se mujhe bakhsh de aur mujh par reham farma. Beshak Tu bakhshne wala, reham karne wala hai.", "adhan": "Aye Allah, is mukammal pukaar aur qaayam hone waali namaaz ke Rab, Muhammad ﷺ ko waseela aur fazeelat ata farma, aur unhe us maqaam-e-mahmood par pahuncha jiska Tune unse waada kiya hai.", "maasbaha": "Aye Allah, is subah mujh par ya Teri kisi bhi makhlooq par jo bhi nemat hai, woh sirf Teri taraf se hai, Tera koi shareek nahi. Toh saari taareef aur saara shukr Tere hi liye hai. (Shaam ko “asbaha” ki jagah “amsa” kahein.)", "istikhara": "Aye Allah, main Tere ilm ke zariye Tujhse bhalaai ka faisla maangta hoon, Teri qudrat se taaqat maangta hoon, aur Tere azeem fazl ka sawaal karta hoon. Tu qaadir hai, main nahi; Tu jaanta hai, main nahi; aur Tu chhupi baaton ko khoob jaanta hai. Aye Allah, agar Tere ilm mein yeh kaam mere deen, meri zindagi aur mere anjaam ke liye behtar hai, toh ise mere liye muqarrar kar de, aasaan kar de aur ismein barkat de. Aur agar Tere ilm mein yeh mere deen, meri zindagi aur mere anjaam ke liye bura hai, toh ise mujhse pher de aur mujhe isse pher de, aur jahan bhi bhalaai ho mere liye muqarrar kar de, phir mujhe usse raazi kar de.", "sawaa": "Ummeed hai mera Rab mujhe seedhe raaste ki taraf rehnumaai karega.", "rushd": "Aye Allah, mere dil mein sahi raah daal de, aur mujhe mere apne nafs ki buraai se bacha le.", "asiyah": "Aye mere Rab, mere liye apne paas jannat mein ek ghar bana de, mujhe Firaun aur uske kaamon se bacha le, aur mujhe zaalim qaum se nijaat de.", "warathah": "Aur mujhe nematon wali jannat ke waariso mein se bana de.", "maghram": "Aye Allah, main gunaah aur qarz se Teri panaah maangta hoon."};
let BG = {"istighfar": {"en": "The Prophet ﷺ called this the “master of seeking forgiveness.” He said that whoever says it during the day with firm belief and dies before evening will be among the people of Paradise, and the same for whoever says it at night and dies before morning.", "hi": "Nabi ﷺ ne ise “maafi maangne ka sardaar” kaha. Aap ﷺ ne farmaaya ki jo din mein pakke yaqeen ke saath ise padhe aur shaam se pehle uska inteqaal ho jaaye, woh jannat waalon mein se hoga, aur raat ko padhne wale ke liye bhi yahi hai."}, "atina": {"en": "Anas (RA) said this was the dua the Prophet ﷺ made more than any other. In the Qur'an it is praised as the prayer of people who ask Allah for both worlds, not only for this one.", "hi": "Anas (RA) ne bataaya ki Nabi ﷺ sabse zyada yahi dua karte the. Qur'an mein in logon ki taareef hai jo sirf duniya nahi, balki dono jahaan ki bhalaai maangte hain."}, "zidni": {"en": "Knowledge is the only thing Allah told the Prophet ﷺ to ask for more of in the Qur'an. The verse came as he hurried to memorise the revelation: be patient, and say “My Lord, increase me in knowledge.”", "hi": "Qur'an mein ilm hi woh cheez hai jiske izaafe ki dua maangne ka hukm Allah ne Nabi ﷺ ko diya. Yeh aayat tab utri jab Aap ﷺ wahi yaad karne mein jaldi karte the: sabr karo, aur kaho “Rabbi zidni ‘ilma.”"}, "sadri": {"en": "Musa (AS) said this when Allah commanded him to go to Pharaoh, the most powerful tyrant of his time. He felt the weight of the task and struggled with his speech, so he asked for a calm heart, an easy path and clear words. Allah answered: “You have been granted your request, O Musa.”", "hi": "Jab Allah ne Musa (AS) ko Firaun ke paas jaane ka hukm diya, jo us waqt ka sabse bada zaalim tha, tab unhone yeh dua ki. Kaam bhaari tha aur zabaan mein dikkat thi, isliye unhone sukoon wala dil, aasaan raasta aur saaf baat maangi. Allah ne farmaaya: “Aye Musa, tumhaari maang poori kar di gayi.”"}, "sahl": {"en": "The Prophet ﷺ taught this short dua as a r
