eminder that no task is easy or hard in itself. Ease is something Allah gives, and He can turn the hardest moment into an easy one.", "hi": "Nabi ﷺ ne yeh chhoti si dua sikhaayi taaki yaad rahe ki koi kaam apne aap aasaan ya mushkil nahi hota. Aasaani Allah deta hai, aur woh sabse mushkil ghadi ko bhi aasaan bana sakta hai."}, "nafi": {"en": "Umm Salamah (RA) reported that the Prophet ﷺ said this every morning after the Fajr prayer, as soon as he finished it. He began each day by asking for three things: useful knowledge, pure provision and accepted deeds.", "hi": "Umm Salamah (RA) bataati hain ki Nabi ﷺ har subah Fajr ki namaaz ka salaam pherte hi yeh dua padhte the. Aap ﷺ har din ki shuruaat teen cheezein maang kar karte the: faayda dene wala ilm, paak rizq aur qubool hone wale amal."}, "faqir": {"en": "Musa (AS) fled Egypt alone and reached Madyan tired, hungry and with nothing. He helped two women water their flock, then sat in the shade and made this dua. Soon one of them came back to invite him to her father, and that meeting gave him safety, work and a family.", "hi": "Musa (AS) akele Misr se nikal kar Madyan pahunche, thake hue, bhooke aur khaali haath. Unhone do auraton ki bakriyon ko paani pilaane mein madad ki, phir chhaaon mein baith kar yeh dua ki. Thodi hi der mein unmein se ek unhe apne waalid ke paas bulaane aayi, aur wahin se unhe hifaazat, kaam aur ghar-parivaar mila."}, "ikfini": {"en": "A man who needed money to pay for his freedom came to Ali (RA) for help. Ali taught him this dua, which the Prophet ﷺ had taught him, and said that even if he had a debt as large as a mountain, Allah would pay it off for him.", "hi": "Ek shakhs jise apni aazaadi ke liye paise chukaane the, Ali (RA) ke paas madad maangne aaya. Ali (RA) ne use yeh dua sikhaayi jo Nabi ﷺ ne unhe sikhaayi thi, aur kaha ki agar tum par pahaad jitna qarz bhi ho, Allah use ada karwa dega."}, "hamm": {"en": "Anas (RA), who served the Prophet ﷺ for ten years, said he often heard him say this dua. Even the Messenger of Allah ﷺ sought refuge from worry, grief and the weight of debt.", "hi": "Anas (RA), jinhone das saal Nabi ﷺ ki khidmat ki, kehte hain ki woh aksar Aap ﷺ ko yeh dua karte sunte the. Allah ke Rasool ﷺ bhi fikr, gham aur qarz ke bojh se panaah maangte the."}, "yunus": {"en": "Yunus (AS) was swallowed by a great fish and found himself in layers of darkness: the night, the sea and the belly of the whale. From there he called out with these words, and Allah saved him. The Prophet ﷺ said that any Muslim who calls on Allah with this dua for anything will be answered.", "hi": "Yunus (AS) ko ek badi machhli ne nigal liya aur woh andheron mein ghir gaye: raat ka andhera, samundar ka andhera aur machhli ke pet ka andhera. Wahan se unhone yeh alfaaz pukaare aur Allah ne unhe bacha liya. Nabi ﷺ ne farmaaya ki jo Muslim kisi bhi cheez ke liye in alfaaz se dua kare, uski dua qubool hoti hai."}, "hasbuna": {"en": "Ibn Abbas (RA) said Ibrahim (AS) spoke these words when he was thrown into the fire, and the fire became cool and safe. The Prophet ﷺ and his companions said them when they were told a huge army had gathered against them, and it only increased their faith.", "hi": "Ibn Abbas (RA) ne bataaya ki Ibrahim (AS) ne yeh alfaaz tab kahe jab unhe aag mein daala gaya, aur aag thandi aur salaamati wali ho gayi. Nabi ﷺ aur sahaaba ne bhi yahi kaha jab unhe bataaya gaya ki ek bada lashkar unke khilaaf jama hai, aur isse unka imaan aur badh gaya."}, "bismillah": {"en": "Uthman (RA) narrated that whoever says this three times in the morning and evening will not be harmed by anything. The narrator, Aban, later had a stroke. When someone looked at him in surprise, he said: the hadith is true, but that day I forgot to say it.", "hi": "Usman (RA) ne riwaayat kiya ki jo subah aur shaam teen baar yeh padhe, use koi cheez nuqsaan nahi pahunchaayegi. Riwaayat karne wale Abaan ko baad mein faalij ho gaya. Jab kisi ne unhe hairaani se dekha toh unhone kaha: hadees sach hai, bas us din main ise padhna bhool gaya tha."}, "kalimat": {"en": "Khawlah bint Hakim (RA) heard the Prophet ﷺ say that whoever stops at any place and says these words will not be harmed by anything until he leaves it. It is a short shield for a new room, a hotel or a journey's stop.", "hi": "Khawlah bint Hakim (RA) ne Nabi ﷺ ko farmaate suna ki jo kisi jagah ruke aur yeh alfaaz padhe, use wahan se nikalne tak koi cheez nuqsaan nahi pahunchaayegi. Naye kamre, hotel ya safar ke padaav ke liye yeh ek chhoti si hifaazat hai."}, "safar": {"en": "When the Prophet ﷺ mounted his camel to travel, he said Allahu Akbar three times and then recited this. The verse reminds us that every ride is a gift we could not control alone, and every journey points to the last one, back to our Lord.", "hi": "Jab Nabi ﷺ safar ke liye oont par sawaar hote, toh teen baar Allahu Akbar kehte aur phir yeh padhte. Yeh aayat yaad dilaati hai ki har sawaari ek tohfa hai jise hum akele qaabu nahi kar sakte, aur har safar us aakhri safar ki taraf ishaara hai jo apne Rab ki taraf hai."}, "shifa": {"en": "Aisha (RA) reported that when someone in the family fell sick, the Prophet ﷺ would gently wipe over them with his right hand and say these words. You can say it for yourself, or with your hand on someone you love.", "hi": "Aisha (RA) bataati hain ki jab ghar mein koi beemaar hota, toh Nabi ﷺ apna daayaan haath pyaar se us par pherte aur yeh alfaaz padhte. Aap ise apne liye padh sakte hain, ya apne kisi pyaare par haath rakh kar."}, "walidayn": {"en": "In Surah Al-Isra, Allah places kindness to parents right after worshipping Him alone. He tells us never to say even “uff” to them, to lower the wing of humility out of mercy, and to pray these words for them.", "hi": "Surah Al-Isra mein Allah ne apni ibaadat ke foran baad waalidain ke saath achhe sulook ka hukm diya. Farmaaya ki unhe “uff” tak na kaho, reham se unke saamne aajizi ka baazu jhuka do, aur unke liye yeh dua karo."}, "qurra": {"en": "At the end of Surah Al-Furqan, Allah describes the “servants of the Most Merciful”: they walk humbly, pray at night and avoid harm. Among their traits is this dua for families that bring joy to the eyes and lead others to good.", "hi": "Surah Al-Furqan ke aakhir mein Allah “Rahman ke bandon” ka zikr karta hai: jo aajizi se chalte hain, raaton ko ibaadat karte hain aur buraai se bachte hain. Unki ek pehchaan yeh dua hai, aise ghar-parivaar ke liye jo aankhon ki thandak ho aur doosron ko bhalaai ki raah dikhaaye."}, "dhurriyya": {"en": "Zakariyya (AS) was old and his wife had never had children. When he found fruit out of season with young Maryam and she said “It is from Allah,” hope stirred in him and he made this dua on the spot. The angels soon brought him the good news of a son, Yahya.", "hi": "Zakariyya (AS) boodhe ho chuke the aur unki biwi ke koi aulaad nahi thi. Jab unhone Maryam ke paas be-mausam phal dekhe aur Maryam ne kaha “Yeh Allah ki taraf se hai,” toh unke dil mein ummeed jaagi aur unhone wahin yeh dua ki. Jald hi farishton ne unhe bete Yahya ki khushkhabri di."}, "zalamna": {"en": "After Adam and Hawwa ate from the forbidden tree, they did not blame anyone else. They admitted their mistake with these words, and Allah accepted their repentance. It is the first dua of repentance in human history.", "hi": "Jab Adam aur Hawwa ne mana kiye gaye ped se khaaya, toh unhone kisi aur ko ilzaam nahi diya. Unhone in alfaaz ke saath apni ghalti maani aur Allah ne unki tauba qubool ki. Yeh insaani taareekh ki pehli tauba ki dua hai."}, "muqallib": {"en": "Anas (RA) said the Prophet ﷺ said this often. The companions asked whether he feared for them even though they believed. He replied that hearts are between two fingers of the Most Merciful, and He turns them as He wills.", "hi": "Anas (RA) kehte hain ki Nabi ﷺ yeh dua bahut karte the. Sahaaba ne poocha ki kya Aap ﷺ humare imaan ke baawajood humare liye darte hain? Aap ﷺ ne farmaaya ki dil Rahman ki do ungliyon ke beech hain, woh jaise chahe unhe pher deta hai."}, "tuzigh": {"en": "In Surah Aal-Imran this is the prayer of those “firmly grounded in knowledge.” The more they learn, the more humble they become, so they ask Allah never to let their hearts slip after He has guided them.", "hi": "Surah Aal-Imran mein yeh un logon ki dua hai jo “ilm mein pukhta” hain. Jitna woh seekhte hain, utna aajiz hote jaate hain, isliye Allah se maangte hain ki hidaayat ke baad unke dil kabhi na phislein."}, "ainni": {"en": "The Prophet ﷺ took Mu'adh (RA) by the hand and said, “O Mu'adh, by Allah, I love you.” Then he advised him never to leave saying this dua at the end of every prayer. It was a gift given with love.", "hi": "Nabi ﷺ ne Muaz (RA) ka haath pakda aur farmaaya, “Aye Muaz, Allah ki qasam, main tumse mohabbat karta hoon.” Phir naseehat ki ki har namaaz ke baad yeh dua kabhi na chhodna. Yeh mohabbat ke saath diya gaya tohfa tha."}, "awzini": {"en": "Sulayman (AS) was marching with his army when he heard an ant warn the others to hide so they would not be crushed. He smiled at her words, and instead of feeling proud of his power, he turned to Allah in gratitude with this dua.", "hi": "Sulaiman (AS) apne lashkar ke saath ja rahe the ki unhone ek cheenti ko doosri cheentiyon se kehte suna ki apne ghar mein chhup jaao, kahin kuchle na jaao. Woh uski baat par muskuraaye, aur apni taaqat par fakhr karne ke bajaaye shukr ke saath Allah se yeh dua ki."}, "janna": {"en": "A man told the Prophet ﷺ that he could not make long, beautiful duas like him or Mu'adh. He simply asked for Paradise and refuge from the Fire. The Prophet ﷺ smiled and said that their own duas revolve around the very same thing.", "hi": "Ek shakhs ne Nabi ﷺ se kaha ki main Aap ﷺ ya Muaz ki tarah lambi aur khoobsoorat duaayein nahi kar paata. Main bas jannat maangta hoon aur jahannum se panaah. Nabi ﷺ ne farmaaya ki humari duaayein bhi isi ke gird ghoomti hain."}, "huda": {"en": "Ibn Mas'ud (RA) reported that the Prophet ﷺ used to say this. In four words it covers a whole life: knowing the right path, fearing Allah, keeping yourself pure, and needing no one but Him.", "hi": "Ibn Masood (RA) bataate hain ki Nabi ﷺ yeh dua padhte the. Chaar lafzon mein poori zindagi aa jaati hai: sahi raasta jaanna, Allah se darna, khud ko paak rakhna, aur uske siwa kisi ka mohtaaj na hona."}, "akhlaq": {"en": "This is part of the long dua the Prophet ﷺ said when he stood for the night prayer. Even he, who was described as having the greatest character, asked Allah to guide him to the best of it.", "hi": "Yeh us lambi dua ka hissa hai jo Nabi ﷺ raat ki namaaz shuru karte waqt padhte the. Jinke akhlaaq ko sabse azeem kaha gaya, woh bhi Allah se behtareen akhlaaq ki rehnumaai maangte the."}, "ghill": {"en": "Surah Al-Hashr praises three groups: those who migrated, those who welcomed them in Madinah, and everyone who came after. The later believers are described by this dua: they pray for those before them and ask for hearts free of resentment.", "hi": "Surah Al-Hashr teen giroh ki taareef karti hai: hijrat karne wale, Madina mein unhe gale lagaane wale, aur unke baad aane wale sab log. Baad walon ki pehchaan yeh dua hai: woh pehle walon ke liye dua karte hain aur aise dil maangte hain jismein koi keena na ho."}, "taawwudh": {"en": "Two men were arguing near the Prophet ﷺ, and one became so angry that his face turned red. The Prophet ﷺ said he knew a phrase that would make the anger leave him if he said it, and then he taught these words.", "hi": "Nabi ﷺ ke paas do aadmi jhagad rahe the, aur ek ko itna gussa aaya ki uska chehra laal ho gaya. Nabi ﷺ ne farmaaya ki main ek aisa jumla jaanta hoon jise agar yeh keh de toh iska gussa chala jaaye, aur phir yeh alfaaz sikhaaye."}, "sabr": {"en": "Talut's small army faced the giant Jalut and his huge forces. Many lost heart, but the believers said, “How often has a small group overcome a large one by Allah's permission,” and prayed these words. Young Dawud (AS) then defeated Jalut.", "hi": "Taloot ka chhota sa lashkar Jaloot aur uski badi fauj ke saamne tha. Bahut se log himmat haar gaye, lekin imaan walon ne kaha, “Kitni hi baar chhoti jamaat Allah ke hukm se badi jamaat par ghaalib aayi hai,” aur yeh dua ki. Phir naujawaan Dawood (AS) ne Jaloot ko haraaya."}, "musiba": {"en": "When her husband Abu Salamah died, Umm Salamah (RA) remembered the Prophet ﷺ teaching this dua. She wondered who could ever be better than Abu Salamah, but she said it anyway. Allah replaced him with the Prophet ﷺ himself, who later married her.", "hi": "Jab unke shauhar Abu Salamah ka inteqaal hua, toh Umm Salamah (RA) ko Nabi ﷺ ki sikhaayi yeh dua yaad aayi. Unhone socha ki Abu Salamah se behtar kaun ho sakta hai, phir bhi unhone yeh dua padhi. Allah ne unhe Nabi ﷺ se behtar badla diya, jinse baad mein unka nikah hua."}, "nawm": {"en": "Hudhayfah (RA) reported that when the Prophet ﷺ lay down to sleep, he said these words, and on waking he thanked Allah for giving life back after “death.” Each night's sleep is a small rehearsal for our return to Allah.", "hi": "Huzaifa (RA) bataate hain ki Nabi ﷺ sote waqt yeh alfaaz kehte, aur jaagne par Allah ka shukr ada karte ki usne “maut” ke baad zindagi lautaayi. Har raat ki neend Allah ki taraf laut jaane ki ek chhoti si yaad hai."}, "manzil": {"en": "After the great flood, Allah told Nuh (AS) to say this as he and the believers settled on the ark and looked for a place to land. It is a dua for anyone starting over in a new home or a new city.", "hi": "Bade toofaan ke baad Allah ne Nuh (AS) ko hukm diya ki jab woh aur imaan wale kashti par sawaar hon aur utarne ki jagah talaash karein, toh yeh kahein. Naye ghar ya naye shehar mein nayi shuruaat karne wale har shakhs ke liye yeh dua hai."}, "salah": {"en": "Ibrahim (AS) left his wife Hajar and baby Isma'il in the empty valley of Makkah by Allah's command. Standing there, he made a series of duas, and this was one of them: that he and his children would always keep up the prayer.", "hi": "Ibrahim (AS) ne Allah ke hukm se apni biwi Hajra aur nanhe Ismail ko Makkah ki sunsaan waadi mein chhoda. Wahan khade ho kar unhone kai duaayein ki, aur yeh unmein se ek thi: ki woh aur unki aulaad hamesha namaaz qaayam rakhein."}, "tawakkaltu": {"en": "The Prophet ﷺ said that when a person says this while leaving home, it is said to them: “You are guided, you are taken care of, and you are protected,” and the devil turns away from them.", "hi": "Nabi ﷺ ne farmaaya ki jab koi ghar se nikalte waqt yeh padhta hai, toh us se kaha jaata hai: “Tumhe hidaayat mil gayi, tumhaara kaam ho gaya, aur tum mehfooz ho gaye,” aur shaitaan us se door ho jaata hai."}, "tuakhidhna": {"en": "These are the closing words of Surah Al-Baqarah, given to the Prophet ﷺ on the night of the Mi‘raj. He said that whoever recites the last two verses of Al-Baqarah at night, they will be enough for him.", "hi": "Yeh Surah Al-Baqarah ke aakhri alfaaz hain, jo Nabi ﷺ ko Mi‘raj ki raat ata kiye gaye. Aap ﷺ ne farmaaya ki jo raat ko Al-Baqarah ki aakhri do aayatein padhe, woh uske liye kaafi hain."}, "hayy": {"en": "Anas (RA) said that whenever something weighed heavily on the Prophet ﷺ, he would say these words. Two of Allah's greatest names, then one plea: Your mercy.", "hi": "Anas (RA) kehte hain ki jab bhi Nabi ﷺ par koi baat bhaari padti, toh Aap ﷺ yeh alfaaz kehte. Allah ke do azeem naam, aur phir ek hi guzaarish: Teri rehmat."}, "karb": {"en": "Ibn Abbas (RA) reported that the Prophet ﷺ used to say this at times of great distress. It asks for nothing directly. It simply remembers how great Allah is, and the problem shrinks beside Him.", "hi": "Ibn Abbas (RA) bataate hain ki Nabi ﷺ sakht pareshaani ke waqt yeh padhte the. Ismein seedha kuch maanga nahi jaata. Bas Allah ki azmat yaad ki jaati hai, aur uske saamne pareshaani chhoti ho jaati hai."}, "rahmataka": {"en": "The Prophet ﷺ called these the words of the distressed person. When life feels too heavy to manage, this dua admits the truth: on our own we cannot hold it together, so we ask Allah not to leave us alone for a single moment.", "hi": "Nabi ﷺ ne ise pareshaan shakhs ki dua kaha. Jab zindagi sambhaalna bhaari lage, yeh dua sach maan leti hai: hum akele kuch nahi sambhaal sakte, isliye Allah se maangte hain ki ek pal ke liye bhi humein akela na chhode."}, "hasbi": {"en": "These are the very last words of Surah At-Tawbah. After describing how deeply the Prophet ﷺ cared for his people, Allah tells him: if they turn away, say “Allah is enough for me.” It is the answer for every time people let you down.", "hi": "Yeh Surah At-Tawbah ke bilkul aakhri alfaaz hain. Nabi ﷺ ki apni ummat ke liye fikr bayaan karne ke baad Allah farmaata hai: agar log munh pher lein, toh kaho “Allah mere liye kaafi hai.” Jab bhi log saath chhod dein, yahi jawaab hai."}, "ufawwid": {"en": "A believing man from Pharaoh's own family hid his faith for years. When he finally spoke up for Musa (AS) in Pharaoh's court, he knew it could cost him his life. He ended his speech with these words, and Allah protected him from their plots.", "hi": "Firaun ke apne khaandaan ka ek imaan wala shakhs saalon tak apna imaan chhupaata raha. Jab aakhir usne Firaun ke darbaar mein Musa (AS) ke haq mein baat ki, toh use pata tha ki jaan ja sakti hai. Usne apni baat in alfaaz par khatam ki, aur Allah ne use unki saazishon se bacha liya."}, "ayyub": {"en": "Ayyub (AS) lost his wealth, his children and his health, and suffered for years without complaining. When he finally called out, he did not even ask for anything. He only described his pain and Allah's mercy. Allah healed him and returned his family to him, and more.", "hi": "Ayyub (AS) ka maal, aulaad aur sehat sab chala gaya, aur woh saalon bina shikaayat ke takleef sehte rahe. Jab aakhir unhone pukaara, toh kuch maanga bhi nahi. Bas apna dard aur Allah ki rehmat bayaan ki. Allah ne unhe shifa di aur unka ghar-parivaar, balki usse zyada, lauta diya."}, "asalullah": {"en": "The Prophet ﷺ said that whoever visits a sick person whose time has not yet come and says this seven times beside them, Allah will heal that person.", "hi": "Nabi ﷺ ne farmaaya ki jo kisi aise beemaar ki ayaadat kare jiski maut ka waqt na aaya ho, aur uske paas saat baar yeh kahe, toh Allah use shifa de deta hai."}, "qudra": {"en": "Uthman ibn Abi al-‘As (RA) told the Prophet ﷺ about a pain he had felt in his body since accepting Islam. The Prophet ﷺ told him to place his hand on the painful spot and say these words. Uthman said he did, and Allah removed the pain.", "hi": "Usman bin Abil-Aas (RA) ne Nabi ﷺ ko ek dard ke baare mein bataaya jo Islam laane ke waqt se unke jism mein tha. Nabi ﷺ ne farmaaya ki dard wali jagah par haath rakho aur yeh alfaaz kaho. Usman (RA) kehte hain ki unhone aisa kiya aur Allah ne dard door kar diya."}, "afini": {"en": "Abdur-Rahman, son of the companion Abu Bakrah, heard his father repeat this three times every morning and evening and asked why. Abu Bakrah said he had heard the Prophet ﷺ say it, and he loved to follow his way.", "hi": "Sahaabi Abu Bakrah (RA) ke bete Abdur-Rahman ne apne waalid ko har subah aur shaam teen baar yeh padhte suna aur wajah poochi. Abu Bakrah ne kaha ki maine Nabi ﷺ ko yeh padhte suna, aur mujhe Aap ﷺ ke tareeqe par chalna pasand hai."}, "afwafiya": {"en": "Ibn Umar (RA) said the Prophet ﷺ never left saying this in the morning and evening. He also said that after certainty of faith, no one has been given anything better than well-being.", "hi": "Ibn Umar (RA) kehte hain ki Nabi ﷺ subah aur shaam yeh dua kabhi nahi chhodte the. Aap ﷺ ne yeh bhi farmaaya ki imaan ke yaqeen ke baad kisi ko aafiyat se behtar koi cheez nahi di gayi."}, "afuww": {"en": "Aisha (RA) asked the Prophet ﷺ what she should say if she knew which night was Laylat al-Qadr. Out of all the things she could have asked for, he taught her this one short dua for pardon.", "hi": "Aisha (RA) ne Nabi ﷺ se poocha ki agar mujhe pata chal jaaye ki kaunsi raat Shab-e-Qadr hai, toh main kya kahoon? Itni saari cheezon mein se Aap ﷺ ne unhe maafi ki yeh chhoti si dua sikhaayi."}, "tubalayya": {"en": "Ibn Umar (RA) said that in a single sitting they would count the Prophet ﷺ saying this a hundred times. If the best of creation asked for forgiveness so often, we need it even more.", "hi": "Ibn Umar (RA) kehte hain ki ek hi majlis mein hum Nabi ﷺ ko sau baar yeh kehte ginte the. Jab sabse behtareen insaan itni baar maafi maangte the, toh humein iski kahin zyada zaroorat hai."}, "qini": {"en": "Hafsah (RA), wife of the Prophet ﷺ, said that when he wanted to sleep, he placed his right hand under his cheek and said this three times. Lying down each night becomes a reminder of rising on the Last Day.", "hi": "Nabi ﷺ ki zauja Hafsa (RA) bataati hain ki jab Aap ﷺ sona chahte, toh apna daayaan haath gaal ke neeche rakhte aur teen baar yeh kehte. Har raat letna qayaamat ke din uthne ki yaad ban jaata hai."}, "wadatu": {"en": "The Prophet ﷺ taught that before getting into bed, you should dust it off three times, because you do not know what came onto it after you left, and then say these words.", "hi": "Nabi ﷺ ne sikhaaya ki bistar par jaane se pehle use teen baar jhaad lo, kyunki tumhe nahi pata ki tumhare jaane ke baad us par kya aaya, aur phir yeh alfaaz kaho."}, "bara": {"en": "The Prophet ﷺ told al-Bara’ ibn ‘Azib (RA) to make wudu before bed, lie on his right side and say these as his very last words. If he died that night, he would die on the natural faith. When al-Bara’ repeated it back, he said “Your Messenger,” and the Prophet ﷺ gently corrected him to “Your Prophet.”", "hi": "Nabi ﷺ ne Bara’ bin Aazib (RA) se farmaaya ki sone se pehle wuzu karo, daayein karwat leto aur aakhri alfaaz yeh kaho. Agar usi raat maut aa gayi toh fitrat par maroge. Jab Bara’ ne dohraaya toh “Tere Rasool” kaha, aur Nabi ﷺ ne pyaar se sahi karwaaya: “Tere Nabi.”"}, "ahyana": {"en": "Hudhayfah (RA) reported that the Prophet ﷺ said this every morning as he woke. The first words of the day are thanks for simply being alive again.", "hi": "Huzaifa (RA) bataate hain ki Nabi ﷺ har subah jaagte hi yeh kehte the. Din ke pehle alfaaz bas is baat ka shukr hain ki hum phir se zinda hain."}, "ibrahim41": {"en": "Ibrahim (AS) made this dua in old age, near the House he had built in Makkah. After a lifetime of prayers for his children and his city, he ended by asking forgiveness for himself, his parents and every believer.", "hi": "Ibrahim (AS) ne yeh dua budhaape mein ki, Makkah mein us ghar ke paas jo unhone banaaya tha. Apni aulaad aur shehar ke liye zindagi bhar ki duaaon ke baad, unhone apne, apne waalidain aur har imaan wale ke liye maafi maangi."}, "nuh28": {"en": "Nuh (AS) called his people to Allah for 950 years, night and day, in public and in private. Few believed. At the end of the surah named after him, he prays for his parents, his home and every believer who would ever come.", "hi": "Nuh (AS) ne 950 saal tak din raat, khule aur chhup kar apni qaum ko Allah ki taraf bulaaya. Bahut kam imaan laaye. Unke naam wali surah ke aakhir mein woh apne waalidain, apne ghar aur aane wale har imaan wale ke liye dua karte hain."}, "ahqaf": {"en": "This verse begins by remembering the pain a mother bears in pregnancy and birth. Then it describes a person who reaches full strength at forty and turns back to Allah with this dua, thinking of the parents behind him and the children ahead.", "hi": "Yeh aayat us takleef ko yaad karke shuru hoti hai jo maa hamal aur paidaaish mein uthaati hai. Phir us insaan ka zikr hai jo chaalees saal ki umr mein poori quwwat par pahunch kar Allah ki taraf lautta hai aur yeh dua karta hai, peeche waalidain aur aage aulaad ko yaad karte hue."}, "fardan": {"en": "Zakariyya (AS) was very old, with white hair and a wife who had never conceived. He still called on Allah quietly with this dua. Allah answered: “We responded to him and gave him Yahya, and made his wife able to bear a child.”", "hi": "Zakariyya (AS) bahut boodhe the, safed baal the aur unki biwi ke kabhi aulaad nahi hui thi. Phir bhi unhone chupke se Allah ko is dua ke saath pukaara. Allah ne farmaaya: “Humne uski dua qubool ki, use Yahya ata kiya aur uski biwi ko aulaad ke qaabil bana diya.”"}, "salihin": {"en": "Ibrahim (AS) left his homeland after his people tried to burn him, with no children and his whole life behind him. He made this short dua, and Allah gave him the good news of a patient, forbearing son, Isma‘il (AS).", "hi": "Jab Ibrahim (AS) ki qaum ne unhe jalaane ki koshish ki, toh woh apna watan chhod kar nikle, be-aulaad aur poori zindagi peeche chhod kar. Unhone yeh chhoti si dua ki, aur Allah ne unhe ek burdbaar bete, Ismail (AS), ki khushkhabri di."}, "imran": {"en": "The wife of ‘Imran made this dua while pregnant, giving her unborn child to Allah's service. Allah accepted the child with a beautiful acceptance. She gave birth to Maryam, mother of ‘Isa (AS).", "hi": "Imran ki biwi ne hamal ke dauraan yeh dua ki aur apne aane wale bachche ko Allah ki khidmat ke liye waqf kar diya. Allah ne us bachchi ko behtareen tareeqe se qubool kiya. Unke yahan Maryam paida huin, jo Isa (AS) ki waalida hain."}, "ueedh": {"en": "The Prophet ﷺ would say this over his grandsons Hasan and Husayn (RA). He told the companions that Ibrahim (AS) used to say the same for his own sons, Isma‘il and Ishaq.", "hi": "Nabi ﷺ apne nawaason Hasan aur Husain (RA) par yeh padhte the. Aap ﷺ ne sahaaba ko bataaya ki Ibrahim (AS) bhi apne beton Ismail aur Ishaq ke liye yahi padhte the."}, "barakallah": {"en": "When someone got married, the Prophet ﷺ congratulated them with these words instead of the customs of the time. It is the sunnah way to congratulate a bride and groom, and a beautiful dua for your own marriage.", "hi": "Jab kisi ki shaadi hoti, toh Nabi ﷺ us zamaane ke riwaajon ke bajaaye in alfaaz se mubaarakbaad dete. Dulha-dulhan ko mubaarakbaad dene ka yahi sunnat tareeqa hai, aur apni shaadi ke liye bhi ek khoobsoorat dua."}, "razaqna": {"en": "The disciples asked ‘Isa (AS) whether his Lord could send down a table spread with food from the sky. ‘Isa prayed for it, ending with these words. Allah sent it down as a sign.", "hi": "Hawaariyon ne Isa (AS) se poocha ki kya aapka Rab aasmaan se khaane ka dastarkhwaan utaar sakta hai? Isa (AS) ne iske liye dua ki aur in alfaaz par khatam ki. Allah ne use ek nishaani ke taur par utaar diya."}, "fadl": {"en": "The Prophet ﷺ taught that on entering the masjid we ask Allah for mercy, and on leaving we ask for His bounty. The Qur'an says: when the prayer is over, go out into the land and seek Allah's bounty. Prayer first, then work.", "hi": "Nabi ﷺ ne sikhaaya ki masjid mein daakhil hote waqt Allah se rehmat maango, aur nikalte waqt uska fazl. Qur'an kehta hai: jab namaaz ho jaaye toh zameen mein phail jaao aur Allah ka fazl talaash karo. Pehle namaaz, phir kaam."}, "infani": {"en": "Abu Hurayrah (RA) reported that the Prophet ﷺ made this dua. It asks for knowledge three ways: to use what you already know, to learn only what is useful, and to keep growing.", "hi": "Abu Huraira (RA) bataate hain ki Nabi ﷺ yeh dua karte the. Ismein ilm teen tarah maanga gaya hai: jo pehle se aata hai uska faayda, sirf kaam ki cheez seekhna, aur aage badhte rehna."}, "ilmla": {"en": "Zayd ibn Arqam (RA) said he taught his students exactly what the Prophet ﷺ used to say, and this was among it. Four dangers in one breath: empty learning, a hard heart, endless wanting, and unanswered prayer.", "hi": "Zaid bin Arqam (RA) kehte the ki main tumhe wahi sikhaata hoon jo Nabi ﷺ kehte the, aur yeh unmein se thi. Ek saans mein chaar khatre: bekaar ilm, sakht dil, kabhi na khatam hone waali chaahat, aur qubool na hone waali dua."}, "kursi": {"en": "Abu Hurayrah (RA) was guarding the charity food when a thief came three nights in a row. On the third night, the thief said: let me go and I will teach you words that will protect you. Recite Ayat al-Kursi before sleep and a guardian from Allah will stay with you until morning. The Prophet ﷺ said: he told you the truth, though he is a liar. That was Shaytan.", "hi": "Abu Huraira (RA) sadqe ke khaane ki nigraani kar rahe the ki teen raat lagaataar ek chor aaya. Teesri raat chor ne kaha: mujhe chhod do, main tumhe aise alfaaz sikhaata hoon jo tumhari hifaazat karenge. Sone se pehle Ayat-ul-Kursi padho, subah tak Allah ki taraf se ek muhaafiz tumhare saath rahega. Nabi ﷺ ne farmaaya: usne sach kaha, haalaanki woh jhoota hai. Woh shaitaan tha."}, "balad": {"en": "Ibrahim (AS) made this dua for Makkah when it was an empty, dry valley with no water and no crops. Today it is the safest city on earth and fruit from every land reaches it. You can make it for your own home and city.", "hi": "Ibrahim (AS) ne yeh dua Makkah ke liye tab ki jab woh ek sookhi, khaali waadi thi, na paani na kheti. Aaj woh duniya ka sabse mehfooz shehar hai aur har mulk ke phal wahan pahunchte hain. Aap yeh dua apne ghar aur shehar ke liye bhi kar sakte hain."}, "safar2": {"en": "Ibn Umar (RA) described how the Prophet ﷺ began every journey: mounting his camel, saying Allahu Akbar three times, reciting “Subhanal-ladhi sakhkhara lana hadha,” and then this dua. It trusts Allah with both the road ahead and the family left at home.", "hi": "Ibn Umar (RA) ne bataaya ki Nabi ﷺ har safar kaise shuru karte the: oont par sawaar ho kar teen baar Allahu Akbar kehte, “Subhanal-ladhi sakhkhara lana hadha” padhte, aur phir yeh dua. Ismein aage ka raasta aur peeche ghar waale, dono Allah ke supurd kiye jaate hain."}, "majraha": {"en": "As the flood began, Nuh (AS) told the believers to board the ark with these words. Waves rose like mountains around them, and the ship carried them safely until it came to rest on Mount Judi.", "hi": "Jab toofaan shuru hua, Nuh (AS) ne imaan walon se kaha ki in alfaaz ke saath kashti mein sawaar ho jaao. Unke chaaron taraf pahaad jaisi lehrein uthin, aur kashti unhe hifaazat se le chali yahan tak ki Judi pahaad par ja thehri."}, "astawdi": {"en": "When the Prophet ﷺ said goodbye to someone setting out on a journey, he would take their hand and not let go until they did, then say these words. A gentle way to send off someone you love.", "hi": "Jab Nabi ﷺ kisi safar par jaane wale ko rukhsat karte, toh uska haath pakadte aur tab tak na chhodte jab tak woh khud na chhod de, phir yeh alfaaz kehte. Kisi pyaare ko rukhsat karne ka ek narm tareeqa."}, "raditu": {"en": "The Prophet ﷺ said that whoever says this three times in the morning and evening, Allah has promised to please them on the Day of Judgement. Say you are pleased with Allah, and He will make sure you are pleased.", "hi": "Nabi ﷺ ne farmaaya ki jo subah aur shaam teen baar yeh kahe, Allah ne waada kiya hai ki qayaamat ke din use raazi kar dega. Tum kaho ki tum Allah se raazi ho, aur woh tumhe raazi kar dega."}, "ahsin": {"en": "Ibn Mas‘ud (RA) reported that the Prophet ﷺ used to say this. Some scholars mention it as a dua to say when looking in the mirror: thanking Allah for your face, and asking for a heart to match.", "hi": "Ibn Masood (RA) bataate hain ki Nabi ﷺ yeh dua karte the. Kuch ulama ise aaina dekhte waqt padhne ki dua bataate hain: apne chehre par Allah ka shukr, aur waisa hi achha dil maangna."}, "munkarat": {"en": "Qutbah ibn Malik (RA) reported that the Prophet ﷺ used to say this. It guards the three places where a person goes wrong: how we treat people, what we do, and what we crave.", "hi": "Qutbah bin Maalik (RA) bataate hain ki Nabi ﷺ yeh dua karte the. Yeh un teen jagahon ki hifaazat karti hai jahan insaan bhatakta hai: logon se sulook, apne kaam, aur apni khwaahishein."}, "haqq": {"en": "‘Ammar ibn Yasir (RA) once led a noticeably short prayer. When people questioned it, he said he had made a dua in it that the Prophet ﷺ used to make. This is part of that dua. It asks for balance in the moments that test us most.", "hi": "Ammar bin Yasir (RA) ne ek baar kaafi chhoti namaaz padhaayi. Jab logon ne sawaal kiya, toh unhone kaha ki maine ismein woh dua ki jo Nabi ﷺ kiya karte the. Yeh usi dua ka hissa hai. Ismein un lamhon mein santulan maanga gaya hai jo humein sabse zyada aazmaate hain."}, "hubb": {"en": "The Prophet ﷺ said this was among the duas of Prophet Dawud (AS). Dawud used to ask Allah to make His love dearer to him than himself, his family and cool water.", "hi": "Nabi ﷺ ne farmaaya ki yeh Nabi Dawood (AS) ki duaaon mein se thi. Dawood (AS) Allah se maangte the ki Teri mohabbat mujhe apni jaan, apne ghar waalon aur thande paani se bhi zyada pyaari ho jaaye."}, "habbib": {"en": "After the painful day of Uhud, when many companions had been killed, the Prophet ﷺ lined his companions up and praised Allah, then made a long dua. This is part of it. Even in defeat, his first request was for faith that the heart would love.", "hi": "Uhud ke takleef bhare din ke baad, jab bahut se sahaaba shaheed ho chuke the, Nabi ﷺ ne sahaaba ki saffein banwaayin, Allah ki taareef ki aur ek lambi dua ki. Yeh usi ka hissa hai. Haar ke din bhi Aap ﷺ ki pehli maang aisa imaan tha jisse dil mohabbat kare."}, "abrar": {"en": "Ibn Abbas (RA) stayed one night at the home of his aunt Maymunah, the Prophet's ﷺ wife. He saw the Prophet ﷺ wake in the night, look up at the sky and recite the last verses of Aal-Imran, including this dua, before standing to pray.", "hi": "Ibn Abbas (RA) ek raat apni khaala Maimoona (RA), Nabi ﷺ ki zauja, ke ghar ruke. Unhone dekha ki Nabi ﷺ raat ko jaage, aasmaan ki taraf dekha aur Aal-Imran ki aakhri aayatein padhin, jinmein yeh dua hai, phir namaaz ke liye khade hue."}, "baid": {"en": "Abu Hurayrah (RA) noticed the Prophet ﷺ stayed silent for a moment between the opening takbir and the recitation. He asked what he said in that silence, and the Prophet ﷺ taught him this.", "hi": "Abu Huraira (RA) ne dekha ki Nabi ﷺ takbeer-e-tahreema aur qiraat ke beech thodi der khaamosh rehte hain. Unhone poocha ki us khaamoshi mein Aap kya padhte hain, toh Nabi ﷺ ne unhe yeh sikhaaya."}, "abubakr": {"en": "Abu Bakr (RA), the closest companion of the Prophet ﷺ, asked him for a dua to say in his prayer. Even for Abu Bakr, the best of this ummah after the prophets, the Prophet ﷺ chose words that begin: I have wronged myself greatly.", "hi": "Abu Bakr (RA), jo Nabi ﷺ ke sabse qareebi saathi the, ne namaaz mein padhne ke liye dua maangi. Abu Bakr jaise shakhs ke liye bhi, jo nabiyon ke baad is ummat ke sabse behtar insaan hain, Nabi ﷺ ne aise alfaaz chune jo yahan se shuru hote hain: maine apni jaan par bahut zulm kiya."}, "adhan": {"en": "Jabir (RA) reported that the Prophet ﷺ said: whoever says this after hearing the adhan will be granted my intercession on the Day of Resurrection. A few seconds after every adhan, five times a day.", "hi": "Jabir (RA) bataate hain ki Nabi ﷺ ne farmaaya: jo azaan sun kar yeh dua padhe, qayaamat ke din use meri shafaa‘at naseeb hogi. Din mein paanch baar, har azaan ke baad bas kuch second."}, "maasbaha": {"en": "The Prophet ﷺ said that whoever says this in the morning has given thanks for that whole day, and whoever says it in the evening has given thanks for that night.", "hi": "Nabi ﷺ ne farmaaya ki jo subah yeh kahe usne poore din ka shukr ada kar diya, aur jo shaam ko kahe usne poori raat ka shukr ada kar diya."}, "istikhara": {"en": "Jabir (RA) said the Prophet ﷺ taught them istikhara for every decision, the way he taught them a surah of the Qur'an. Pray two rak‘ahs outside the obligatory prayer, then say this dua, naming your matter where it says “this matter.” Then go ahead and trust where Allah leads.", "hi": "Jabir (RA) kehte hain ki Nabi ﷺ humein har faisle ke liye istikhara aise sikhaate the jaise Qur'an ki koi surah sikhaate. Farz ke ilaawa do rak‘at namaaz padho, phir yeh dua karo aur “is kaam” ki jagah apna maamla zehan mein rakho. Phir aage badho aur bharosa rakho ki Allah jidhar le jaaye wahi behtar hai."}, "sawaa": {"en": "Musa (AS) fled Egypt alone, with no map, no guide and no plan, heading toward Madyan. As he set off into the desert he said these words. Allah led him safely there, to a new home, a wife, and later, prophethood.", "hi": "Musa (AS) akele Misr se nikle, na naqsha, na rehnuma, na koi mansooba, aur Madyan ki taraf chal pade. Registaan mein qadam rakhte hue unhone yeh alfaaz kahe. Allah ne unhe hifaazat se wahan pahunchaaya, naya ghar diya, biwi di, aur baad mein nubuwwat."}, "rushd": {"en": "When Husayn, the father of ‘Imran ibn Husayn (RA), accepted Islam, he asked the Prophet ﷺ what he should say. The Prophet ﷺ taught him these two short lines. The enemy we most need protection from is often our own self.", "hi": "Jab Imran bin Husain (RA) ke waalid Husain ne Islam qubool kiya, toh unhone Nabi ﷺ se poocha ki main kya kahoon? Nabi ﷺ ne unhe yeh do chhoti lines sikhaayin. Jis dushman se sabse zyada hifaazat chahiye, woh aksar humara apna nafs hota hai."}, "asiyah": {"en": "Asiyah was the wife of Pharaoh, living in the most powerful palace on earth. She believed in Allah and was tortured for it by her own husband. She asked for a house near Allah before a house in Paradise. Allah made her an example for all believers.", "hi": "Aasiya Firaun ki biwi thin, duniya ke sabse taaqatwar mahal mein rehti thin. Woh Allah par imaan laayin aur iski wajah se unke apne shauhar ne unhe takleefein di. Unhone jannat ke ghar se pehle Allah ke paas ghar maanga. Allah ne unhe saare imaan walon ke liye misaal bana diya."}, "warathah": {"en": "Ibrahim (AS) made this as part of a heartfelt series of duas after describing his Lord to his idol-worshipping father and people: the One who created me, guides me, feeds me, heals me when I am sick, and will give me life again.", "hi": "Ibrahim (AS) ne yeh dua duaaon ke ek silsile mein ki, jab unhone apne but-parast baap aur qaum ke saamne apne Rab ka taaruf karaaya: jisne mujhe paida kiya, woh mujhe raah dikhaata hai, khilaata hai, beemaar padoon toh shifa deta hai, aur mujhe dobaara zinda karega."}, "maghram": {"en": "Aisha (RA) noticed the Prophet ﷺ often asked for protection from debt in his prayer and asked why. He said that when a person falls into debt, he speaks and lies, and he promises and breaks his promise.", "hi": "Aisha (RA) ne dekha ki Nabi ﷺ namaaz mein aksar qarz se panaah maangte hain, toh wajah poochi. Aap ﷺ ne farmaaya ki jab insaan qarz mein phansta hai toh baat karta hai aur jhooth bolta hai, waada karta hai aur tod deta hai."}};

let SALAWAT = {"short": {"ar": "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ", "tl": "Allahumma salli ‘ala Muhammad.", "en": "O Allah, send blessings upon Muhammad.", "hi": "Aye Allah, Muhammad ﷺ par rehmat naazil farma.", "ref": "Short form of the salawat · Qur'an 33:56"}, "saw": {"ar": "صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ", "tl": "Sallallahu ‘alayhi wa sallam.", "en": "May Allah send blessings and peace upon him.", "hi": "Allah un par rehmat aur salaamati naazil farmaaye.", "ref": "Said whenever the Prophet ﷺ is mentioned"}, "aal": {"ar": "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ", "tl": "Allahumma salli ‘ala Muhammadin wa ‘ala ali Muhammad.", "en": "O Allah, send blessings upon Muhammad and the family of Muhammad.", "hi": "Aye Allah, Muhammad ﷺ aur unki aal par rehmat naazil farma.", "ref": "From the salawat in Sahih al-Bukhari 3370"}, "ibrahimi": {"ar": "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ ۝ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ ۝ إِنَّكَ حَمِيدٌ مَجِيدٌ", "tl": "Allahumma salli ‘ala Muhammadin wa ‘ala ali Muhammad, kama sallayta ‘ala Ibrahima wa ‘ala ali Ibrahim, innaka Hamidun Majid.", "en": "O Allah, send blessings upon Muhammad and the family of Muhammad, as You sent blessings upon Ibrahim and the family of Ibrahim. You are Praiseworthy, Glorious.", "hi": "Aye Allah, Muhammad ﷺ aur unki aal par rehmat naazil farma, jaise Tune Ibrahim (AS) aur unki aal par rehmat naazil farmaayi. Beshak Tu taareef wala, buzurgi wala hai.", "ref": "Darood Ibrahimi · Sahih al-Bukhari 3370"}, "azwaj": {"ar": "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَأَزْوَاجِهِ وَذُرِّيَّتِهِ", "tl": "Allahumma salli ‘ala Muhammadin wa azwajihi wa dhurriyyatih.", "en": "O Allah, send blessings upon Muhammad, his wives and his descendants.", "hi": "Aye Allah, Muhammad ﷺ, unki azwaaj aur unki aulaad par rehmat naazil farma.", "ref": "From the salawat in Sahih al-Bukhari 3369"}, "barik": {"ar": "اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ", "tl": "Allahumma barik ‘ala Muhammadin wa ‘ala ali Muhammad.", "en": "O Allah, send Your barakah upon Muhammad and the family of Muhammad.", "hi": "Aye Allah, Muhammad ﷺ aur unki aal par barkat naazil farma.", "ref": "From the salawat in Sahih al-Bukhari 3370"}, "abd": {"ar": "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ عَبْدِكَ وَرَسُولِكَ", "tl": "Allahumma salli ‘ala Muhammadin ‘abdika wa rasulik.", "en": "O Allah, send blessings upon Muhammad, Your servant and Your Messenger.", "hi": "Aye Allah, apne bande aur apne Rasool Muhammad ﷺ par rehmat naazil farma.", "ref": "From the salawat in Sahih al-Bukhari 6358"}, "ummi": {"ar": "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ النَّبِيِّ الْأُمِّيِّ وَعَلَى آلِ مُحَمَّدٍ", "tl": "Allahumma salli ‘ala Muhammadinin-nabiyyil-ummiyyi wa ‘ala ali Muhammad.", "en": "O Allah, send blessings upon Muhammad, the unlettered Prophet, and the family of Muhammad.", "hi": "Aye Allah, Nabi-e-Ummi Muhammad ﷺ aur unki aal par rehmat naazil farma.", "ref": "From the salawat in Sunan Abi Dawud 981"}, "sallim": {"ar": "اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ", "tl": "Allahumma salli wa sallim ‘ala nabiyyina Muhammad.", "en": "O Allah, send blessings and peace upon our Prophet Muhammad.", "hi": "Aye Allah, humare Nabi Muhammad ﷺ par rehmat aur salaamati naazil farma.", "ref": "Following Qur'an 33:56: send blessings and peace"}};
let OPENING = {"en": "Fadalah ibn ‘Ubayd (RA) said the Prophet ﷺ heard a man make dua in his prayer without praising Allah or sending blessings on the Prophet. He said, “This man was hasty.” Then he taught: when you make dua, begin by praising your Lord, then send blessings on the Prophet ﷺ, then ask for whatever you wish. He also said that whoever sends one blessing on him, Allah sends ten blessings on that person.", "hi": "Fazaalah bin Ubaid (RA) bataate hain ki Nabi ﷺ ne ek shakhs ko namaaz mein Allah ki taareef aur Nabi par darood ke baghair dua karte suna. Aap ﷺ ne farmaaya, “Isne jaldi ki.” Phir sikhaaya: jab dua karo toh pehle apne Rab ki taareef karo, phir Nabi ﷺ par darood bhejo, phir jo chaaho maango. Aap ﷺ ne yeh bhi farmaaya ki jo mujh par ek baar darood bhejta hai, Allah us par das rehmatein bhejta hai.", "ref": "Jami‘ at-Tirmidhi 3477 · Sahih Muslim 408"};

let GUIDE = {"exams": {"q": [{"a": {"en": "Begin your study in Allah's name", "hi": "Padhaai Allah ke naam se shuru karo"}, "d": {"en": "The very first revelation was “Read in the name of your Lord who created.”", "hi": "Sabse pehli wahi thi: “Apne Rab ke naam se padho jisne paida kiya.”"}, "ref": "Surah Al-‘Alaq 96:1", "url": "https://quran.com/96/1"}, {"a": {"en": "Ask Allah for more knowledge", "hi": "Allah se ilm mein izaafa maango"}, "d": {"en": "Allah taught the Prophet ﷺ to say: “My Lord, increase me in knowledge.”", "hi": "Allah ne Nabi ﷺ ko sikhaaya: “Rabbi zidni ‘ilma.”"}, "ref": "Surah Ta-Ha 20:114", "url": "https://quran.com/20/114"}, {"a": {"en": "Put in the effort; results are with Allah", "hi": "Mehnat poori karo, natija Allah par"}, "d": {"en": "A person gets nothing except what they strive for.", "hi": "Insaan ko wahi milta hai jiski woh koshish karta hai."}, "ref": "Surah An-Najm 53:39", "url": "https://quran.com/53/39"}, {"a": {"en": "Prepare, then rely on Allah", "hi": "Tayyari karo, phir Allah par bharosa"}, "d": {"en": "Once you have made up your mind, put your trust in Allah.", "hi": "Jab iraada kar lo, toh Allah par bharosa karo."}, "ref": "Surah Aal-Imran 3:159", "url": "https://quran.com/3/159"}], "h": [{"a": {"en": "Treat study as a path to Jannah", "hi": "Padhaai ko jannat ka raasta samjho"}, "d": {"en": "Whoever takes a path seeking knowledge, Allah makes easy for them a path to Paradise.", "hi": "Jo ilm ki talaash mein raasta chale, Allah uske liye jannat ka raasta aasaan kar deta hai."}, "ref": "Sahih Muslim 2699", "url": "https://sunnah.com/muslim:2699"}, {"a": {"en": "Tie your camel, then trust", "hi": "Pehle oont baandho, phir bharosa"}, "d": {"en": "A man asked whether to leave his camel untied and trust Allah. The Prophet ﷺ said: tie it, and trust.", "hi": "Ek shakhs ne poocha ki oont khula chhod kar bharosa karoon? Nabi ﷺ ne farmaaya: baandho, aur bharosa karo."}, "ref": "Jami‘ at-Tirmidhi 2517", "url": "https://sunnah.com/tirmidhi:2517"}, {"a": {"en": "Study a little every day", "hi": "Roz thoda thoda padho"}, "d": {"en": "The deeds most loved by Allah are the ones done consistently, even if small.", "hi": "Allah ko sabse pyaare woh amal hain jo lagaataar kiye jaayein, chahe thode hon."}, "ref": "Sahih al-Bukhari 6464", "url": "https://sunnah.com/bukhari:6464"}, {"a": {"en": "Don't waste your health and free time", "hi": "Sehat aur khaali waqt zaaya na karo"}, "d": {"en": "Two blessings many people lose out on: health and free time.", "hi": "Do nematein jinmein bahut log ghaate mein hain: sehat aur fursat."}, "ref": "Sahih al-Bukhari 6412", "url": "https://sunnah.com/bukhari:6412"}]}, "marriage": {"q": [{"a": {"en": "Remember marriage is built on love and mercy", "hi": "Yaad rakho, shaadi mohabbat aur rehmat par bani hai"}, "d": {"en": "Allah placed between spouses affection and mercy, as one of His signs.", "hi": "Allah ne miyan-biwi ke beech mohabbat aur rehmat rakhi, yeh uski nishaaniyon mein se hai."}, "ref": "Surah Ar-Rum 30:21", "url": "https://quran.com/30/21"}, {"a": {"en": "Live together with kindness, even on hard days", "hi": "Mushkil dinon mein bhi achhe sulook se raho"}, "d": {"en": "Live with them in kindness. If you dislike something, Allah may have put much good in it.", "hi": "Unke saath bhalaai se raho. Agar koi baat napasand ho, toh ho sakta hai Allah ne usmein bahut bhalaai rakhi ho."}, "ref": "Surah An-Nisa 4:19", "url": "https://quran.com/4/19"}, {"a": {"en": "Choose the best words in a disagreement", "hi": "Behas mein bhi behtareen alfaaz chuno"}, "d": {"en": "Tell My servants to say what is best, for Satan sows discord between people.", "hi": "Mere bandon se kaho ki woh baat kahein jo sabse achhi ho, shaitaan logon mein phoot daalta hai."}, "ref": "Surah Al-Isra 17:53", "url": "https://quran.com/17/53"}, {"a": {"en": "Answer harshness with goodness", "hi": "Sakhti ka jawaab bhalaai se do"}, "d": {"en": "Repel evil with what is better, and an enemy may become a close friend.", "hi": "Buraai ko behtar tareeqe se door karo, toh dushman bhi gehra dost ban sakta hai."}, "ref": "Surah Fussilat 41:34", "url": "https://quran.com/41/34"}, {"a": {"en": "Bring in a fair family mediator when stuck", "hi": "Atak jaao toh ghar ka koi insaaf-pasand saalis bulao"}, "d": {"en": "Appoint an arbiter from each family. If they want to reconcile, Allah will bring them together.", "hi": "Dono khaandaanon se ek ek saalis muqarrar karo. Agar woh sulah chahein toh Allah unmein mel karwa dega."}, "ref": "Surah An-Nisa 4:35", "url": "https://quran.com/4/35"}, {"a": {"en": "Never forget the good you shared", "hi": "Saath guzri bhalaai kabhi na bhoolo"}, "d": {"en": "Even at the hardest point, “do not forget graciousness between you.”", "hi": "Sabse mushkil waqt mein bhi: “aapas mein ehsaan ko na bhoolo.”"}, "ref": "Surah Al-Baqarah 2:237", "url": "https://quran.com/2/237"}], "h": [{"a": {"en": "Don't let one fault erase their good", "hi": "Ek kami ki wajah se saari achhaai mat bhoolo"}, "d": {"en": "A believer should not hate a believing spouse: if one trait displeases you, another will please you.", "hi": "Momin apni momina biwi se nafrat na kare: ek aadat bura lage toh doosri achhi lagegi."}, "ref": "Sahih Muslim 1469", "url": "https://sunnah.com/muslim:1469"}, {"a": {"en": "Be at your best with your own family", "hi": "Apne ghar waalon ke saath sabse achhe bano"}, "d": {"en": "The best of you are those who are best to their families, and I am the best of you to my family.", "hi": "Tum mein sabse behtar woh hai jo apne ghar waalon ke liye sabse behtar ho, aur main apne ghar waalon ke liye tum sab se behtar hoon."}, "ref": "Jami‘ at-Tirmidhi 3895", "url": "https://sunnah.com/tirmidhi:3895"}, {"a": {"en": "Hold back your anger", "hi": "Apna gussa roko"}, "d": {"en": "The strong one is not the wrestler, but the one who controls himself when angry.", "hi": "Taaqatwar woh nahi jo pachhaad de, balki woh hai jo gusse mein khud ko qaabu rakhe."}, "ref": "Sahih al-Bukhari 6114", "url": "https://sunnah.com/bukhari:6114"}, {"a": {"en": "Small kindness counts as charity", "hi": "Chhoti si mehrbaani bhi sadqa hai"}, "d": {"en": "Even the morsel you lift to your spouse's mouth is rewarded as charity.", "hi": "Biwi ke munh mein daala hua niwaala bhi sadqa hai."}, "ref": "Sahih al-Bukhari 56", "url": "https://sunnah.com/bukhari:56"}, {"a": {"en": "Help out at home", "hi": "Ghar ke kaam mein haath bataao"}, "d": {"en": "Aisha (RA) said the Prophet ﷺ used to serve his family at home, until the time of prayer came.", "hi": "Aisha (RA) ne farmaaya ki Nabi ﷺ ghar ke kaam-kaaj mein haath bataate the, yahan tak ki namaaz ka waqt ho jaata."}, "ref": "Sahih al-Bukhari 676", "url": "https://sunnah.com/bukhari:676"}]}, "rizq": {"q": [{"a": {"en": "Hold on to taqwa", "hi": "Taqwa ko thaame raho"}, "d": {"en": "Whoever is mindful of Allah, He makes a way out and provides from where they never expected.", "hi": "Jo Allah se darta hai, Allah uske liye raasta nikaalta hai aur wahan se rizq deta hai jahan ka gumaan bhi na ho."}, "ref": "Surah At-Talaq 65:2-3", "url": "https://quran.com/65/2-3"}, {"a": {"en": "Ask forgiveness often", "hi": "Kasrat se istighfaar karo"}, "d": {"en": "Ask your Lord's forgiveness; He sends rain and gives you wealth and children.", "hi": "Apne Rab se maafi maango; woh baarish bhejega aur maal aur aulaad dega."}, "ref": "Surah Nuh 71:10-12", "url": "https://quran.com/71/10-12"}, {"a": {"en": "Thank Allah for what you have", "hi": "Jo mila hai uska shukr karo"}, "d": {"en": "If you are grateful, I will surely give you more.", "hi": "Agar tum shukr karoge toh main tumhe aur zyada doonga."}, "ref": "Surah Ibrahim 14:7", "url": "https://quran.com/14/7"}, {"a": {"en": "Spend for Allah's sake", "hi": "Allah ki raah mein kharch karo"}, "d": {"en": "Whatever you spend, He will replace it, and He is the best of providers.", "hi": "Jo kuch tum kharch karte ho, woh uski jagah aur deta hai, aur woh sabse behtar rizq dene wala hai."}, "ref": "Surah Saba 34:39", "url": "https://quran.com/34/39"}], "h": [{"a": {"en": "Trust Allah like the birds do", "hi": "Parindon ki tarah Allah par bharosa karo"}, "d": {"en": "If you relied on Allah truly, He would provide for you as He provides for birds: they leave hungry and return full.", "hi": "Agar tum sachcha bharosa karo toh Allah tumhe parindon ki tarah rizq de: subah bhooke jaate hain, shaam ko pet bhar laut-te hain."}, "ref": "Jami‘ at-Tirmidhi 2344", "url": "https://sunnah.com/tirmidhi:2344"}, {"a": {"en": "Give charity; it doesn't reduce wealth", "hi": "Sadqa do, isse maal kam nahi hota"}, "d": {"en": "Charity never decreases wealth.", "hi": "Sadqa maal ko kabhi kam nahi karta."}, "ref": "Sahih Muslim 2588", "url": "https://sunnah.com/muslim:2588"}, {"a": {"en": "Keep ties with your relatives", "hi": "Rishtedaaron se taalluq jode raho"}, "d": {"en": "Whoever wants their provision expanded and life extended, let them keep family ties.", "hi": "Jo chahe ki uska rizq badhe aur umr lambi ho, woh rishte jode rakhe."}, "ref": "Sahih al-Bukhari 5986", "url": "https://sunnah.com/bukhari:5986"}, {"a": {"en": "Earn with your own hands", "hi": "Apne haath se kamaao"}, "d": {"en": "No one eats better food than what they earned with their own hands.", "hi": "Kisi ne apne haath ki kamaai se behtar khaana nahi khaaya."}, "ref": "Sahih al-Bukhari 2072", "url": "https://sunnah.com/bukhari:2072"}]}, "knowledge": {"q": [{"a": {"en": "Ask people who know", "hi": "Jaanne waalon se poochho"}, "d": {"en": "Ask the people of knowledge if you do not know.", "hi": "Agar tum nahi jaante toh ilm waalon se poochh lo."}, "ref": "Surah An-Nahl 16:43", "url": "https://quran.com/16/43"}, {"a": {"en": "Value learning", "hi": "Ilm ki qadr karo"}, "d": {"en": "Are those who know equal to those who do not?", "hi": "Kya jaanne wale aur na jaanne wale barabar ho sakte hain?"}, "ref": "Surah Az-Zumar 39:9", "url": "https://quran.com/39/9"}, {"a": {"en": "Know that knowledge raises you", "hi": "Jaano ki ilm darje buland karta hai"}, "d": {"en": "Allah raises in rank those who believe and those given knowledge.", "hi": "Allah imaan waalon aur ilm waalon ke darje buland karta hai."}, "ref": "Surah Al-Mujadila 58:11", "url": "https://quran.com/58/11"}, {"a": {"en": "Reflect on the Qur'an", "hi": "Qur'an par ghaur karo"}, "d": {"en": "Do they not reflect on the Qur'an?", "hi": "Kya woh Qur'an par ghaur nahi karte?"}, "ref": "Surah Muhammad 47:24", "url": "https://quran.com/47/24"}], "h": [{"a": {"en": "Walk the path of learning", "hi": "Ilm ki raah par chalo"}, "d": {"en": "Whoever takes a path seeking knowledge, Allah eases their path to Paradise.", "hi": "Jo ilm ki raah chale, Allah uske liye jannat ki raah aasaan kar deta hai."}, "ref": "Sahih Muslim 2699", "url": "https://sunnah.com/muslim:2699"}, {"a": {"en": "Learn the Qur'an and teach it", "hi": "Qur'an seekho aur sikhaao"}, "d": {"en": "The best of you are those who learn the Qur'an and teach it.", "hi": "Tum mein behtar woh hai jo Qur'an seekhe aur sikhaaye."}, "ref": "Sahih al-Bukhari 5027", "url": "https://sunnah.com/bukhari:5027"}, {"a": {"en": "Leave knowledge that lasts", "hi": "Aisa ilm chhodo jo baad mein bhi kaam aaye"}, "d": {"en": "When a person dies, their deeds stop except three, including knowledge that benefits others.", "hi": "Insaan ke marne par amal ruk jaate hain siwaye teen ke, unmein se ek faayda dene wala ilm hai."}, "ref": "Sahih Muslim 1631", "url": "https://sunnah.com/muslim:1631"}, {"a": {"en": "Ask Allah for understanding of the deen", "hi": "Allah se deen ki samajh maango"}, "d": {"en": "When Allah wants good for someone, He gives them understanding of the religion.", "hi": "Allah jiske saath bhalaai chahta hai, use deen ki samajh deta hai."}, "ref": "Sahih al-Bukhari 71", "url": "https://sunnah.com/bukhari:71"}]}, "daily": {"q": [{"a": {"en": "Remember Allah through the day", "hi": "Din bhar Allah ko yaad karo"}, "d": {"en": "Remember Me, and I will remember you.", "hi": "Tum mujhe yaad karo, main tumhe yaad karunga."}, "ref": "Surah Al-Baqarah 2:152", "url": "https://quran.com/2/152"}, {"a": {"en": "Ask Him for everything", "hi": "Har cheez usi se maango"}, "d": {"en": "Call upon Me; I will respond to you.", "hi": "Mujhe pukaaro, main tumhari sunoonga."}, "ref": "Surah Ghafir 40:60", "url": "https://quran.com/40/60"}, {"a": {"en": "Glorify Him morning and evening", "hi": "Subah shaam uski tasbeeh karo"}, "d": {"en": "Remember Allah often, and glorify Him morning and evening.", "hi": "Allah ko kasrat se yaad karo, aur subah shaam uski tasbeeh karo."}, "ref": "Surah Al-Ahzab 33:41-42", "url": "https://quran.com/33/41-42"}, {"a": {"en": "Find rest in remembrance", "hi": "Zikr mein sukoon dhoondo"}, "d": {"en": "Surely in the remembrance of Allah do hearts find rest.", "hi": "Beshak Allah ke zikr se hi dilon ko sukoon milta hai."}, "ref": "Surah Ar-Ra‘d 13:28", "url": "https://quran.com/13/28"}], "h": [{"a": {"en": "Think well of Allah", "hi": "Allah se achha gumaan rakho"}, "d": {"en": "Allah says: I am as My servant thinks of Me, and I am with him when he remembers Me.", "hi": "Allah farmaata hai: main apne bande ke gumaan ke mutaabiq hoon, aur jab woh mujhe yaad karta hai main uske saath hota hoon."}, "ref": "Sahih al-Bukhari 7405", "url": "https://sunnah.com/bukhari:7405"}, {"a": {"en": "Treat dua as worship", "hi": "Dua ko ibaadat samjho"}, "d": {"en": "Dua is worship.", "hi": "Dua hi ibaadat hai."}, "ref": "Jami‘ at-Tirmidhi 2969", "url": "https://sunnah.com/tirmidhi:2969"}, {"a": {"en": "Raise your hands with hope", "hi": "Ummeed ke saath haath uthao"}, "d": {"en": "Your Lord is too generous to return a servant's raised hands empty.", "hi": "Tumhara Rab itna kareem hai ki bande ke uthe hue haath khaali nahi lautaata."}, "ref": "Sunan Abi Dawud 1488", "url": "https://sunnah.com/abudawud:1488"}, {"a": {"en": "Don't give up on a dua", "hi": "Dua karna mat chhodo"}, "d": {"en": "Your dua is answered as long as you do not get impatient and say “I prayed and was not answered.”", "hi": "Dua qubool hoti hai jab tak tum jaldi na karo aur yeh na kaho ki maine dua ki par qubool na hui."}, "ref": "Sahih al-Bukhari 6340", "url": "https://sunnah.com/bukhari:6340"}]}, "anxiety": {"q": [{"a": {"en": "Know that ease comes with hardship", "hi": "Yaqeen rakho, mushkil ke saath aasaani hai"}, "d": {"en": "Indeed, with hardship comes ease. Indeed, with hardship comes ease.", "hi": "Beshak mushkil ke saath aasaani hai. Beshak mushkil ke saath aasaani hai."}, "ref": "Surah Ash-Sharh 94:5-6", "url": "https://quran.com/94/5-6"}, {"a": {"en": "Turn to dhikr for calm", "hi": "Sukoon ke liye zikr karo"}, "d": {"en": "Surely in the remembrance of Allah do hearts find rest.", "hi": "Allah ke zikr se hi dilon ko sukoon milta hai."}, "ref": "Surah Ar-Ra‘d 13:28", "url": "https://quran.com/13/28"}, {"a": {"en": "Remember you won't be given more than you can carry", "hi": "Yaad rakho, taaqat se zyada bojh nahi diya jaata"}, "d": {"en": "Allah does not burden a soul beyond what it can bear.", "hi": "Allah kisi jaan par uski taaqat se zyada bojh nahi daalta."}, "ref": "Surah Al-Baqarah 2:286", "url": "https://quran.com/2/286"}, {"a": {"en": "Lean on patience and prayer", "hi": "Sabr aur namaaz ka sahaara lo"}, "d": {"en": "Seek help through patience and prayer; Allah is with the patient.", "hi": "Sabr aur namaaz se madad lo; Allah sabr karne walon ke saath hai."}, "ref": "Surah Al-Baqarah 2:153", "url": "https://quran.com/2/153"}], "h": [{"a": {"en": "See the good in every state", "hi": "Har haal mein bhalaai dekho"}, "d": {"en": "The affair of the believer is amazing: in good times they thank Allah, in hard times they are patient, and both are good for them.", "hi": "Momin ka maamla ajeeb hai: achhe waqt mein shukr, bure waqt mein sabr, aur dono uske liye behtar hain."}, "ref": "Sahih Muslim 2999", "url": "https://sunnah.com/muslim:2999"}, {"a": {"en": "Know your pain is not wasted", "hi": "Jaano tumhara dard bekaar nahi"}, "d": {"en": "No worry, grief or hurt befalls a Muslim, even a thorn's prick, except that Allah removes some of their sins by it.", "hi": "Muslim ko koi fikr, gham ya takleef, yahan tak ki kaanta bhi chubhe, toh Allah uske gunaah mita deta hai."}, "ref": "Sahih al-Bukhari 5641", "url": "https://sunnah.com/bukhari:5641"}, {"a": {"en": "Look at those who have less", "hi": "Apne se kam waalon ko dekho"}, "d": {"en": "Look at those below you, not above you, so you don't belittle Allah's blessings on you.", "hi": "Apne se neeche waalon ko dekho, upar waalon ko nahi, taaki Allah ki nemat haqeer na lage."}, "ref": "Sahih Muslim 2963", "url": "https://sunnah.com/muslim:2963"}, {"a": {"en": "Trust what is written for you", "hi": "Jo likha hai us par bharosa rakho"}, "d": {"en": "If the whole world gathered to harm you, they could only harm you with what Allah had already written.", "hi": "Agar saari duniya tumhe nuqsaan pahunchaane ke liye jama ho jaaye, toh bhi utna hi nuqsaan hoga jitna Allah ne likha hai."}, "ref": "Jami‘ at-Tirmidhi 2516", "url": "https://sunnah.com/tirmidhi:2516"}]}, "evil": {"q": [{"a": {"en": "Seek refuge in the Lord of daybreak", "hi": "Subah ke Rab ki panaah lo"}, "d": {"en": "Say: I seek refuge in the Lord of daybreak, from the evil of what He created.", "hi": "Kaho: main subah ke Rab ki panaah maangta hoon, uski makhlooq ke shar se."}, "ref": "Surah Al-Falaq 113", "url": "https://quran.com/113"}, {"a": {"en": "Seek refuge from the whisperer", "hi": "Waswase daalne wale se panaah lo"}, "d": {"en": "Say: I seek refuge in the Lord of mankind, from the evil of the whisperer who withdraws.", "hi": "Kaho: main insaanon ke Rab ki panaah maangta hoon, chhup kar waswasa daalne wale ke shar se."}, "ref": "Surah An-Nas 114", "url": "https://quran.com/114"}, {"a": {"en": "Remember Satan's plotting is weak", "hi": "Yaad rakho shaitaan ki chaal kamzor hai"}, "d": {"en": "Indeed, the plot of Satan is ever weak.", "hi": "Beshak shaitaan ki chaal kamzor hai."}, "ref": "Surah An-Nisa 4:76", "url": "https://quran.com/4/76"}, {"a": {"en": "Stay close to faith and trust", "hi": "Imaan aur bharose ke qareeb raho"}, "d": {"en": "He has no authority over those who believe and rely on their Lord.", "hi": "Usko un par koi zor nahi jo imaan laaye aur apne Rab par bharosa karte hain."}, "ref": "Surah An-Nahl 16:99", "url": "https://quran.com/16/99"}], "h": [{"a": {"en": "Read Ayat al-Kursi before sleep", "hi": "Sone se pehle Ayat-ul-Kursi padho"}, "d": {"en": "Whoever recites it at bedtime has a guardian from Allah until morning.", "hi": "Jo sote waqt ise padhe, subah tak Allah ki taraf se muhaafiz rehta hai."}, "ref": "Sahih al-Bukhari 2311", "url": "https://sunnah.com/bukhari:2311"}, {"a": {"en": "Recite the three Quls morning and evening", "hi": "Subah shaam teeno Qul padho"}, "d": {"en": "Recite Al-Ikhlas, Al-Falaq and An-Nas three times morning and evening; they will suffice you against everything.", "hi": "Subah shaam teen teen baar Al-Ikhlas, Al-Falaq aur An-Nas padho, yeh har cheez se kaafi hain."}, "ref": "Sunan Abi Dawud 5082", "url": "https://sunnah.com/abudawud:5082"}, {"a": {"en": "Take the evil eye seriously", "hi": "Buri nazar ko halke mein na lo"}, "d": {"en": "The evil eye is real.", "hi": "Nazar lagna haq hai."}, "ref": "Sahih Muslim 2188", "url": "https://sunnah.com/muslim:2188"}, {"a": {"en": "Say Bismillah at home and meals", "hi": "Ghar aur khaane par Bismillah kaho"}, "d": {"en": "When you mention Allah entering your home and eating, Satan says: no place to stay and no dinner.", "hi": "Jab ghar mein daakhil hote aur khaate waqt Allah ka naam lo, toh shaitaan kehta hai: na rehne ki jagah, na khaana."}, "ref": "Sahih Muslim 2018", "url": "https://sunnah.com/muslim:2018"}]}, "career": {"q": [{"a": {"en": "After prayer, go and seek your living", "hi": "Namaaz ke baad rozi talaash karo"}, "d": {"en": "When the prayer is finished, disperse in the land and seek Allah's bounty.", "hi": "Jab namaaz ho jaaye toh zameen mein phail jaao aur Allah ka fazl talaash karo."}, "ref": "Surah Al-Jumu‘ah 62:10", "url": "https://quran.com/62/10"}, {"a": {"en": "Honour your contracts", "hi": "Apne muaahide poore karo"}, "d": {"en": "O you who believe, fulfil your contracts.", "hi": "Aye imaan walo, apne aqd poore karo."}, "ref": "Surah Al-Ma’idah 5:1", "url": "https://quran.com/5/1"}, {"a": {"en": "Be fair in every deal", "hi": "Har len-den mein insaaf karo"}, "d": {"en": "Give full measure and weigh with an even balance; that is better and fairer.", "hi": "Poora naapo aur seedhe taraazu se tolo; yahi behtar aur achha anjaam hai."}, "ref": "Surah Al-Isra 17:35", "url": "https://quran.com/17/35"}, {"a": {"en": "Work as if Allah is watching", "hi": "Aise kaam karo jaise Allah dekh raha hai"}, "d": {"en": "Do your work: Allah will see it, and so will His Messenger and the believers.", "hi": "Amal karo; Allah tumhara kaam dekhega, aur uska Rasool aur imaan wale bhi."}, "ref": "Surah At-Tawbah 9:105", "url": "https://quran.com/9/105"}], "h": [{"a": {"en": "Do everything with excellence", "hi": "Har kaam behtareen tareeqe se karo"}, "d": {"en": "Allah has prescribed excellence in everything.", "hi": "Allah ne har cheez mein ehsaan (behtareen tareeqa) farz kiya hai."}, "ref": "Sahih Muslim 1955", "url": "https://sunnah.com/muslim:1955"}, {"a": {"en": "Pay people on time", "hi": "Logon ko waqt par paisa do"}, "d": {"en": "Give the worker their wage before their sweat dries.", "hi": "Mazdoor ko uska paseena sookhne se pehle mazdoori de do."}, "ref": "Sunan Ibn Majah 2443", "url": "https://sunnah.com/ibnmajah:2443"}, {"a": {"en": "Stay honest in business", "hi": "Kaarobaar mein imaandaar raho"}, "d": {"en": "The honest, trustworthy merchant will be with the prophets, the truthful and the martyrs.", "hi": "Sachcha, amaanatdaar taajir nabiyon, siddiqeen aur shaheedon ke saath hoga."}, "ref": "Jami‘ at-Tirmidhi 1209", "url": "https://sunnah.com/tirmidhi:1209"}, {"a": {"en": "Aim to be the giving hand", "hi": "Dene wala haath bano"}, "d": {"en": "The upper hand is better than the lower hand; the upper hand gives and the lower one asks.", "hi": "Upar wala haath neeche wale se behtar hai; upar wala dene wala hai aur neeche wala maangne wala."}, "ref": "Sahih al-Bukhari 1429", "url": "https://sunnah.com/bukhari:1429"}]}, "trust": {"q": [{"a": {"en": "Know Allah is enough for you", "hi": "Jaano Allah tumhare liye kaafi hai"}, "d": {"en": "Whoever relies on Allah, He is enough for them.", "hi": "Jo Allah par bharosa kare, Allah uske liye kaafi hai."}, "ref": "Surah At-Talaq 65:3", "url": "https://quran.com/65/3"}, {"a": {"en": "Decide, then rely on Him", "hi": "Faisla karo, phir usi par bharosa"}, "d": {"en": "When you have decided, put your trust in Allah; Allah loves those who rely on Him.", "hi": "Jab iraada kar lo toh Allah par bharosa karo; Allah bharosa karne walon ko pasand karta hai."}, "ref": "Surah Aal-Imran 3:159", "url": "https://quran.com/3/159"}, {"a": {"en": "Accept what is written", "hi": "Jo likha hai use qubool karo"}, "d": {"en": "Say: nothing will befall us except what Allah has written for us. He is our Protector.", "hi": "Kaho: humein wahi pahunchega jo Allah ne humare liye likha hai. Woh humara maalik hai."}, "ref": "Surah At-Tawbah 9:51", "url": "https://quran.com/9/51"}, {"a": {"en": "Allow that the thing you dislike may be good", "hi": "Maano ki napasand cheez mein bhi bhalaai ho sakti hai"}, "d": {"en": "You may dislike something while it is good for you; Allah knows and you do not.", "hi": "Ho sakta hai tum kisi cheez ko napasand karo aur woh tumhare liye behtar ho; Allah jaanta hai, tum nahi."}, "ref": "Surah Al-Baqarah 2:216", "url": "https://quran.com/2/216"}], "h": [{"a": {"en": "Take the means, then trust", "hi": "Asbaab apnao, phir bharosa"}, "d": {"en": "Tie your camel, and trust in Allah.", "hi": "Oont baandho, aur Allah par bharosa karo."}, "ref": "Jami‘ at-Tirmidhi 2517", "url": "https://sunnah.com/tirmidhi:2517"}, {"a": {"en": "Trust like the birds", "hi": "Parindon jaisa bharosa"}, "d": {"en": "If you truly relied on Allah, He would provide for you as He provides for the birds.", "hi": "Agar tum sachcha bharosa karo toh Allah tumhe parindon ki tarah rizq de."}, "ref": "Jami‘ at-Tirmidhi 2344", "url": "https://sunnah.com/tirmidhi:2344"}, {"a": {"en": "Aim to be among those who rely on Him", "hi": "Bharosa karne walon mein shaamil hone ki koshish karo"}, "d": {"en": "Seventy thousand enter Paradise without reckoning; among their traits, they put their trust in their Lord.", "hi": "Sattar hazaar log bina hisaab jannat mein jaayenge; unki ek sifat yeh ki woh apne Rab par bharosa karte hain."}, "ref": "Sahih al-Bukhari 5705", "url": "https://sunnah.com/bukhari:5705"}, {"a": {"en": "Be mindful of Allah in ease", "hi": "Aasaani mein Allah ko yaad rakho"}, "d": {"en": "Be mindful of Allah and you will find Him before you. When you ask, ask Allah.", "hi": "Allah ka khayaal rakho, use apne saamne paaoge. Jab maango toh Allah se maango."}, "ref": "Jami‘ at-Tirmidhi 2516", "url": "https://sunnah.com/tirmidhi:2516"}]}, "home": {"q": [{"a": {"en": "See your home as a place of rest", "hi": "Ghar ko sukoon ki jagah samjho"}, "d": {"en": "Allah made your homes a place of rest for you.", "hi": "Allah ne tumhare gharon ko tumhare liye sukoon ki jagah banaaya."}, "ref": "Surah An-Nahl 16:80", "url": "https://quran.com/16/80"}, {"a": {"en": "Greet with salam when you enter", "hi": "Ghar mein daakhil ho kar salaam karo"}, "d": {"en": "When you enter houses, greet one another with a greeting from Allah, blessed and good.", "hi": "Jab gharon mein daakhil ho toh ek doosre ko salaam karo, Allah ki taraf se mubaarak aur paak dua."}, "ref": "Surah An-Nur 24:61", "url": "https://quran.com/24/61"}, {"a": {"en": "Make your home a place of prayer", "hi": "Ghar ko namaaz ki jagah banao"}, "d": {"en": "Make your houses places of prayer, and establish prayer.", "hi": "Apne gharon ko namaaz ki jagah banao aur namaaz qaayam karo."}, "ref": "Surah Yunus 10:87", "url": "https://quran.com/10/87"}, {"a": {"en": "Ask before entering others' homes", "hi": "Doosron ke ghar ijaazat le kar jaao"}, "d": {"en": "Do not enter houses other than your own until you have asked permission and greeted the people.", "hi": "Apne ghar ke ilaawa kisi ghar mein ijaazat aur salaam ke baghair daakhil na ho."}, "ref": "Surah An-Nur 24:27", "url": "https://quran.com/24/27"}], "h": [{"a": {"en": "Recite Al-Baqarah at home", "hi": "Ghar mein Surah Al-Baqarah padho"}, "d": {"en": "Do not make your houses graves. Satan flees from a house in which Surah Al-Baqarah is recited.", "hi": "Apne gharon ko qabristaan na banao. Jis ghar mein Surah Al-Baqarah padhi jaaye, shaitaan wahan se bhaagta hai."}, "ref": "Sahih Muslim 780", "url": "https://sunnah.com/muslim:780"}, {"a": {"en": "Say Bismillah as you come in", "hi": "Aate waqt Bismillah kaho"}, "d": {"en": "When you mention Allah on entering and at meals, Satan finds no place to stay and no dinner.", "hi": "Daakhil hote aur khaate waqt Allah ka naam lo, toh shaitaan ko na jagah milti hai na khaana."}, "ref": "Sahih Muslim 2018", "url": "https://sunnah.com/muslim:2018"}, {"a": {"en": "Pray your voluntary prayers at home", "hi": "Nafl namaaz ghar mein padho"}, "d": {"en": "The best prayer of a person is in their home, except the obligatory prayers.", "hi": "Farz ke ilaawa insaan ki behtareen namaaz uske ghar mein hai."}, "ref": "Sahih al-Bukhari 731", "url": "https://sunnah.com/bukhari:731"}, {"a": {"en": "Be good to your neighbours", "hi": "Padosiyon ke saath achha sulook karo"}, "d": {"en": "Whoever believes in Allah and the Last Day, let them honour their neighbour.", "hi": "Jo Allah aur aakhirat par imaan rakhta hai, woh apne padosi ki izzat kare."}, "ref": "Sahih al-Bukhari 6019", "url": "https://sunnah.com/bukhari:6019"}]}, "travel": {"q": [{"a": {"en": "Say the travel dua as you set off", "hi": "Nikalte waqt safar ki dua padho"}, "d": {"en": "Glory to the One who placed this at our service; to our Lord we will return.", "hi": "Paak hai woh jisne ise humare bas mein kiya; hum apne Rab ki taraf lautne wale hain."}, "ref": "Surah Az-Zukhruf 43:13-14", "url": "https://quran.com/43/13-14"}, {"a": {"en": "Travel with eyes open to lessons", "hi": "Seekhne ki nazar se safar karo"}, "d": {"en": "Travel through the land and see how things ended for those before.", "hi": "Zameen mein chalo phiro aur dekho pehle walon ka anjaam kya hua."}, "ref": "Surah Al-An‘am 6:11", "url": "https://quran.com/6/11"}, {"a": {"en": "Use the ease Allah gives travellers", "hi": "Musaafir ko di gayi aasaani lo"}, "d": {"en": "There is no blame on you for shortening the prayer when you travel.", "hi": "Safar mein namaaz qasr karne mein koi gunaah nahi."}, "ref": "Surah An-Nisa 4:101", "url": "https://quran.com/4/101"}, {"a": {"en": "Pack taqwa as well as supplies", "hi": "Saamaan ke saath taqwa bhi rakho"}, "d": {"en": "Take provision, but the best provision is taqwa.", "hi": "Zaad-e-raah lo, aur behtareen zaad-e-raah taqwa hai."}, "ref": "Surah Al-Baqarah 2:197", "url": "https://quran.com/2/197"}], "h": [{"a": {"en": "Make dua while travelling", "hi": "Safar mein dua karo"}, "d": {"en": "Three prayers are answered without doubt, including the prayer of the traveller.", "hi": "Teen duaayein bila shubha qubool hoti hain, unmein musaafir ki dua bhi hai."}, "ref": "Sunan Abi Dawud 1536", "url": "https://sunnah.com/abudawud:1536"}, {"a": {"en": "Choose a leader in a group", "hi": "Group mein ek ameer chuno"}, "d": {"en": "If three set out on a journey, let them appoint one as leader.", "hi": "Jab teen log safar par niklein toh ek ko ameer bana lein."}, "ref": "Sunan Abi Dawud 2608", "url": "https://sunnah.com/abudawud:2608"}, {"a": {"en": "Say Allahu Akbar going up, Subhanallah going down", "hi": "Chadhte waqt Allahu Akbar, utarte waqt Subhanallah"}, "d": {"en": "The companions said takbir when climbing and tasbih when descending.", "hi": "Sahaaba chadhaai par takbeer aur utraai par tasbeeh kehte the."}, "ref": "Sahih al-Bukhari 2993", "url": "https://sunnah.com/bukhari:2993"}, {"a": {"en": "Return home once your work is done", "hi": "Kaam ho jaaye toh ghar lauto"}, "d": {"en": "Travel is a piece of hardship; when your need is met, hurry back to your family.", "hi": "Safar azaab ka ek tukda hai; kaam poora ho toh jaldi ghar lauto."}, "ref": "Sahih al-Bukhari 1804", "url": "https://sunnah.com/bukhari:1804"}]}, "healing": {"q": [{"a": {"en": "Know who truly heals", "hi": "Jaano asal shifa kaun deta hai"}, "d": {"en": "Ibrahim (AS) said: when I am ill, He is the One who heals me.", "hi": "Ibrahim (AS) ne kaha: jab main beemaar hota hoon toh wahi mujhe shifa deta hai."}, "ref": "Surah Ash-Shu‘ara 26:80", "url": "https://quran.com/26/80"}, {"a": {"en": "Recite Qur'an as a healing", "hi": "Qur'an ko shifa samajh kar padho"}, "d": {"en": "We send down in the Qur'an that which is healing and mercy for the believers.", "hi": "Hum Qur'an mein woh utaarte hain jo imaan walon ke liye shifa aur rehmat hai."}, "ref": "Surah Al-Isra 17:82", "url": "https://quran.com/17/82"}, {"a": {"en": "Use the remedies Allah created", "hi": "Allah ki banaayi dawaaon ka faayda uthao"}, "d": {"en": "From the bees comes a drink of varying colours in which there is healing for people.", "hi": "Shehad ki makkhiyon se rang-birang mashroob nikalta hai jismein logon ke liye shifa hai."}, "ref": "Surah An-Nahl 16:69", "url": "https://quran.com/16/69"}, {"a": {"en": "Call on Him like Ayyub did", "hi": "Ayyub (AS) ki tarah usko pukaaro"}, "d": {"en": "Ayyub called his Lord, and Allah removed his suffering and restored his family.", "hi": "Ayyub (AS) ne apne Rab ko pukaara, toh Allah ne unki takleef door ki aur ghar waale lauta diye."}, "ref": "Surah Al-Anbiya 21:83-84", "url": "https://quran.com/21/83-84"}], "h": [{"a": {"en": "Seek treatment", "hi": "Ilaaj karwaao"}, "d": {"en": "Allah has not sent down a disease without sending down its cure.", "hi": "Allah ne koi beemaari nahi utaari jiska ilaaj na utaara ho."}, "ref": "Sahih al-Bukhari 5678", "url": "https://sunnah.com/bukhari:5678"}, {"a": {"en": "Take medicine without guilt", "hi": "Bina jhijhak dawa lo"}, "d": {"en": "Seek treatment, for Allah has made a cure for every disease except old age.", "hi": "Ilaaj karo, kyunki Allah ne budhaape ke siwa har beemaari ka ilaaj rakha hai."}, "ref": "Sunan Abi Dawud 3855", "url": "https://sunnah.com/abudawud:3855"}, {"a": {"en": "Visit the sick", "hi": "Beemaar ki ayaadat karo"}, "d": {"en": "Whoever visits a sick person is in the harvest of Paradise until they return.", "hi": "Jo beemaar ki ayaadat karta hai, lautne tak jannat ke baagh mein rehta hai."}, "ref": "Sahih Muslim 2568", "url": "https://sunnah.com/muslim:2568"}, {"a": {"en": "Know sickness wipes away sins", "hi": "Jaano beemaari gunaah mitaati hai"}, "d": {"en": "No hardship, illness or worry afflicts a Muslim except that Allah expiates sins through it.", "hi": "Muslim ko jo bhi takleef ya beemaari pahunche, Allah uske zariye gunaah mita deta hai."}, "ref": "Sahih al-Bukhari 5641", "url": "https://sunnah.com/bukhari:5641"}]}, "grief": {"q": [{"a": {"en": "Say Inna lillah and hold on", "hi": "Inna lillah kaho aur thaame raho"}, "d": {"en": "Give good news to the patient who say, when struck by loss, “To Allah we belong and to Him we return.”", "hi": "Sabr karne walon ko khushkhabri do, jo museebat par kehte hain: “Inna lillahi wa inna ilayhi raji‘un.”"}, "ref": "Surah Al-Baqarah 2:155-157", "url": "https://quran.com/2/155-157"}, {"a": {"en": "Pour out your grief to Allah", "hi": "Apna gham Allah ke saamne rakho"}, "d": {"en": "Ya‘qub (AS) said: I only complain of my grief and sorrow to Allah.", "hi": "Yaqoob (AS) ne kaha: main apna dard aur gham sirf Allah se kehta hoon."}, "ref": "Surah Yusuf 12:86", "url": "https://quran.com/12/86"}, {"a": {"en": "Remember this life is a passage", "hi": "Yaad rakho yeh zindagi guzargaah hai"}, "d": {"en": "Every soul will taste death, and you will receive your full reward on the Day of Resurrection.", "hi": "Har jaan maut ka maza chakhegi, aur poora badla qayaamat ke din milega."}, "ref": "Surah Aal-Imran 3:185", "url": "https://quran.com/3/185"}, {"a": {"en": "Know Allah is with you", "hi": "Jaano Allah tumhare saath hai"}, "d": {"en": "“Do not grieve; indeed Allah is with us.”", "hi": "“Gham na karo, beshak Allah humare saath hai.”"}, "ref": "Surah At-Tawbah 9:40", "url": "https://quran.com/9/40"}], "h": [{"a": {"en": "It's okay to cry", "hi": "Rona theek hai"}, "d": {"en": "When his son Ibrahim died, the Prophet ﷺ wept and said: the eyes shed tears and the heart grieves, but we say only what pleases our Lord.", "hi": "Jab unke bete Ibrahim ka inteqaal hua, Nabi ﷺ roye aur farmaaya: aankhein aansu bahaati hain, dil gham karta hai, par hum wahi kehte hain jo Rab ko pasand ho."}, "ref": "Sahih al-Bukhari 1303", "url": "https://sunnah.com/bukhari:1303"}, {"a": {"en": "Hold patience at the first moment", "hi": "Pehle lamhe mein sabr karo"}, "d": {"en": "True patience is at the first strike of the calamity.", "hi": "Asal sabr museebat ki pehli chot par hai."}, "ref": "Sahih al-Bukhari 1283", "url": "https://sunnah.com/bukhari:1283"}, {"a": {"en": "Ask for something better", "hi": "Behtar badla maango"}, "d": {"en": "Say: O Allah, reward me in my loss and replace it with something better.", "hi": "Kaho: Aye Allah, mujhe meri museebat mein ajr de aur iska behtar badla de."}, "ref": "Sahih Muslim 918", "url": "https://sunnah.com/muslim:918"}, {"a": {"en": "Trust the reward for patience", "hi": "Sabr ke ajr par yaqeen rakho"}, "d": {"en": "Allah says: My believing servant who is patient when I take a loved one has no reward except Paradise.", "hi": "Allah farmaata hai: jab main momin bande ka koi pyaara le loon aur woh sabr kare, toh uska badla sirf jannat hai."}, "ref": "Sahih al-Bukhari 6424", "url": "https://sunnah.com/bukhari:6424"}]}, "sleep": {"q": [{"a": {"en": "Treat sleep as a gift of rest", "
